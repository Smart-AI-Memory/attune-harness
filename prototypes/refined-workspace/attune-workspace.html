<style>
#aw{--bg:light-dark(#f5f6f2,#151c18);--paper:light-dark(#fff,#202923);--ink:light-dark(#263c30,#e4eee6);--muted:light-dark(#607268,#acbdb0);--line:light-dark(#dce4da,#39483e);--soft:light-dark(#eaf0e5,#2b3c30);--accent:light-dark(#285e42,#a9daba);--on:light-dark(#fff,#163321);--warn:light-dark(#83591b,#ebcd96);font:14px/1.55 system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:clip}#aw *{box-sizing:border-box}#aw button,#aw textarea,#aw input,#aw select{font:inherit;color:inherit}#aw button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px;text-align:left}#aw button:hover:not(:disabled){background:var(--soft)}#aw button:disabled{opacity:.45}#aw .primary{background:var(--accent);color:var(--on);border-color:var(--accent)}#aw .primary:hover:not(:disabled){background:var(--accent);filter:brightness(.95)}#aw .ghost{border-color:transparent;background:transparent}#aw input,#aw textarea,#aw select{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:9px;max-width:100%;min-width:0}#aw textarea,#aw input:not([type=checkbox]){width:100%}#aw textarea{resize:vertical}#aw input[type=checkbox]{accent-color:var(--accent)}#aw label.field{display:block;font-size:12px;font-weight:600;margin:15px 0 5px}#aw .check{display:flex;gap:9px;align-items:flex-start;margin:12px 0}#aw .check input{margin-top:5px}#aw header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:15px 22px;background:var(--paper);border-bottom:1px solid var(--line)}#aw .brand{font-size:16px;font-weight:700;letter-spacing:.08em}#aw .mark{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--accent);margin-right:10px;transform:rotate(-12deg)}#aw .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#aw .between{justify-content:space-between}#aw .muted{color:var(--muted)}#aw .small{font-size:12px}#aw .eyebrow{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}#aw .shell{display:grid;grid-template-columns:170px minmax(0,1fr)}#aw aside{padding:22px 10px;border-right:1px solid var(--line)}#aw aside button{width:100%;border-color:transparent;background:transparent;display:flex;gap:10px;align-items:center;margin:4px 0}#aw aside button[aria-current=page]{background:var(--soft);color:var(--accent);font-weight:600}#aw aside .eyebrow{padding:0 10px 12px}#aw main{min-width:0;padding:28px}#aw h1{font-size:29px;letter-spacing:-.04em;line-height:1.2;margin:7px 0 10px;font-weight:600}#aw h2{font-size:18px;letter-spacing:-.02em;font-weight:600;margin:0 0 8px}#aw h3{font-size:14px;font-weight:600;margin:0 0 5px}#aw p{margin:7px 0 13px}#aw .panel{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:20px;margin:16px 0}#aw .hero{background:var(--soft);border-radius:13px;padding:24px;margin:20px 0}#aw .hero h2{font-size:24px;line-height:1.25;max-width:460px}#aw .tag{display:inline-block;padding:3px 8px;border-radius:20px;background:var(--soft);color:var(--accent);font-size:11px;font-weight:500}#aw .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}#aw .two .panel{margin:0}#aw .split{display:grid;grid-template-columns:minmax(200px,.85fr) minmax(0,1.4fr);gap:18px;align-items:start}#aw .split .panel{margin:0}#aw .item{padding:14px 0;border-bottom:1px solid var(--line)}#aw .item:last-child{border:0}#aw .item p{margin:5px 0}#aw .op-row{display:block;width:100%;border-radius:10px;margin:9px 0;padding:15px}#aw .op-row strong{display:block;margin:7px 0;font-size:14px;font-weight:600}#aw .selected{border-color:var(--accent)!important;background:var(--soft)!important}#aw .filters{margin:19px 0;display:flex;gap:6px;flex-wrap:wrap}#aw .filters button{font-size:12px;padding:6px 10px}#aw .callout{border-left:3px solid var(--accent);padding:12px 15px;background:var(--soft);margin:14px 0;border-radius:0 8px 8px 0}#aw .warn{color:var(--warn)}#aw .actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}#aw details{margin:12px 0}#aw summary{font-weight:500}#aw pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace;background:var(--bg);padding:15px;border-radius:8px}#aw .guide{background:var(--soft);padding:14px 16px;border-radius:9px;margin-bottom:24px}#aw .guide p{margin:3px 0 9px}#aw .trail{display:flex;gap:7px;flex-wrap:wrap;font-size:11px;margin-top:10px;color:var(--muted)}#aw .trail span{padding:2px 7px;border-radius:10px}#aw .trail .here{background:var(--accent);color:var(--on)}#aw a{color:var(--accent);text-underline-offset:3px}#aw .footer{padding:10px 22px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}#aw .live{padding:0 28px 12px;color:var(--accent)}#aw .error{color:var(--warn);padding:0 28px 12px}#aw .compact .panel{padding:14px}#aw .spaced{margin-top:28px}#aw .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}#aw .pair p{padding:10px;background:var(--bg);border-radius:7px}#aw .sentence{border-bottom:1px solid var(--line);padding:12px 0}#aw .sentence:last-child{border:0}
@media(max-width:760px){#aw .shell{grid-template-columns:1fr}#aw aside{display:flex;flex-wrap:wrap;gap:3px;padding:10px;border-right:0;border-bottom:1px solid var(--line)}#aw aside button{width:auto;margin:0;font-size:12px;padding:7px 9px}#aw aside .eyebrow,#aw aside .aside-foot{display:none}#aw main{padding:22px 16px}#aw .split{grid-template-columns:1fr}#aw .two{grid-template-columns:1fr}#aw .split .op-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}#aw .op-row{margin:0}#aw h1{font-size:25px}#aw header{padding:14px 16px}}
@media(max-width:420px){#aw .split .op-list,#aw .pair{grid-template-columns:1fr}#aw .hero{padding:18px}#aw .hero h2{font-size:21px}}
@media(pointer:coarse){#aw button{min-height:44px}#aw textarea,#aw input,#aw select{font-size:16px}}
</style>
<div id="aw" aria-label="Attune refined workspace"><div id="aw-content"></div><div id="aw-live" class="live" role="status" aria-live="polite"></div><div id="aw-error" class="error" role="alert"></div><div class="footer">Interactive prototype · authored scenarios and sample research · no live memory, host connection or execution</div></div>
<script>
(()=>{
const root=document.getElementById('aw'),out=root.querySelector('#aw-content'),live=root.querySelector('#aw-live'),error=root.querySelector('#aw-error');
const fixtures=[
{id:'continuity',title:'Make the next session a continuation',lens:'Continuity',source:'Your written feedback · two-session demonstration',why:'Carry forward the goal, important decisions and useful next steps without repeating setup.',scope:'A reviewable handoff and a resume view for one project. Exclude automatic execution and cross-device sync.',done:'A returning user can explain the goal, last decision and next step, and correct outdated context.',next:'Sketch the handoff and test what a returning user can recover.',keep:'Preserve the reason behind each carried decision.',risk:'A handoff that remembers everything can bury the few points that matter.'},
{id:'opportunities',title:'Turn useful discoveries into chosen work',lens:'Opportunity',source:'Your written feedback · easily review and pick mined opportunities',why:'Give discoveries a visible home and let the user choose one without reconstructing its context.',scope:'An opportunity list, source details and an editable linked goal. Exclude autonomous prioritization and execution.',done:'A user can find a mined opportunity, understand why it matters, and open its linked draft without duplication.',next:'Walk one mined opportunity through selection, draft creation and reopening.',keep:'Keep source context attached when an opportunity becomes a goal.',risk:'Selecting an opportunity must not silently authorize all of its possible scope.'},
{id:'context',title:'Show why remembered context matters',lens:'Memory',source:'Your written feedback · understand and optimize for user context',why:'Make adaptation understandable by connecting context to a concrete recommendation.',scope:'Inspectable context with source, scope and per-session inclusion. Exclude automatic global-profile changes.',done:'A user can see why a recommendation was made and correct or exclude the context behind it.',next:'Compare the recommendation before and after changing one preference.',keep:'Preserve the distinction between a preference and permission.',risk:'An old session constraint should not silently become a permanent preference.'}
];
const defaults=()=>({v:4,page:'journeys',author:true,notes:{},fix:{symptom:'Saved tasks disappear from the list after switching projects.',expected:'Previously saved tasks remain visible when I return to the project.',repro:'Save a task, switch projects, then switch back.',scope:'one',cause:'known',expanded:false,saved:false},host:'Codex',guide:true,guideStep:0,selected:'continuity',filter:'available',statuses:{},drafts:{},active:null,preference:'Graphical first',constraint:'Keep the first useful slice small enough to review in one session.',contextUse:{preference:true,constraint:true,principle:true},contextRevision:1,query:'How can planning artifacts preserve context between sessions?',researched:false,evidence:[],session:1,mined:false,mine:{keep:'',pushback:'',next:'',opportunity:''},retention:{keep:'project',pushback:'next',next:'next',opportunity:'opportunity'},handoff:null,resumeExcluded:[],resolution:'',resolutionReason:'',resumed:false,export:false});
let s=defaults(),design={compact:false};
function restore(w){const p=w?.privateContent;if(p?.v===4&&p.drafts&&p.statuses)s={...defaults(),...p};}restore(window.openai?.widgetState);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(t,a,kind='',disabled=false)=>`<button type="button" class="cursor-interaction ${kind}" data-action="${a}" ${disabled?'disabled':''}>${t}</button>`;
const status=id=>s.statuses[id]||'available';
function opps(){return s.mined&&s.mine.opportunity?[...fixtures,{id:'mined',title:s.mine.opportunity,lens:'Session discovery',source:'Session 1 checkpoint · goal lens',why:'A possible follow-up uncovered while reviewing the current goal.',scope:'Investigate this discovery and define one bounded improvement before implementation.',done:'The opportunity has a clear first slice, evidence needs and a decision on whether to proceed.',next:'Compare this discovery against the original goal and current constraint.',keep:'Keep the original goal and reason visible.',risk:'A promising follow-up may still be outside the current scope.'}]:fixtures;}
const fixture=id=>opps().find(o=>o.id===id)||fixtures[0];
const draft=()=>s.active?s.drafts[s.active]:null;
function save(){try{window.openai?.setWidgetState({modelContent:{prototype:'Refined Attune workspace',simulation:true,view:s.page,session:s.session,activeOpportunity:s.active,acceptedRevision:draft()?.accepted?.rev||null},privateContent:s})?.catch(()=>{});}catch{}}
function say(t){live.textContent=t;}
function fail(t){error.textContent=t;}
function move(page){s.page=page;s.export=false;render();save();}
function title(k,h,p){return `<div class="eyebrow">${k}</div><h1>${h}</h1><p class="muted">${p}</p>`;}
function labelField(id,label,value,attr,rows=2){return `<label class="field" for="${id}">${label}</label><textarea id="${id}" ${attr} maxlength="600" rows="${rows}">${esc(value)}</textarea>`;}
function snap(d){return {rev:d.rev,goal:d.goal,scope:d.scope,done:d.done,reason:d.reason,evidence:[...d.evidence]};}
function changeDraft(d,key,value){if(d[key]===value)return;d[key]=value;d.rev++;d.reviewed=0;d.disposition='';d.reviewReason='';}
function openGoal(id){if(!s.drafts[id]){const f=fixture(id);s.drafts[id]={goal:f.title,scope:f.scope,done:f.done,reason:f.why,rev:1,reviewed:0,disposition:'',reviewReason:'',accepted:null,evidence:[]};}s.active=id;s.statuses[id]='selected';s.page='goals';s.guideStep=Math.max(s.guideStep,2);render();save();}
const guideNames=['Context','Pick an opportunity','Shape the goal','Mine & hand off','Resume'];
function guide(){if(!s.guide)return '';const n=s.guideStep,text=['Start by checking the context used to shape recommendations.','Open an opportunity, inspect its source, then choose Work on this.','Review the goal, scope and done condition. Research can help resolve uncertainty.','At a checkpoint, decide what deserves preservation and what should remain a proposal.','Open the saved handoff and reconcile anything that changed.'][n],targets=['context','opportunities','goals','sessions','sessions'];return `<section class="guide"><div class="row between"><span class="eyebrow">Getting started · ${n+1} of 5</span>${button('Hide guide','guide-off','ghost')}</div><p>${text}</p><div class="row between"><div class="trail">${guideNames.map((t,i)=>`<span class="${i===n?'here':''}">${i+1} ${t}</span>`).join('')}</div>${button('Go to '+guideNames[n].toLowerCase(),'page:'+targets[n])}</div></section>`;}
function now(){const d=draft();return title('Your workspace','Keep the useful thread.','Choose the next piece of work with its context intact.')+`<section class="hero"><div class="row between"><span class="eyebrow">${s.handoff?'A session ready to continue':d?'Your active goal':'Suggested starting point'}</span><span class="tag">${s.handoff?'Saved handoff':d?'Draft r'+d.rev:'From your feedback'}</span></div><h2 style="margin-top:14px">${esc(s.handoff?s.handoff.goal:d?d.goal:fixtures[0].title)}</h2><p>${s.handoff?'Recover the decision, inspect retained context and check what changed.':d?'Your scope, evidence and decisions are kept together.':fixtures[0].why}</p>${button(s.handoff?'Review saved handoff →':d?'Continue this goal →':'Explore this opportunity →',s.handoff?'page:sessions':d?'page:goals':'pick:continuity','primary')}</section><div class="two"><section class="panel"><div class="row between"><h2>Worth exploring</h2><span class="small muted">${opps().filter(o=>status(o.id)==='available').length} available</span></div>${opps().filter(o=>status(o.id)==='available').slice(0,2).map(o=>`<div class="item"><span class="eyebrow">${o.lens}</span><h3>${esc(o.title)}</h3>${button('Review opportunity','pick:'+o.id,'ghost')}</div>`).join('')||'<p class="muted">Your discoveries are saved in Opportunities.</p>'}${button('All opportunities →','page:opportunities')}</section><section class="panel"><h2>Context in use</h2><p>${s.contextUse.preference?esc(s.preference):'Interface preference excluded'}</p><p class="small muted">${s.contextUse.constraint?esc(s.constraint):'Delivery constraint excluded from this session.'}</p><div class="callout"><strong>How it helps</strong><p>${adaptation()}</p></div>${button('Inspect & correct context →','page:context')}</section></div>`;}
function adaptation(){return s.contextUse.preference?(s.preference==='Graphical first'?'Use a visual comparison for decisions, with terminal access kept available.':'Keep the first interaction concise in the terminal; open the companion for detailed decisions.'):'Ask about the preferred surface when it matters; no interface preference is assumed.';}
function opportunityPage(){const list=opps().filter(o=>s.filter==='all'||status(o.id)===s.filter),f=fixture(s.selected);return title('Discoveries with a next step','Opportunities','Review what the work revealed. Pick one when its value and scope make sense.')+`<div class="filters">${[['available','Available'],['selected','Selected'],['later','Later'],['dismissed','Dismissed'],['all','All']].map(([v,t])=>button(t,'filter:'+v,s.filter===v?'selected':'')).join('')}</div><div class="split"><div class="op-list">${list.map(o=>`<button type="button" class="op-row ${s.selected===o.id?'selected':''}" data-action="pick-local:${o.id}" aria-pressed="${s.selected===o.id}"><span class="eyebrow">${o.lens}</span><strong>${esc(o.title)}</strong><span class="small muted">${status(o.id)==='available'?'Ready to review':status(o.id)}</span></button>`).join('')||'<div class="panel"><h3>Nothing in this view</h3><p class="muted">Choose All to revisit your saved discoveries.</p></div>'}</div>${list.some(o=>o.id===s.selected)?`<section class="panel"><span class="tag">${f.lens} · ${status(f.id)}</span><h2 style="margin-top:14px">${esc(f.title)}</h2><p>${esc(f.why)}</p><div class="item"><h3>Where it came from</h3><p class="small muted">${esc(f.source)}</p></div><div class="item"><h3>Suggested first step</h3><p>${esc(f.next)}</p></div><details open><summary>Strongest reason to wait</summary><p>${esc(f.risk)}</p></details><div class="actions">${button(s.drafts[f.id]?'Open linked goal':'Work on this →','work:'+f.id,'primary')}<div class="row">${button('Save for later','later:'+f.id)}${button(status(f.id)==='dismissed'?'Restore':'Dismiss',(status(f.id)==='dismissed'?'restore:':'dismiss:')+f.id,'ghost')}</div></div><p class="small muted">A linked draft keeps this source and rationale. Selecting work does not start execution.</p></section>`:''}</div>`;}
function contextPage(){return title('Memory in the flow of work','Context you can inspect.','See what informs recommendations, correct it, or leave it out of this session.')+`<section class="panel"><div class="row between"><h2>Working preference</h2><span class="tag">Project scope · demo</span></div><label class="field" for="aw-pref">Preferred interface</label><select id="aw-pref" data-setting="preference">${['Graphical first','Terminal first'].map(v=>`<option ${s.preference===v?'selected':''}>${v}</option>`).join('')}</select><p class="small muted">Source: your request for a graphical app, with console integration available. Editable interpretation, not a global profile.</p><label class="check"><input type="checkbox" data-context="preference" ${s.contextUse.preference?'checked':''}>Use this preference in this session</label><div class="callout"><strong>Effect on the recommendation</strong><p id="aw-adaptation">${adaptation()}</p></div></section><section class="panel"><h2>Delivery constraint</h2>${labelField('aw-constraint','Current constraint',s.constraint,'data-setting="constraint"')}<p class="small muted">Source: authored tutorial assumption. Correct it to match the actual project.</p><label class="check"><input type="checkbox" data-context="constraint" ${s.contextUse.constraint?'checked':''}>Use this constraint in this session</label></section><section class="panel"><h2>Keep intent separate from permission</h2><p>Remember decisions and their reasons. Treat opportunities and next steps as proposals until selected.</p><p class="small muted">Source: this design conversation · project principle.</p><label class="check"><input type="checkbox" data-context="principle" ${s.contextUse.principle?'checked':''}>Carry this principle into the handoff</label></section><div class="actions">${button('View opportunities →','context-done','primary')}<span class="small muted">Edits affect current context; earlier handoffs stay unchanged.</span></div>`;}
const evidence=[{id:'spec-kit',title:'Keep specification, plan and tasks connected',source:'GitHub Spec Kit',url:'https://github.com/github/spec-kit',finding:'Its documented workflow separates specification, planning and tasks.',implication:'Make the next action traceable to the goal and its decisions.',limit:'A workflow reference does not prove the quality of a generated spec.'},{id:'web',title:'Offer another surface for the same work',source:'OpenCode web documentation',url:'https://opencode.ai/docs/web/',finding:'The documentation describes a browser interface alongside its developer tooling.',implication:'Treat the graphical companion as a view of shared work.',limit:'This does not qualify Attune integrations with Claude, Codex or Antigravity.'}];
function researchPage(){let d=draft();return title('Look inside, then outside','Research with a purpose.','Use context first. Seek external evidence when a material question remains.')+`<div class="callout"><strong>Already available</strong><p>${s.contextUse.preference?esc(s.preference)+'. ':''}${d?'Active goal: '+esc(d.goal):'No active goal selected.'}</p>${button('Inspect context','page:context','ghost')}</div><section class="panel">${labelField('aw-query','Question to investigate',s.query,'data-query="true"')}<div class="row between"><span class="small muted">Sample evidence · 2 sources · no live search</span>${button('Load sample findings','research','primary')}</div></section>`+(s.researched?evidence.map(x=>`<section class="panel"><span class="tag">External reference · authored summary</span><h2 style="margin-top:12px">${x.title}</h2><p>${x.finding}</p><a href="${x.url}" target="_blank" rel="noopener noreferrer">${x.source} ↗</a><div class="callout"><strong>Possible implication</strong><p>${x.implication}</p></div><p class="small muted">Limit: ${x.limit} Freshness has not been checked in this demo.</p>${d?`<label class="check"><input type="checkbox" data-evidence="${x.id}" ${d.evidence.includes(x.id)?'checked':''}>Include this implication in the active spec</label>`:button('Choose a goal first','page:opportunities')}</section>`).join(''):'<p class="small muted">Editing the research question clears these staged results. Already-included evidence stays on its spec until explicitly removed.</p>')+button('Return to goal','page:goals');}
function differences(d){if(!d.accepted)return '<p class="muted">No accepted baseline yet. Review the whole draft.</p>';const names={goal:'Goal',scope:'Scope',done:'Done condition',reason:'Rationale',evidence:'Evidence'};const keys=Object.keys(names).filter(k=>JSON.stringify(d[k])!==JSON.stringify(d.accepted[k]));return keys.length?keys.map(k=>`<div class="item"><h3>${names[k]}</h3><div class="pair"><p><span class="eyebrow">Accepted r${d.accepted.rev}</span><br>${esc(Array.isArray(d.accepted[k])?d.accepted[k].join(', ')||'None':d.accepted[k])}</p><p><span class="eyebrow">Current r${d.rev}</span><br>${esc(Array.isArray(d[k])?d[k].join(', ')||'None':d[k])}</p></div></div>`).join(''):'<p>This content matches the accepted baseline.</p>';}
function goalPage(){let d=draft();if(!d)return title('From discovery to intent','Choose a piece of work.','Selecting an opportunity creates an editable goal with its source and rationale attached.')+button('Browse opportunities →','page:opportunities','primary');const f=fixture(s.active),accepted=d.accepted?.rev===d.rev;return title('Goal / '+f.lens,d.goal,'A bounded scenario draft. Edits are real within this prototype; planning and review use authored examples.')+`<div class="row between"><div class="row"><label class="small" for="goal-picker">Open goal</label><select id="goal-picker">${Object.keys(s.drafts).map(id=>`<option value="${id}" ${id===s.active?'selected':''}>${esc(fixture(id).title)}</option>`).join('')}</select></div><span class="tag">${accepted?'Accepted':'Draft'} · r${d.rev}</span></div><div class="filters">${button('Research this goal','page:research')}${button('View source opportunity','pick:'+s.active)}${button('Handoff text','export')}</div>${s.export?`<pre aria-label="Goal handoff text">${esc(goalText(d,f))}</pre>`:''}<section class="panel"><h2>Intent & boundaries</h2>${[['goal','Goal'],['scope','Included and excluded scope'],['done','Done condition'],['reason','Why this work matters']].map(([k,t])=>labelField('g-'+k,t,d[k],`data-goal="${k}"`)).join('')}<p class="small muted">Each changed field creates a new revision. Prior acceptance remains in history and no longer applies to changed content.</p></section><section class="panel"><h2>Evidence behind the plan</h2>${d.evidence.length?d.evidence.map(id=>{let x=evidence.find(x=>x.id===id);return `<div class="item"><h3>${x.implication}</h3><a href="${x.url}" target="_blank" rel="noopener noreferrer">${x.source} ↗</a><p class="small muted">Linked to the done condition as planning input; implementation check: Not run.</p>${button('Remove evidence','remove:'+id,'ghost')}</div>`;}).join(''):'<p class="muted">No external evidence included. Your source opportunity and rationale remain attached.</p>'}<details><summary>Proposed implementation sequence</summary><ol><li>${esc(f.next)}</li><li>Implement the bounded scope after a separate execution decision.</li><li>Observe the done condition and retain results. No checks have run.</li></ol></details></section><section class="panel"><h2>Review the tradeoff</h2><span class="tag">Sample review prompt</span><p>${esc(f.risk)}</p><label class="field" for="review-choice">Your disposition</label><select id="review-choice" data-review="disposition"><option value="">Choose a disposition</option><option value="bounded" ${d.disposition==='bounded'?'selected':''}>The current scope addresses this</option><option value="revise" ${d.disposition==='revise'?'selected':''}>I need to revise the scope</option><option value="disagree" ${d.disposition==='disagree'?'selected':''}>I disagree, with a reason</option></select>${labelField('review-reason','Reason for the disposition',d.reviewReason,'data-review="reviewReason"')}<div class="row">${button('Record review','record-review')}${button('Accept revision '+d.rev,'accept','primary',d.reviewed!==d.rev||accepted)}</div><p class="small muted">${accepted?'This exact revision is accepted in the demo. Execution remains unauthorized.':d.reviewed===d.rev?'Review recorded for this revision.':'Record a reasoned disposition before accepting.'}</p></section><section class="panel"><h2>Since the last accepted version</h2>${differences(d)}</section><div class="actions">${button('Mine this session →','mine','primary')}<span class="small muted">Preserve learning at a meaningful checkpoint.</span></div>`;}
function goalText(d,f){return `# ${d.goal}\nRevision ${d.rev} · ${d.accepted?.rev===d.rev?'SIMULATED ACCEPTANCE':'DRAFT'}\n\nScope: ${d.scope}\nDone when: ${d.done}\nWhy: ${d.reason}\nSource: ${f.source}\nNext: ${f.next}\nEvidence: ${d.evidence.join(', ')||'None'}\nNo execution authorized. No implementation checks run.`;}
function seedMining(){if(s.mined)return;const f=fixture(s.active||'continuity');s.mine={opportunity:'Make the next required decision visible in the saved-work list.',keep:f.keep,pushback:f.risk,next:f.next};s.mined=true;}
function retained(){return ['keep','pushback','next'].filter(k=>s.retention[k]!=='exclude').map(k=>({kind:k,text:s.mine[k],scope:s.retention[k],source:'Session 1 checkpoint · '+k+' lens'}));}
function sessionPage(){if(s.handoff)return resumePage();if(!s.mined)return title('Session continuity','Finish with a useful starting point.','At a meaningful checkpoint, mine the session through four lenses: opportunities, features to preserve, pushback and next steps.')+`<section class="panel"><h2>${draft()?esc(draft().goal):'Start with a goal'}</h2><p>${draft()?'The next step is to inspect what this work revealed.':'Choose an opportunity and shape its goal before creating a handoff.'}</p>${button(draft()?'Mine the session':'Choose a goal',draft()?'mine':'page:opportunities','primary')}</section>`;return title('Session 1 / checkpoint','Keep the useful discoveries.','Correct the proposed learning and choose where each item belongs. Mining uses authored examples in this prototype.')+['opportunity','keep','pushback','next'].map(k=>`<section class="panel"><div class="row between"><h2>${{opportunity:'Opportunity',keep:'Feature to preserve',pushback:'Pushback',next:'Next step'}[k]}</h2><span class="tag">${k==='opportunity'?'Discovery':'Candidate'}</span></div>${labelField('mine-'+k,'Review '+k,s.mine[k],`data-mine="${k}"`)}<p class="small muted">Source: current goal checkpoint · ${k} lens. ${k==='opportunity'?'Visible in Opportunities, independent of handoff selection.':'A proposal to review, not an execution instruction.'}</p>${k==='opportunity'?button('Review in Opportunities','pick:mined'):`<label class="field" for="ret-${k}">Retention for ${k}</label><select id="ret-${k}" data-retain="${k}">${[['next','Next session'],['project','Project memory candidate'],['exclude','Leave out of handoff']].map(([v,t])=>`<option value="${v}" ${s.retention[k]===v?'selected':''}>${t}</option>`).join('')}</select>`}</section>`).join('')+`<div class="callout">The goal and its decision stay in task history. Selecting project memory prepares a candidate; it does not write to long-term memory.</div><div class="actions">${button('Back to goal','page:goals')}${button('Save handoff & end session 1','seal','primary')}</div>`;}
function packet(h){return `<div class="item"><strong>Goal</strong><p>${esc(h.goal)}</p></div><div class="item"><strong>Decision & reason</strong><p>${esc(h.decision)}</p></div><div class="item"><strong>Context at close</strong><p>${esc(h.preference||'Preference excluded')} · ${esc(h.constraint||'Constraint excluded')}</p></div>${h.items.map(c=>`<div class="item"><strong>${c.kind}</strong><p>${esc(c.text)}</p><span class="small muted">${c.scope} · ${c.source}</span></div>`).join('')}`;}
function resumePage(){const h=s.handoff,changed=s.contextUse.preference&&h.preference!==s.preference;return title('Session '+s.session+' / continuity',s.resumed?'You can continue without starting over.':'Here’s what the last session left you.','Inspect the sealed handoff, choose relevant context and reconcile anything that changed.')+`<section class="panel"><span class="tag">Task history · sealed Session 1</span><h2 style="margin-top:12px">${esc(h.goal)}</h2><p><strong>Decision:</strong> ${esc(h.decision)}</p><p><strong>Done when:</strong> ${esc(h.done)}</p><p class="small muted">Recovered because this is the same goal. No implementation started.</p></section><section class="panel"><h2>Context worth carrying forward</h2>${h.items.map(c=>`<div class="item"><span class="tag">${c.kind} · ${c.scope==='project'?'Project candidate':'Next session'}</span><p>${esc(c.text)}</p><p class="small muted">${c.source} · relevant to the next decision, not permission to execute.</p><label class="check"><input type="checkbox" data-resume="${c.kind}" ${s.resumeExcluded.includes(c.kind)?'':'checked'}>Use ${c.kind} in the next session</label></div>`).join('')||'<p>No mined items retained. Goal and decision remain available in task history.</p>'}</section><section class="panel"><h2>Check what changed</h2><div class="row between"><span>Earlier preference</span><strong>${esc(h.preference||'Excluded')}</strong></div><label class="field" for="resume-pref">Current preference</label><select id="resume-pref" data-setting="preference">${['Graphical first','Terminal first'].map(v=>`<option ${s.preference===v?'selected':''}>${v}</option>`).join('')}</select>${changed?`<div class="callout"><strong>This changes the presentation, not the goal.</strong><p>Choose how to use the new preference while retaining the earlier reason.</p></div><label class="field" for="resolution">Reconciliation</label><select id="resolution" data-resolution="resolution"><option value="">Choose an action</option><option value="adapt" ${s.resolution==='adapt'?'selected':''}>Adapt to the current preference</option><option value="keep" ${s.resolution==='keep'?'selected':''}>Keep the earlier presentation for this slice</option></select>${labelField('resolution-reason','Reconciliation reason',s.resolutionReason,'data-resolution="resolutionReason"')}`:'<p class="small muted">No included preference conflict. The original handoff stays unchanged.</p>'}</section><details><summary>Inspect the original handoff</summary><section class="panel">${packet(h)}</section></details>${s.resumed?`<section class="hero"><span class="eyebrow">Session 2 · proposed next action</span><h2 style="margin-top:12px">${esc(h.items.find(c=>c.kind==='next'&&!s.resumeExcluded.includes(c.kind))?.text||'Revisit the goal and choose a bounded next action.')}</h2><p>${changed?esc(s.resolutionReason):'Recovered context still fits the current preference.'}</p><p class="small muted">${s.resumeExcluded.length} item(s) excluded from working context. History remains intact.</p>${button('Continue to goal','page:goals','primary')}</section>`:button('Open session 2 with this context','resume','primary')}`;}
function whyForm(){const p=s.page;if(p==='journeys')return '';const reasons={now:['Overview','You are deciding what to do next; a form would add friction.'],opportunities:['Choice with evidence','Compare a discovery’s value, source and counter-case before opening a goal.'],goals:['Specification and decision','This goal spans scope, evidence and acceptance; those decisions belong together.'],context:['Editable context review','You are correcting or excluding existing context, not starting work.'],research:['Question, then evidence selection','A bounded question comes first. Source implications are included deliberately.'],sessions:['Handoff review with conditional clarification','Recover context first. Ask for reconciliation only when an included preference changes.'],fix:[fixLong()?'Clarification and spec draft':'Compact fix brief',fixLong()?'The cause is uncertain or the change crosses boundaries. Resolve scope and evidence before proposing execution.':'The reported fix is understood and limited to one file. A short goal, reproduction and check can be enough.']};const [kind,reason]=reasons[p]||['Task form','Use the structure the current decision needs.'];return `<details><summary class="small muted">Why this form? · ${kind}</summary><p class="small muted">${reason}</p></details>`;}
function journeyPage(){return title('Choose the work, not the form','What would you like to do?','Explore four journeys. Attune selects the form that fits the next decision and explains its choice.')+`<div class="two">${[
['opportunity','Pick an opportunity','Review a mined discovery and turn it into a scoped goal.','Choice → intent → spec review'],
['research','Research a question','Inspect existing context, then decide what outside evidence belongs in a goal.','Question → findings → evidence selection'],
['fix','Fix a problem','Describe the failure and see the form adapt to uncertainty and scope.','Triage → short brief or clarification'],
['resume','Resume saved work','Recover the last decision and reconcile what changed.','Handoff → context review → next step']
].map(([id,t,d,path])=>`<section class="panel"><span class="eyebrow">${path}</span><h2 style="margin-top:12px">${t}</h2><p>${d}</p>${button('Try '+t.toLowerCase()+' →','journey:'+id,'primary')}</section>`).join('')}</div><div class="callout"><strong>The form should earn its complexity.</strong><p>Start with the information needed for the next decision. Reveal more structure when uncertainty, scope or consequences require it.</p></div><p class="small muted">All four journeys use authored scenarios. No live AI, internet search or execution is performed.</p>`;}
function fixLong(){return s.fix.expanded||s.fix.scope==='multiple'||s.fix.cause==='unknown';}
function fixPage(){const f=s.fix,long=fixLong();return title('Fix journey / adaptive forms','Describe the failure. Keep the first step small.','Change the scope or certainty below to see why the form changes.')+`<section class="panel"><h2>Problem report</h2>${[['symptom','What is happening?'],['expected','What should happen?'],['repro','How can it be reproduced?']].map(([k,t])=>labelField('fix-'+k,t,f[k],`data-fix="${k}"`)).join('')}<div class="two"><div><label class="field" for="fix-scope">Change scope</label><select id="fix-scope" data-fix="scope"><option value="one" ${f.scope==='one'?'selected':''}>One file, no compatibility change</option><option value="multiple" ${f.scope==='multiple'?'selected':''}>Several components or compatibility risk</option></select></div><div><label class="field" for="fix-cause">Cause understood?</label><select id="fix-cause" data-fix="cause"><option value="known" ${f.cause==='known'?'selected':''}>Yes, reproduced and understood</option><option value="unknown" ${f.cause==='unknown'?'selected':''}>No, investigation needed</option></select></div></div></section><section class="panel"><span class="tag">Selected form · ${long?'Clarification + spec':'Short fix brief'}</span><h2 style="margin-top:12px">${long?'Resolve the uncertainty before implementation.':'A compact brief is enough to review this slice.'}</h2><p>${long?'Record the unknown and the next evidence-gathering action. The outcome is an investigation/spec draft, not a claim that the cause is known.':'Retain the failure, intended behavior, reproduction and validation check in one brief. A separate build decision still controls execution.'}</p>${long?labelField('fix-unknown','What remains unknown?',f.unknown||'',`data-fix="unknown"`)+labelField('fix-evidence','Next evidence-gathering action',f.evidence||'',`data-fix="evidence"`):button('Use a more detailed form','expand-fix')}<div class="callout"><strong>Validation to preserve</strong><p>Reproduce the reported failure before the change; repeat the same sequence afterwards and check the expected behavior. No check has run.</p></div>${button(long?'Save investigation draft':'Save fix brief','save-fix','primary')}</section>${f.saved?`<section class="hero"><span class="eyebrow">${long?'Investigation draft':'Fix brief'} saved in this demo</span><h2 style="margin-top:12px">${esc(f.symptom)}</h2><p><strong>Expected:</strong> ${esc(f.expected)}</p><p><strong>Reproduce:</strong> ${esc(f.repro)}</p>${long?`<p><strong>Unknown:</strong> ${esc(f.unknown)}</p><p><strong>Next evidence:</strong> ${esc(f.evidence)}</p>`:''}<p class="small muted">No diagnosis generated, files changed or execution authorized.</p>${button('Explore another journey','page:journeys')}</section>`:''}`;}
function authorPanel(){if(!s.author)return '';const inventory={journeys:'Journey cards · primary actions · navigation',now:'Continuation summary · opportunity previews · context explanation',opportunities:'Status filters · selection list · provenance · counter-case · linked-goal action',goals:'Intent fields · goal picker · evidence · review disposition · revision comparison',context:'Preference selector · editable constraint · inclusion checkboxes · explanation',research:'Research question · source links · implication checkboxes · freshness notice',sessions:'Handoff summary · retained-context checkboxes · conditional reconciliation',fix:'Problem fields · scope selector · certainty selector · conditional clarification'};return `<section class="panel" style="border-style:dashed;margin-top:0"><div class="row between"><span class="eyebrow">Author review · outside the product UI</span>${button('User preview','author-off')}</div><p class="small"><strong>Elements on this screen:</strong> ${inventory[s.page]||''}</p><div class="row">${button('Journey gallery','page:journeys')}${button('Narrow fix','demo:narrow')}${button('Uncertain fix','demo:uncertain')}${button('Changed preference','demo:changed')}</div><details><summary class="small">Review notes for ${s.page}</summary>${labelField('author-note','Your UI review notes',s.notes[s.page]||'','data-author-note="true"')}<p class="small muted">Saved with this local demo. Switching views preserves notes; nothing is sent to a service.</p></details></section>`;}
function render(){root.classList.toggle('compact',design.compact);live.textContent='';error.textContent='';const pages={journeys:journeyPage,fix:fixPage,now,opportunities:opportunityPage,goals:goalPage,context:contextPage,research:researchPage,sessions:sessionPage};out.innerHTML=`<header><div class="row"><span class="brand"><span class="mark"></span>ATTUNE</span><span class="muted small">Your work, carried forward</span></div><div class="row"><label class="small muted" for="host-choice">Entry point</label><select id="host-choice">${['Claude','Codex','Antigravity'].map(h=>`<option ${s.host===h?'selected':''}>${h}</option>`).join('')}</select><span class="tag">Prototype</span>${!s.author?button('Author review','author-on'): ''}</div></header><div class="shell"><aside aria-label="Workspace"><div class="eyebrow">Workspace</div>${[['journeys','Journeys'],['now','Now'],['opportunities','Opportunities'],['goals','Goals'],['context','Context'],['research','Research'],['sessions','Sessions']].map(([id,t])=>`<button type="button" data-action="page:${id}" aria-current="${s.page===id?'page':'false'}">${t}</button>`).join('')}<div class="aside-foot spaced"><div class="eyebrow">Learn by doing</div>${button(s.guide?'Guide is on':'Getting started','guide-on','ghost')}<p class="small muted" style="padding:0 10px">Session ${s.session}<br>Local demonstration</p></div></aside><main>${authorPanel()}${s.page==='journeys'?'':guide()}${whyForm()}${pages[s.page]()}</main></div>`;}
root.addEventListener('change',ev=>{const t=ev.target,d=draft();if(t.dataset.authorNote){s.notes[s.page]=t.value.trim();save();return;}if(t.dataset.fix){s.fix[t.dataset.fix]=t.value.trim();s.fix.saved=false;if(['scope','cause'].includes(t.dataset.fix))render();save();return;}if(t.id==='host-choice'){s.host=t.value;save();return;}if(t.id==='goal-picker'){s.active=t.value;render();save();return;}if(t.dataset.setting){s[t.dataset.setting]=t.value.trim();s.contextRevision++;s.resumed=false;s.resolution='';s.resolutionReason='';render();save();return;}if(t.dataset.context){s.contextUse[t.dataset.context]=t.checked;s.contextRevision++;s.resumed=false;render();save();return;}if(t.dataset.goal&&d){changeDraft(d,t.dataset.goal,t.value.trim());save();render();say('Saved r'+d.rev+'. Fresh review is required.');return;}if(t.dataset.review&&d){d[t.dataset.review]=t.value.trim();d.reviewed=0;save();return;}if(t.dataset.query){s.query=t.value.trim();s.researched=false;render();save();say('Research question changed. Load results for this question; included spec evidence is unchanged.');return;}if(t.dataset.evidence&&d){let arr=t.checked?[...new Set([...d.evidence,t.dataset.evidence])]:d.evidence.filter(x=>x!==t.dataset.evidence);changeDraft(d,'evidence',arr);save();say('Evidence updated in spec r'+d.rev+'. Fresh review required.');return;}if(t.dataset.mine){s.mine[t.dataset.mine]=t.value.trim();save();return;}if(t.dataset.retain){s.retention[t.dataset.retain]=t.value;save();return;}if(t.dataset.resume){s.resumeExcluded=t.checked?s.resumeExcluded.filter(x=>x!==t.dataset.resume):[...new Set([...s.resumeExcluded,t.dataset.resume])];s.resumed=false;save();return;}if(t.dataset.resolution){s[t.dataset.resolution]=t.value.trim();s.resumed=false;save();}});
root.addEventListener('click',ev=>{const el=ev.target.closest('button[data-action]');if(!el||el.disabled)return;ev.preventDefault();const a=el.dataset.action,d=draft();if(a==='author-off'||a==='author-on'){s.author=a==='author-on';render();save();return;}if(a.startsWith('demo:')){const kind=a.slice(5);if(kind==='narrow'||kind==='uncertain'){s.fix.scope=kind==='narrow'?'one':'multiple';s.fix.cause=kind==='narrow'?'known':'unknown';s.fix.expanded=false;s.fix.saved=false;move('fix');return;}if(!draft())openGoal('continuity');if(!s.handoff){seedMining();const dd=draft();s.handoff={goal:dd.goal,done:dd.done,decision:'Author demo saved decision · '+dd.reason,preference:s.preference,constraint:s.constraint,items:retained(),goalId:s.active};}s.preference=s.handoff.preference==='Terminal first'?'Graphical first':'Terminal first';s.contextUse.preference=true;s.resolution='';s.resolutionReason='';s.resumed=false;move('sessions');return;}if(a.startsWith('journey:')){const j=a.slice(8);if(j==='opportunity'){s.selected='continuity';s.filter='all';move('opportunities');return;}if(j==='fix'){move('fix');return;}if(!draft())openGoal('continuity');if(j==='research'){move('research');return;}if(j==='resume'){if(!s.handoff){seedMining();const d2=draft();s.handoff={goal:d2.goal,done:d2.done,decision:'Sample saved decision · '+d2.reason,preference:s.preference,constraint:s.constraint,items:retained(),goalId:s.active};}s.guideStep=4;move('sessions');return;}}if(a==='expand-fix'){s.fix.expanded=true;s.fix.saved=false;render();save();return;}if(a==='save-fix'){if(!s.fix.symptom.trim()||!s.fix.expected.trim()||!s.fix.repro.trim()||(fixLong()&&(!s.fix.unknown?.trim()||!s.fix.evidence?.trim()))){fail('Complete the problem report and any required clarification before saving.');return;}s.fix.saved=true;render();save();say('Draft saved locally. No execution started.');return;}if(a.startsWith('page:')){move(a.slice(5));return;}if(a.startsWith('pick:')||a.startsWith('pick-local:')){s.selected=a.split(':')[1];s.filter='all';move('opportunities');return;}if(a.startsWith('filter:')){s.filter=a.slice(7);const list=opps().filter(o=>s.filter==='all'||status(o.id)===s.filter);if(!list.some(o=>o.id===s.selected))s.selected=list[0]?.id||'';render();save();return;}if(a.startsWith('work:')){openGoal(a.slice(5));return;}for(const [prefix,value] of [['later:','later'],['dismiss:','dismissed'],['restore:','available']]){if(a.startsWith(prefix)){s.statuses[a.slice(prefix.length)]=value;s.filter='all';render();save();return;}}if(a.startsWith('remove:')&&d){changeDraft(d,'evidence',d.evidence.filter(x=>x!==a.slice(7)));render();save();return;}switch(a){case 'guide-off':s.guide=false;render();break;case 'guide-on':s.guide=true;render();break;case 'context-done':s.guideStep=Math.max(s.guideStep,1);move('opportunities');return;case 'research':if(!s.query.trim()){fail('Add a question to investigate.');return;}s.researched=true;render();say('Sample findings loaded; no live search was performed.');break;case 'export':s.export=!s.export;render();break;case 'record-review':if(!d||!d.goal.trim()||!d.scope.trim()||!d.done.trim()){fail('Complete the goal, scope and done condition.');return;}if(!['bounded','disagree'].includes(d.disposition)||!d.reviewReason.trim()){fail('Resolve the review prompt and record a reason, or revise the scope first.');return;}d.reviewed=d.rev;render();say('Review recorded for r'+d.rev+'.');break;case 'accept':if(!d||d.reviewed!==d.rev){fail('Review this revision before accepting.');return;}d.accepted=snap(d);render();say('Revision '+d.rev+' accepted in this demo. Execution is not authorized.');break;case 'mine':if(!d){move('opportunities');return;}if(s.handoff){move('sessions');return;}seedMining();s.guideStep=3;move('sessions');return;case 'seal':if(!d||!d.goal.trim()||!d.done.trim()||retained().some(c=>!c.text.trim())){fail('Complete the goal and each retained checkpoint item, or leave empty items out.');return;}s.handoff={goal:d.goal,done:d.done,decision:(d.accepted?.rev===d.rev?'Accepted r'+d.rev:'Draft r'+d.rev)+' · '+d.reason,preference:s.contextUse.preference?s.preference:null,constraint:s.contextUse.constraint?s.constraint:null,principle:s.contextUse.principle,items:retained(),goalId:s.active};s.guideStep=4;render();say('Session 1 handoff sealed. Opportunities remain available.');break;case 'resume':if(s.contextUse.preference&&s.handoff.preference!==s.preference&&(!s.resolution||!s.resolutionReason.trim())){fail('Reconcile the changed preference and record why.');return;}s.resumed=true;s.session=2;s.active=s.handoff.goalId;render();say('Session 2 context prepared. Nothing was executed.');break;}save();});
window.addEventListener('openai:set_globals',ev=>{const w=ev.detail?.globals?.widgetState;if(w&&JSON.stringify(w.privateContent)!==JSON.stringify(s)){restore(w);render();}});render();if(globalThis.Tweak){const t=new Tweak({container:root,onChange:render});t.addToggle(design,'compact',{label:'Compact spacing'});}
})();
</script>
