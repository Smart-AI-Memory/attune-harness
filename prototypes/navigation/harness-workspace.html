<style>
#harness-workspace{--h-bg:light-dark(#fff,#191d1c);--h-rail:light-dark(#f2f4f1,#141817);--h-text:light-dark(#202b27,#e8eeea);--h-muted:light-dark(#58675f,#a6b6ab);--h-line:light-dark(#dce3dc,#37433c);--h-accent:light-dark(#246346,#9ad8b1);--h-onaccent:light-dark(#fff,#112c1e);--h-soft:light-dark(#edf5ed,#22352a);--h-warn:light-dark(#765219,#f0cd8e);--h-warnbg:light-dark(#fbf4e7,#372e20);font:14px/1.5 ui-sans-serif,system-ui,sans-serif;color:var(--h-text);background:var(--h-bg);border:1px solid var(--h-line);border-radius:14px;overflow:clip;--h-space:28px}
#harness-workspace *{box-sizing:border-box}#harness-workspace button,#harness-workspace input,#harness-workspace textarea,#harness-workspace select{font:inherit}#harness-workspace button{color:inherit;border:1px solid var(--h-line);background:var(--h-bg);border-radius:8px;padding:9px 13px;text-align:left}#harness-workspace button:hover{background:var(--h-soft)}#harness-workspace button:disabled{opacity:.55;cursor:not-allowed}#harness-workspace button.h-primary{background:var(--h-accent);color:var(--h-onaccent);border-color:transparent}#harness-workspace button.h-quiet{background:transparent;border-color:transparent}#harness-workspace button[aria-current=page]{background:var(--h-soft);color:var(--h-accent)}#harness-workspace .h-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 20px;border-bottom:1px solid var(--h-line)}#harness-workspace .h-brand{font-weight:600;letter-spacing:-.4px;font-size:18px}#harness-workspace .h-mark{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:8px;background:var(--h-accent);color:var(--h-onaccent);margin-right:8px}#harness-workspace .h-small{font-size:12px;color:var(--h-muted)}#harness-workspace .h-layout{display:grid;grid-template-columns:195px minmax(0,1fr);min-height:540px}#harness-workspace aside{background:var(--h-rail);padding:20px 12px;border-right:1px solid var(--h-line)}#harness-workspace aside button{width:100%;margin-bottom:5px}#harness-workspace .h-label{text-transform:uppercase;letter-spacing:1.1px;font-size:11px;font-weight:600;color:var(--h-muted);margin:24px 10px 9px}#harness-workspace .h-project{padding:8px 10px;overflow-wrap:anywhere}#harness-workspace main{padding:var(--h-space);min-width:0}#harness-workspace h1{font:500 27px/1.2 ui-sans-serif,system-ui,sans-serif;letter-spacing:-.7px;margin:12px 0}#harness-workspace h2{font:500 17px/1.4 ui-sans-serif,system-ui,sans-serif;margin:0 0 10px}#harness-workspace h3{font:500 14px/1.5 ui-sans-serif,system-ui,sans-serif;margin:0 0 4px}#harness-workspace p{margin:8px 0 16px}#harness-workspace .h-sub{color:var(--h-muted)}#harness-workspace .h-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}#harness-workspace .h-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}#harness-workspace .h-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--h-accent);background:var(--h-soft);border-radius:5px;padding:4px 8px}#harness-workspace .h-badge.h-paused{color:var(--h-warn);background:var(--h-warnbg)}#harness-workspace .h-callout{padding:20px;background:var(--h-soft);border-radius:10px;margin:22px 0}#harness-workspace .h-callout.h-paused{background:var(--h-warnbg)}#harness-workspace .h-list{margin-top:20px}#harness-workspace .h-task{border-top:1px solid var(--h-line);padding:19px 0;display:flex;justify-content:space-between;align-items:center;gap:14px}#harness-workspace .h-task button{flex-shrink:0}#harness-workspace .h-tabs{display:flex;flex-wrap:wrap;gap:5px;border-bottom:1px solid var(--h-line);padding:8px 0 13px;margin:17px 0 24px}#harness-workspace .h-tabs button{border-color:transparent;padding:7px 11px}#harness-workspace .h-tabs button[aria-current=page]{background:var(--h-soft)}#harness-workspace .h-columns{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:26px}#harness-workspace .h-details{padding-left:20px;border-left:1px solid var(--h-line)}#harness-workspace ul,#harness-workspace ol{padding-left:20px;margin:9px 0 20px}#harness-workspace li{margin-bottom:9px}#harness-workspace label{display:block;font-weight:500;margin:18px 0 6px}#harness-workspace input,#harness-workspace textarea,#harness-workspace select{width:100%;min-width:0;color:var(--h-text);background:var(--h-bg);border:1px solid var(--h-line);border-radius:8px;padding:11px}#harness-workspace textarea{resize:vertical;min-height:90px}#harness-workspace .h-message{margin-top:18px;padding:12px 16px;border-left:3px solid var(--h-accent);background:var(--h-soft)}#harness-workspace .h-foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--h-line);padding:10px 20px;font-size:12px;color:var(--h-muted)}#harness-workspace details{border-top:1px solid var(--h-line);padding:15px 0}#harness-workspace summary{font-weight:500}#harness-workspace .h-crumb{color:var(--h-muted);font-size:12px;overflow-wrap:anywhere}#harness-workspace .h-steps{list-style:none;padding:0}#harness-workspace .h-steps li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--h-line)}#harness-workspace .h-num{flex-shrink:0;border:1px solid var(--h-line);border-radius:50%;width:25px;height:25px;text-align:center}#harness-workspace [role=alert]{color:var(--h-warn)}
@media(max-width:680px){#harness-workspace .h-layout{grid-template-columns:1fr}#harness-workspace aside{border-right:0;border-bottom:1px solid var(--h-line);display:flex;gap:6px;flex-wrap:wrap;padding:10px}#harness-workspace aside nav{display:flex;flex-wrap:wrap;gap:5px}#harness-workspace aside button{width:auto;margin:0}#harness-workspace aside .h-label,#harness-workspace aside .h-project{display:none}#harness-workspace main{padding:20px}#harness-workspace .h-columns{grid-template-columns:1fr}#harness-workspace .h-details{padding:0;border:0}#harness-workspace .h-task{flex-wrap:wrap}#harness-workspace h1{font-size:24px}}@media(pointer:coarse){#harness-workspace button{min-height:44px}#harness-workspace input,#harness-workspace textarea{font-size:16px}}
</style>
<div id="harness-workspace" aria-label="Attune Harness navigation prototype">
 <header class="h-top"><div class="h-brand"><span class="h-mark" aria-hidden="true">a</span>attune <span class="h-small">harness</span></div><span class="h-small">Interactive prototype · sample tasks</span></header>
 <div class="h-layout"><aside><button type="button" class="h-primary cursor-interaction" data-action="new">＋ New task</button><div class="h-label">Workspace</div><nav aria-label="Workspace"><button type="button" class="h-quiet cursor-interaction" data-view="home">Home</button><button type="button" class="h-quiet cursor-interaction" data-view="projects">Projects</button><button type="button" class="h-quiet cursor-interaction" data-view="settings">Settings</button></nav><div class="h-label">Current project</div><div class="h-project">attune-harness<br><span class="h-small">Local workspace</span></div></aside><main id="h-main"></main></div>
 <footer class="h-foot"><span>Local demo · no live execution</span><span id="h-location">Home</span></footer>
</div>
<script>
(()=>{
 const root=document.getElementById('harness-workspace'), main=root.querySelector('#h-main');
 const defaults=()=>({page:'home',tab:'Overview',selected:'navigation',revision:1,accepted:false,resumed:false,newTask:null,message:''});
 let state=defaults();
 const design={compact:false,placement:'Sidebar'};
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const button=(label,action,primary=false)=>`<button type="button" class="${primary?'h-primary':'h-secondary'} cursor-interaction" data-action="${action}">${label}</button>`;
 const tasks=()=>[{id:'navigation',name:'Design the navigation system',status:state.accepted?'Plan accepted':'Needs your decision',detail:'Plan · graphical workspace for Claude, Codex, and Antigravity'},{id:'paused',name:'Review the getting-started guide',status:state.resumed?'Ready to continue':'Paused',detail:'Review · saved after evidence collection'},...(state.newTask?[{id:'new',name:state.newTask.goal,status:'Draft',detail:'Plan · scope ready to review'}]:[])];
 const current=()=>tasks().find(t=>t.id===state.selected)||tasks()[0];
 function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{prototype:'Attune Harness navigation',view:state.page,section:state.tab,simulatedPlanAccepted:state.accepted,simulatedResume:state.resumed},privateContent:{version:2,state}}).catch(()=>{});}
 function restore(saved){const s=saved?.privateContent;if(s?.version===2&&s.state&&typeof s.state==='object'){state={...defaults(),...s.state};if(!['home','projects','settings','task','new'].includes(state.page))state.page='home';}}
 function list(){return `<div class="h-list">${tasks().map(t=>`<div class="h-task"><div><h3>${esc(t.name)}</h3><div class="h-small">${esc(t.detail)}</div><span class="h-badge ${t.id==='paused'&&!state.resumed?'h-paused':''}">${t.status}</span></div><button type="button" class="cursor-interaction" data-open="${t.id}">${t.id==='paused'?'Open saved task':'Open task'} →</button></div>`).join('')}</div>`;}
 function overview(t){if(t.id==='paused')return `<div class="h-callout h-paused"><h2>${state.resumed?'Ready to continue':'Paused at a safe checkpoint'}</h2><p>${state.resumed?'The saved task is selected for continuation. A connected Harness service would now validate its checkpoint and permissions.':'Evidence collection is saved. Next: assess the guide against the collected sources.'}</p>${state.resumed?'':button('Resume saved task','resume',true)}</div><div class="h-columns"><section><h2>What is already saved</h2><ul><li>Accepted review scope: the getting-started guide</li><li>Source excerpts and their references</li><li>The next unfinished step</li></ul></section><section class="h-details"><h2>Before continuation</h2><p class="h-sub">Reuse completed work. If the scope, evidence, or authorization changed, show the change before continuing.</p></section></div>`;
 if(t.id==='new')return `<h2>Your goal</h2><p>${esc(state.newTask.goal)}</p><h2>Done when</h2><p>${esc(state.newTask.criteria)}</p><div class="h-callout"><h2>Draft saved in this prototype</h2><p>A connected planner would refine scope and ask only for missing decisions.</p>${button('Edit draft','edit-new')}</div>`;
 return `<div class="h-callout"><span class="h-badge">${state.accepted?'Scope recorded in demo':'Your next decision'}</span><h2 style="margin-top:10px">${state.accepted?'Plan accepted. Ready for the next step.':'Review the proposed navigation'}</h2><p>${state.accepted?'Acceptance covers the plan. Execution would use the separately authorized participants and budget.':'One workspace for projects, plans, evidence, and decisions—alongside Claude or Codex.'}</p>${button(state.accepted?'View accepted plan':'Review plan','plan',true)}</div><div class="h-columns"><section><h2>What we are designing</h2><p class="h-sub">A graphical task workspace that helps you start work, understand progress, and continue where you left off.</p><h2>Done when</h2><ul><li>Start a task without a CLI command.</li><li>Understand and accept a specific plan.</li><li>Find a paused task and resume from its saved state.</li></ul></section><section class="h-details"><h2>Scope</h2><p>Host comparison<br>Navigation map<br>Clickable prototype</p><h2>Delivery</h2><p class="h-sub">Shared web views, shown in each host’s browser pane first.</p></section></div>`;
 }
 function plan(t){if(t.id!=='navigation')return `<h2>${t.id==='new'?'Define the scope':'Accepted review scope'}</h2><p>${t.id==='new'?esc(state.newTask.goal):'Assess the getting-started guide against the selected repository evidence.'}</p><p class="h-sub">${t.id==='new'?'This draft still needs a concrete plan.':'The saved review does not include rewriting or publishing the guide.'}</p>`;
 return `<div class="h-row"><h2>Navigation design plan</h2><span class="h-badge">Revision ${state.revision} · ${state.accepted?'Accepted in demo':'Draft'}</span></div><ol class="h-steps"><li><span class="h-num">1</span><div><h3>Verify where the UI can live</h3><span class="h-sub">Compare Claude, Codex, and Antigravity using official documentation.</span></div></li><li><span class="h-num">2</span><div><h3>Define the navigation and decisions</h3><span class="h-sub">Projects → tasks → overview, plan, activity, and evidence.</span></div></li><li><span class="h-num">3</span><div><h3>Try the three core journeys</h3><span class="h-sub">Create a task, accept its plan, and resume saved work.</span></div></li></ol><details><summary>Scope and acceptance criteria</summary><p>Deliver a host comparison, navigation specification, and interactive prototype. Claude, Codex, and Antigravity have equal priority. Each journey must retain project and task context and expose a clear next action.</p><p>Production integration, provider calls, deployment, and repository changes are outside this design increment.</p></details><details><summary>Participants and execution</summary><p>The design uses the existing session. This demonstration does not launch participants or spend a provider budget.</p></details><div class="h-actions">${state.accepted?'<span class="h-badge">Plan acceptance recorded in this demo</span>':button('Accept plan · revision '+state.revision,'accept',true)}${button('Request a revision','revise')}</div>`;
 }
 function activity(t){return `<h2>Activity</h2><ol class="h-steps"><li><span class="h-num">✓</span><div><h3>Goal captured</h3><span class="h-sub">Project and desired outcome are recorded.</span></div></li><li><span class="h-num">✓</span><div><h3>${t.id==='paused'?'Evidence collected':'Scope prepared'}</h3><span class="h-sub">${t.id==='paused'?'Saved source references are available in Evidence.':'The current scope is ready for inspection.'}</span></div></li><li><span class="h-num">→</span><div><h3>${esc(t.status)}</h3><span class="h-sub">${t.id==='paused'?'Continue from the saved checkpoint.':'Inspect the plan before work begins.'}</span></div></li></ol><p class="h-small">Illustrative activity only.</p>`;}
 function evidence(t){return `<h2>Evidence</h2><p class="h-sub">Keep documented capabilities, completed checks, and open questions distinct.</p><details open><summary>Documented host capabilities</summary><p>Codex and Claude Code desktop document local web previews. Antigravity documents Chrome browser interaction, skills, and MCP tools.</p><p>Claude documents interactive MCP connectors. Codex and Antigravity MCP UI embedding each need separate qualification.</p></details><details><summary>Prototype checks</summary><p>This interface simulates the three navigation journeys. It has no connected Harness backend.</p></details><details><summary>Still to verify in the real product</summary><p>Actual task loading, durable decisions, stale-plan rejection, reconnect behavior, and native-host accessibility.</p></details>`;}
 function render(){root.style.setProperty('--h-space',design.compact?'20px':'28px');root.dataset.placement=design.placement;root.querySelectorAll('[data-view]').forEach(b=>{if(b.dataset.view===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
 if(state.page==='home')main.innerHTML=`<div class="h-crumb">Workspace</div><h1>Pick up where you left off.</h1><p class="h-sub">Your work, its evidence, and the next decision.</p><div class="h-callout"><div class="h-row"><div><h2>${state.accepted?'Your navigation plan is accepted':'One plan needs your attention'}</h2><span class="h-sub">Design the navigation system</span></div><button type="button" class="h-primary cursor-interaction" data-open="navigation">${state.accepted?'View plan':'Review plan'} →</button></div></div><h2>Recent tasks</h2>${list()}`;
 else if(state.page==='projects')main.innerHTML=`<div class="h-crumb">Workspace / Projects</div><h1>attune-harness</h1><p class="h-sub">Tasks belonging to this local project.</p>${list()}`;
 else if(state.page==='settings')main.innerHTML=`<div class="h-crumb">Workspace / Settings</div><h1>Your workspace</h1><h2>Supported AI hosts · planned</h2><p>Claude · Codex · Antigravity</p><p class="h-sub">One task workspace across all three. Live host connections are not enabled in this prototype.</p><details open><summary>Connection</summary><p>Prototype mode. A production workspace would show its connected Harness service and last refresh here.</p></details><details><summary>Participants and budgets</summary><p>Use the project’s configured registry. Display assigned roles and execution limits before work starts.</p></details><details><summary>Input preferences</summary><p>Clicks and natural-language replies carry the same decision meaning. A text fallback stays available when an embedded interface is unavailable.</p></details>`;
 else if(state.page==='new')main.innerHTML=`<div class="h-crumb">attune-harness / New task</div><h1>What would you like to accomplish?</h1><p class="h-sub">Start with the outcome. We can refine the approach together.</p><form id="h-create"><label for="h-goal">Goal</label><textarea id="h-goal" name="goal" required maxlength="300" placeholder="Make it easier to find and resume saved work">${esc(state.newTask?.goal||'')}</textarea><label for="h-criteria">Done when</label><input id="h-criteria" name="criteria" required maxlength="300" placeholder="I can find a paused task and continue it" value="${esc(state.newTask?.criteria||'')}"><p class="h-small">Project: attune-harness · Suggested starting point: Plan</p><div class="h-actions"><button class="h-primary cursor-interaction" type="submit">Create draft</button>${button('Cancel','home')}</div></form>`;
 else {const t=current();main.innerHTML=`<div class="h-crumb">attune-harness / Tasks / ${esc(t.name)}</div><div class="h-row"><h1>${esc(t.name)}</h1><span class="h-badge ${t.status==='Paused'?'h-paused':''}">${t.status}</span></div><nav class="h-tabs" aria-label="Task sections">${['Overview','Plan','Activity','Evidence'].map(tab=>`<button type="button" class="cursor-interaction" data-tab="${tab}" ${state.tab===tab?'aria-current="page"':''}>${tab}</button>`).join('')}</nav>${state.tab==='Overview'?overview(t):state.tab==='Plan'?plan(t):state.tab==='Activity'?activity(t):evidence(t)}`;}
 if(state.message){const note=document.createElement('div');note.className='h-message';note.setAttribute('role','status');note.textContent=state.message;main.append(note);}
 root.querySelector('#h-location').textContent=state.page==='task'?`attune-harness / ${current().name} / ${state.tab}`:state.page[0].toUpperCase()+state.page.slice(1);
 }
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.type==='submit'){e.preventDefault();createDraft();return;}state.message='';if(b.dataset.view)state.page=b.dataset.view;if(b.dataset.open){state.selected=b.dataset.open;state.page='task';state.tab=b.dataset.open==='navigation'?'Plan':'Overview';}if(b.dataset.tab)state.tab=b.dataset.tab;switch(b.dataset.action){case 'new':case 'edit-new':state.page='new';break;case 'home':state.page='home';break;case 'plan':state.tab='Plan';break;case 'accept':state.accepted=true;state.message=`Revision ${state.revision} accepted in this prototype. No work was executed.`;break;case 'revise':state.revision++;state.accepted=false;state.message='New draft revision created in the prototype. Previous acceptance no longer applies.';break;case 'resume':state.resumed=true;state.message='Resume demonstrated. In the connected app, Harness validates the saved checkpoint before continuing.';break;}render();save();});
 function createDraft(){const data=new FormData(root.querySelector('#h-create')),goal=String(data.get('goal')).trim(),criteria=String(data.get('criteria')).trim();if(!goal||!criteria){state.message='Enter a goal and a done condition.';render();return;}state.newTask={goal,criteria};state.selected='new';state.page='task';state.tab='Overview';state.message='Draft created in the prototype.';render();save();}
 root.addEventListener('submit',e=>{if(e.target.id==='h-create'){e.preventDefault();createDraft();}});
 restore(window.openai?.widgetState);render();
 window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(design,'compact',{label:'Compact spacing'});}
})();
</script>
