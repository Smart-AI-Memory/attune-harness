<style>
#continuity-app{--paper:light-dark(#fff,#202623);--bg:light-dark(#f3f5f2,#171d19);--ink:light-dark(#23362c,#e4ece6);--muted:light-dark(#607268,#a5b5aa);--line:light-dark(#dce4dc,#3d4a40);--green:light-dark(#245c42,#a6dabb);--on:light-dark(#fff,#123421);--soft:light-dark(#e7efe7,#2d3d31);--amber:light-dark(#795517,#efd39b);font:14px/1.55 system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:clip}
#continuity-app *{box-sizing:border-box}#continuity-app button,#continuity-app input,#continuity-app textarea,#continuity-app select{font:inherit;color:inherit}#continuity-app button{background:var(--paper);border:1px solid var(--line);padding:9px 13px;border-radius:8px;text-align:left}#continuity-app button:hover:not(:disabled){background:var(--soft)}#continuity-app button:disabled{opacity:.45}#continuity-app .primary{background:var(--green);color:var(--on);border-color:var(--green)}#continuity-app .primary:hover:not(:disabled){filter:brightness(.95);background:var(--green)}#continuity-app .quiet{border-color:transparent;background:transparent}#continuity-app .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#continuity-app .between{justify-content:space-between}#continuity-app .brand{font-weight:650;letter-spacing:.04em}#continuity-app .top{padding:16px 22px;border-bottom:1px solid var(--line);background:var(--paper)}#continuity-app .dot{display:inline-block;width:10px;height:10px;background:var(--green);border-radius:50%;margin-right:9px}#continuity-app .badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--green)}#continuity-app .muted{color:var(--muted)}#continuity-app .small{font-size:12px}#continuity-app .layout{display:grid;grid-template-columns:190px minmax(0,1fr)}#continuity-app aside{padding:24px 14px;border-right:1px solid var(--line)}#continuity-app aside button{display:block;width:100%;margin:3px 0;background:transparent;border-color:transparent}#continuity-app aside button[aria-current=step]{background:var(--soft);color:var(--green);font-weight:600}#continuity-app .number{display:inline-grid;place-items:center;width:22px;height:22px;border:1px solid var(--line);border-radius:50%;margin-right:7px;font-size:12px}#continuity-app main{min-width:0;padding:28px 30px 24px}#continuity-app h1{font-size:27px;line-height:1.2;letter-spacing:-.035em;font-weight:600;margin:7px 0 10px}#continuity-app h2{font-size:18px;font-weight:600;margin:0 0 8px}#continuity-app h3{font-size:14px;font-weight:600;margin:0 0 6px}#continuity-app p{margin:7px 0 15px}#continuity-app .eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}#continuity-app .panel{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:20px;margin:16px 0}#continuity-app .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}#continuity-app .two .panel{margin:0}#continuity-app label.field{display:block;font-weight:500;margin:17px 0 7px}#continuity-app input:not([type=checkbox]),#continuity-app textarea,#continuity-app select{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:10px;min-width:0}#continuity-app textarea{resize:vertical;min-height:86px}#continuity-app input[type=checkbox]{accent-color:var(--green)}#continuity-app .check{display:flex;align-items:flex-start;gap:10px;margin:12px 0}#continuity-app .check input{margin-top:5px}#continuity-app .actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px;margin-top:24px}#continuity-app .callout{border-left:3px solid var(--green);padding:12px 16px;background:var(--soft);border-radius:0 7px 7px 0;margin:16px 0}#continuity-app .warning{color:var(--amber)}#continuity-app .item{padding:13px 0;border-bottom:1px solid var(--line)}#continuity-app .item:last-child{border-bottom:0}#continuity-app .item p{margin:4px 0}#continuity-app .selected{border-color:var(--green)!important;background:var(--soft)!important}#continuity-app a{color:var(--green);text-underline-offset:3px}#continuity-app .foot{padding:10px 22px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}#continuity-app pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.65 ui-monospace,monospace;background:var(--bg);padding:16px;border-radius:8px}#continuity-app .status{padding:0 30px 14px;color:var(--green)}#continuity-app [role=alert]{color:var(--amber);margin:10px 0}#continuity-app .spacer{margin-top:30px}#continuity-app details{margin:14px 0}#continuity-app summary{font-weight:500}#continuity-app .home{max-width:850px;margin:auto;padding:34px 30px}#continuity-app .step-title{min-height:82px}#continuity-app .pillrow{margin:18px 0}#continuity-app .inline-choice{width:100%;margin:6px 0}#continuity-app .history-tag{font-size:12px;color:var(--green)}#continuity-app .compact .panel{padding:13px}#continuity-app .compact .item{padding:8px 0}
@media(max-width:700px){#continuity-app .layout{grid-template-columns:1fr}#continuity-app aside{border-right:0;border-bottom:1px solid var(--line);padding:10px;display:flex;flex-wrap:wrap;gap:4px}#continuity-app aside button{width:auto;margin:0;padding:6px 9px}#continuity-app aside .aside-label{display:none}#continuity-app main,#continuity-app .home{padding:22px 16px}#continuity-app .two{grid-template-columns:1fr}#continuity-app .top{padding:14px 16px}#continuity-app h1{font-size:24px}#continuity-app .number{display:none}#continuity-app .status{padding:0 16px 14px}}
@media(pointer:coarse){#continuity-app button{min-height:44px}#continuity-app input,#continuity-app textarea,#continuity-app select{font-size:16px}}
</style>
<div id="continuity-app" aria-label="Attune getting started"><div id="continuity-content"></div><div class="status" id="continuity-status" role="status" aria-live="polite"></div><div class="foot">Guided prototype · two simulated sessions · sample evidence · no live memory writes, AI calls or execution</div></div>
<script>
(()=>{
const root=document.getElementById('continuity-app'),out=root.querySelector('#continuity-content'),notice=root.querySelector('#continuity-status');
const initial=()=>({version:1,step:0,max:0,host:'Codex',goal:'Find my saved work and continue without repeating decisions.',done:'I can reopen a task, understand its next step, and choose when to continue.',pref:'terminal',constraint:'Finish the first useful slice in one working session.',approach:'preview',reason:'A preview preserves control and helps explain what will happen next.',candidates:null,handoff:null,currentPref:'terminal',exclude:[],resolution:'',resolutionReason:'',next:'',complete:false,opportunities:false,opportunityState:'saved',opportunityDraft:null,showOpportunityDraft:false});
let s=initial(),look={compact:false};
function restore(w){if(w?.privateContent?.version===1)s={...initial(),...w.privateContent};}restore(window.openai?.widgetState);
const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b=(t,a,p=false,disabled=false)=>`<button type="button" class="cursor-interaction ${p?'primary':''}" data-act="${a}" ${disabled?'disabled':''}>${t}</button>`;
const steps=['Your context','Make progress','Mine the session','Close session 1','Recover context','Reconcile changes','Continue session 2'];
const pref=x=>x==='terminal'?'Terminal first':'Graphical first';
const approach=x=>x==='preview'?'Resume preview':'Compact task list';
function persist(){try{window.openai?.setWidgetState({modelContent:{prototype:'Two-session continuity',simulation:true,stage:steps[s.step],session:s.handoff?2:1,complete:s.complete},privateContent:s})?.catch(()=>{});}catch{}}
function msg(t){notice.textContent=t;}
function field(k,label,rows=2){return `<label class="field" for="ct-${k}">${label}</label><textarea id="ct-${k}" data-field="${k}" maxlength="500" rows="${rows}">${e(s[k])}</textarea>`;}
function title(n,h,p){return `<div class="eyebrow">${n}</div><h1>${h}</h1><p class="muted">${p}</p>`;}
function tip(t){return `<div class="callout"><span class="eyebrow">Why this matters</span><p>${t}</p></div>`;}
function nav(prev,next,label){return `<div class="actions">${prev!==null?b('← '+steps[prev],'go:'+prev):'<span></span>'}${b(label,'go:'+next,true)}</div>`;}
function seed(){return [
{id:'opportunity',kind:'Opportunity',text:'Later, group saved tasks by the decision they need.',source:'Goal lens: finding the next useful action',why:'Could reduce the time spent scanning task history.',dest:'next',status:'Proposal; outside the current slice'},
{id:'keep',kind:'Feature to preserve',text:s.approach==='preview'?'Preserve an explicit preview before resuming work.':'Preserve a concise next-action label in the task list.',source:'Session 1 approach decision and its reason',why:'Protects the useful behavior selected in this session.',dest:'project',status:'Design intent; not implementation evidence'},
{id:'pushback',kind:'Pushback',text:'Avoid adding cloud sync to this first slice; it expands the work beyond one session.',source:'Constraint lens: '+s.constraint,why:'The proposed expansion would put the delivery constraint at risk.',dest:'next',status:'Advice to reconsider, not a permanent prohibition'},
{id:'next',kind:'Next step',text:s.approach==='preview'?'Sketch the resume preview and check it against the done condition.':'Sketch the compact list and check that the next action is understandable.',source:'Next-step lens: chosen approach remains unimplemented',why:'Makes progress on the existing goal before adding new scope.',dest:'next',status:'Proposed action; execution not authorized'}];}
function valid(){return s.goal.trim()&&s.done.trim()&&s.constraint.trim();}
function go(n){if(s.handoff&&n<4){msg('Session 1 is sealed. Its original handoff is available below.');return;}if(n>0&&!valid()){msg('Add a goal, done condition and constraint first.');return;}if(n>=2&&!s.reason.trim()){msg('Record why you chose this approach first.');return;}if(n>=2&&!s.candidates)s.candidates=seed();if(n===3&&s.candidates.some(c=>c.dest!=='exclude'&&!c.text.trim())){msg('Add text to each retained candidate or exclude it.');return;}s.showOpportunityDraft=false;s.opportunities=false;s.step=n;s.max=Math.max(s.max,n);render();persist();}
function context(){return title('Session 1 · 1 of 4','Start with what matters to you.','Tutorial scenario: a saved-work navigator. Your edits personalize this scenario; no general-purpose generation is running.')+`<div class="panel">${field('goal','Goal')}${field('done','Done when')}${field('constraint','Constraint')}<label class="field" for="ct-pref">How do you prefer to work?</label><select id="ct-pref" data-pref="pref"><option value="terminal" ${s.pref==='terminal'?'selected':''}>Terminal first</option><option value="graphical" ${s.pref==='graphical'?'selected':''}>Graphical first</option></select><p class="small muted">Source: your entries in this session. This preference applies to this project demo; it does not become a global profile.</p></div>`+tip('Context includes your goal, constraints and preferences. Attune should show what it uses so you can correct it.')+nav(null,1,'Use this context →');}
function progress(){return title('Session 1 · 2 of 4','Make one useful decision.','Use a small piece of evidence, compare approaches, and retain your reason.')+`<div class="panel"><span class="badge">Sample observation</span><h2 style="margin-top:12px">A saved task can mean several things.</h2><p>A task may be waiting for an answer, ready to resume, or already complete. Showing the next action could make the list easier to use.</p><p class="small muted">Source: authored tutorial fixture, not a user study or internet finding. Open question: which presentation is clearest in practice?</p></div><div class="callout"><strong>How your context changes the proposal</strong><p>${s.pref==='terminal'?'Start with a compact terminal-friendly presentation; keep a graphical preview available when a decision needs more space.':'Start with a graphical task preview; keep the same decisions accessible from a terminal.'} Your one-session constraint favors one small slice.</p></div><div class="two">${['preview','list'].map(v=>`<div class="panel ${s.approach===v?'selected':''}"><h2>${approach(v)}</h2><p>${v==='preview'?'Show retained work and the next operation before resuming. More context, one extra view.':'Show tasks and next actions in one compact list. Faster scanning, less room for explanation.'}</p>${b(s.approach===v?'Selected':'Choose '+approach(v),'choose:'+v,s.approach===v)}</div>`).join('')}</div><div class="panel">${field('reason','Why this approach?')}<p class="small muted">This records a design decision. Nothing has been built or tested.</p></div>`+nav(0,2,'Record decision & mine context →');}
function mining(){return title('Session 1 · 3 of 4','What did this session reveal?','Keep useful distinctions: an opportunity is not a commitment, and a next step is not permission to execute.')+s.candidates.map((c,i)=>`<section class="panel"><div class="row between"><h2>${c.kind}</h2><span class="badge">${c.status}</span></div><label class="field" for="candidate-${i}">Candidate: ${c.kind}</label><textarea id="candidate-${i}" data-candidate="${i}" maxlength="400" rows="2">${e(c.text)}</textarea><p class="small muted">Source · ${e(c.source)}</p><p>${c.why}</p><label class="field" for="dest-${i}">Carry forward: ${c.kind}</label><select id="dest-${i}" data-dest="${i}">${[['next','Next session only'],['project','Project memory candidate'],['exclude','Do not carry forward']].map(([v,t])=>`<option value="${v}" ${c.dest===v?'selected':''}>${t}</option>`).join('')}</select></section>`).join('')+tip('Mining looks through several lenses: the goal, what deserves preservation, where pushback helps, and what the next session needs. You edit the result and choose its scope.')+nav(1,3,'Review the handoff →');}
function packet(h){return `<div class="panel"><h2>Task history · retained separately</h2><div class="item"><strong>Goal</strong><p>${e(h.goal)}</p></div><div class="item"><strong>Done when</strong><p>${e(h.done)}</p></div><div class="item"><strong>Decision</strong><p>${approach(h.approach)} · ${e(h.reason)}</p></div><div class="item"><strong>Context</strong><p>${pref(h.pref)} · ${e(h.constraint)}</p></div><p class="small muted">State: design chosen; no implementation started. Evidence: sample observation, not validated user research.</p></div><div class="panel"><h2>Selected context · ${h.items.length} items</h2>${h.items.length?h.items.map(c=>`<div class="item"><span class="badge">${c.kind} · ${c.dest==='project'?'Project candidate':'Next session'}</span><p>${e(c.text)}</p><p class="small muted">${e(c.source)}</p></div>`).join(''):'<p>No mined candidates selected. The goal and decision still remain in task history.</p>'}</div>`;}
function makePacket(){return {goal:s.goal,done:s.done,constraint:s.constraint,pref:s.pref,approach:s.approach,reason:s.reason,items:s.candidates.filter(c=>c.dest!=='exclude').map(c=>({...c})),excluded:s.candidates.filter(c=>c.dest==='exclude').map(c=>c.kind)};}
function close(){return title('Session 1 · 4 of 4','Leave a clear starting point.','Review exactly what the next session will receive. Ending this demo session seals this snapshot.')+packet(makePacket())+`<p class="muted small">Excluded candidates: ${s.candidates.filter(c=>c.dest==='exclude').map(c=>c.kind).join(', ')||'None'}. Project candidates remain proposals; no long-term memory is written.</p><div class="actions">${b('← Mine the session','go:2')}${b('End session 1 & open session 2','seal',true)}</div>`;}
function recover(){const h=s.handoff;return title('Session 2 · 1 of 3','Welcome back. Here’s the thread we kept.','This session reconstructs its context from the sealed handoff. Inspect what is relevant before using it.')+`<div class="panel"><span class="badge">From Session 1 task history</span><h2 style="margin-top:12px">${e(h.goal)}</h2><p><strong>Last decision:</strong> ${approach(h.approach)}</p><p><strong>Why:</strong> ${e(h.reason)}</p><p class="small muted">Retrieved because you reopened the same goal. The implementation is still unstarted.</p></div>`+h.items.map(c=>`<div class="panel"><div class="row between"><h2>${c.kind}</h2><span class="badge">${c.dest==='project'?'Project candidate':'Session handoff'}</span></div><p>${e(c.text)}</p><p class="small muted">Source · ${e(c.source)}</p><p>Why retrieved: ${c.why}</p><label class="check"><input type="checkbox" data-use="${c.id}" ${s.exclude.includes(c.id)?'':'checked'}>Use this ${c.kind.toLowerCase()} in session 2</label></div>`).join('')+(!h.items.length?'<div class="callout">No mined context was retained. Only your goal, constraints and decision were recovered.</div>':'')+`<div class="panel"><h2>Has anything changed?</h2><label class="field" for="current-pref">Current interface preference</label><select id="current-pref" data-pref="currentPref"><option value="terminal" ${s.currentPref==='terminal'?'selected':''}>Terminal first</option><option value="graphical" ${s.currentPref==='graphical'?'selected':''}>Graphical first</option></select><p class="small muted">Try changing this preference. A current instruction should be reconciled with earlier context, not silently overwrite history.</p></div><details><summary>Inspect the original, sealed handoff</summary>${packet(h)}</details>`+tip('Task history explains what happened. Retrieved memory helps decide what matters now. Excluding an item here changes this session’s working context, not the historical record.')+`<div class="actions"><span></span>${b('Check context & changes →','go:5',true)}</div>`;}
function reconcile(){let changed=s.currentPref!==s.handoff.pref;return title('Session 2 · 2 of 3',changed?'A preference changed. Keep the reason visible.':'The recovered context still fits.','Check freshness before turning remembered context into the next action.')+`<div class="panel"><div class="item row between"><span>Earlier preference</span><strong>${pref(s.handoff.pref)}</strong></div><div class="item row between"><span>Current preference</span><strong>${pref(s.currentPref)}</strong></div><div class="item"><strong>What this affects</strong><p>${changed?'The presentation of the next design slice. It does not change the goal or automatically authorize new scope.':'The proposed presentation still matches your preference. The sample evidence has not become a verified result.'}</p></div></div>`+(changed?`<div class="two">${[['adapt','Adapt the presentation','Use the current preference for the next sketch; preserve the earlier decision and reason.'],['keep','Keep the earlier presentation','Retain the prior presentation for this slice and explain the exception.']].map(([v,t,d])=>`<div class="panel ${s.resolution===v?'selected':''}"><h2>${t}</h2><p>${d}</p>${b(s.resolution===v?'Selected':'Choose '+t.toLowerCase(),'resolve:'+v,s.resolution===v)}</div>`).join('')}</div><div class="panel">${field('resolutionReason','Reason for this reconciliation')}</div>`:'<div class="callout">No preference conflict to resolve. You can still revisit recovered items and exclude what is no longer useful.</div>')+`<div class="actions">${b('← Recover context','go:4')}${b('Prepare session 2 brief →','brief',true,changed&&(!s.resolution||!s.resolutionReason.trim()))}</div>`;}
function continued(){const h=s.handoff,items=h.items.filter(c=>!s.exclude.includes(c.id)),effective=s.resolution==='keep'?h.pref:s.currentPref;return title('Session 2 · 3 of 3',s.complete?'You continued the work, not the setup.':'Ready to continue with context.','The next action is a proposal. No work is dispatched by this tutorial.')+`<div class="panel"><span class="badge">Goal retained</span><h2 style="margin-top:12px">${e(h.goal)}</h2><p><strong>Done when:</strong> ${e(h.done)}</p><p><strong>Approach:</strong> ${approach(h.approach)} · ${pref(effective)}</p><p><strong>Why this presentation:</strong> ${s.currentPref!==h.pref?e(s.resolutionReason):'Your current preference agrees with the one recorded in Session 1.'}</p><p class="small muted">${s.currentPref!==h.pref?'The preference change and its disposition are retained separately; Session 1 remains unchanged.':'Original decision reason: '+e(h.reason)}</p></div><div class="panel"><h2>Working context for this session</h2>${items.map(c=>`<div class="item"><strong>${c.kind}</strong><p>${e(c.text)}</p><span class="small muted">${c.dest==='project'?'Project candidate, not persisted':'For this next session'} · ${e(c.source)}</span></div>`).join('')||'<p>No mined items included; task history provides the starting point.</p>'}<p class="small muted">Excluded this session: ${h.items.filter(c=>s.exclude.includes(c.id)).map(c=>c.kind).join(', ')||'None'}.</p></div><div class="panel">${field('next','Proposed next action')}<p class="small muted">Edit this before continuing. Suggestions have not become authorized tasks.</p></div><details><summary>What you just learned</summary><p>Your context shaped a proposal. You retained a decision with its reason, mined the session, controlled what carried forward, and reconciled current intent with prior context.</p><p>This demo used a local handoff snapshot. Live retrieval, memory persistence and cross-host continuity still require implementation and qualification.</p></details><div class="actions">${b('← Reconcile changes','go:5')}${b(s.complete?'Tutorial complete':'Finish tutorial','finish',true,s.complete)}</div>`;}
function opportunityDraft(){const d=s.opportunityDraft;return title('From opportunity to a goal','Review your starting point.','The original opportunity remains linked. Creating this draft does not authorize execution.')+`<div class="panel"><p class="small muted">Source: Session 1 opportunity · ${e(d.source)}</p>${[['goal','Draft goal'],['scope','Proposed scope'],['done','Draft done condition']].map(([k,label])=>`<label class="field" for="od-${k}">${label}</label><textarea id="od-${k}" data-draft="${k}" maxlength="500" rows="2">${e(d[k])}</textarea>`).join('')}<p><strong>Why:</strong> ${e(d.why)}</p><p><strong>Suggested first step:</strong> sketch the grouping and compare it with the current list.</p></div><div class="actions">${b('← Opportunities','opportunities')}${b('Save draft goal','save-opp',true)}</div>`;}
function opportunities(){let c=(s.candidates||[]).find(x=>x.id==='opportunity');return title('Across your sessions','Opportunities','A durable place to revisit what the work revealed. Context selection and opportunity review are separate decisions.')+(c?`<section class="panel"><div class="row between"><h2>A clearer way to find the next decision</h2><span class="badge">${s.opportunityState==='saved'?'Saved for later':s.opportunityState==='followup'?'Selected for follow-up':'Dismissed'}</span></div><p>${e(c.text)}</p><p><strong>Why it matters:</strong> ${e(c.why)}</p><p class="small muted">Mined in Session 1 · ${e(c.source)}</p><p class="small muted">Next-session context: ${c.dest==='exclude'?'not included; still available here':s.exclude.includes(c.id)?'excluded from current working context':'included in the handoff selection'}.</p><details><summary>Review against the original goal</summary><p>${e(s.handoff?.goal||s.goal)}</p><p>Original constraint: ${e(s.handoff?.constraint||s.constraint)}</p><p>This is a possible later improvement. It is outside the first slice and has no implementation evidence.</p></details><div class="row">${b(s.opportunityDraft?'Open draft goal':'Work on this','opp-work',true)}${b('Save for later','opp:saved',false,s.opportunityState==='saved')}${b('Dismiss opportunity','opp:dismissed',false,s.opportunityState==='dismissed')}</div><p class="small muted">Selection records interest only. Scope and permission must be established before work begins. Dismissed items remain reviewable.</p></section>`:'<div class="panel"><h2>No opportunities mined yet</h2><p>Complete the first decision and mine the session. Opportunities will appear here without becoming tasks automatically.</p></div>')+b('Back to tutorial','tutorial',true);}
function render(){root.classList.toggle('compact',look.compact);notice.textContent='';out.innerHTML=`<header class="top row between"><div class="brand"><span class="dot"></span>ATTUNE <span class="muted">/ Getting started</span></div><div class="row"><label class="small" for="ct-host">Entry point</label><select id="ct-host" style="width:auto">${['Claude','Codex','Antigravity'].map(h=>`<option ${s.host===h?'selected':''}>${h}</option>`).join('')}</select><span class="badge">Session ${s.handoff?'2':'1'} · demo</span></div></header><div class="layout"><aside aria-label="Tutorial steps"><div class="eyebrow aside-label" style="padding:0 12px 12px">Continuity you control</div>${steps.map((t,i)=>`<button type="button" data-act="go:${i}" aria-current="${s.step===i?'step':'false'}" ${i>s.max||(s.handoff&&i<4)?'disabled':''}><span class="number">${i+1}</span>${t}</button>`).join('')}<div class="aside-label spacer"></div>${b('Opportunities','opportunities')}</aside><main>${s.showOpportunityDraft?opportunityDraft():s.opportunities?opportunities():[context,progress,mining,close,recover,reconcile,continued][s.step]()}</main></div>`;}
root.addEventListener('change',ev=>{let t=ev.target;if(t.id==='ct-host')s.host=t.value;if(t.dataset.draft)s.opportunityDraft[t.dataset.draft]=t.value.trim();if(t.dataset.field){s[t.dataset.field]=t.value.trim();if(!s.handoff&&s.candidates){s.candidates=null;s.max=Math.min(s.max,1);}if(t.dataset.field==='next')s.complete=false;}if(t.dataset.pref){s[t.dataset.pref]=t.value;if(t.dataset.pref==='currentPref'){s.resolution='';s.resolutionReason='';s.complete=false;s.max=4;}}if(t.dataset.candidate!==undefined)s.candidates[Number(t.dataset.candidate)].text=t.value.trim();if(t.dataset.dest!==undefined)s.candidates[Number(t.dataset.dest)].dest=t.value;if(t.dataset.use){s.exclude=t.checked?s.exclude.filter(x=>x!==t.dataset.use):[...new Set([...s.exclude,t.dataset.use])];s.next='';s.complete=false;s.max=4;}if(t.dataset.field==='resolutionReason'){const button=root.querySelector('[data-act=brief]');if(button)button.disabled=!s.resolution||!s.resolutionReason.trim();}persist();});
root.addEventListener('click',ev=>{let t=ev.target.closest('button[data-act]');if(!t||t.disabled)return;ev.preventDefault();let a=t.dataset.act;if(a==='opportunities'){s.showOpportunityDraft=false;s.opportunities=true;render();persist();return;}if(a==='tutorial'){s.showOpportunityDraft=false;s.opportunities=false;render();persist();return;}if(a==='opp-work'){const c=s.candidates.find(x=>x.id==='opportunity');if(!s.opportunityDraft)s.opportunityDraft={goal:c.text,scope:'Explore grouping saved tasks by the decision they need. Exclude cloud sync and execution changes.',done:'A user can identify the next decision from the grouped list.',source:c.source,why:c.why};s.showOpportunityDraft=true;render();persist();return;}if(a==='save-opp'){if(!s.opportunityDraft.goal||!s.opportunityDraft.scope||!s.opportunityDraft.done){msg('Complete the goal, scope and done condition.');return;}s.opportunityState='followup';s.showOpportunityDraft=false;s.opportunities=true;render();persist();msg('Draft goal saved and linked to the opportunity. No work started.');return;}if(a.startsWith('opp:')){s.opportunityState=a.slice(4);render();persist();msg('Opportunity review saved in this demo. No work started.');return;}if(a.startsWith('go:')){go(Number(a.slice(3)));return;}if(a.startsWith('choose:')){let choice=a.slice(7);if(choice!==s.approach){s.approach=choice;s.reason='';s.candidates=null;s.max=1;}render();persist();return;}if(a.startsWith('resolve:')){s.resolution=a.slice(8);render();persist();return;}if(a==='seal'){s.handoff=makePacket();s.currentPref=s.handoff.pref;s.step=4;s.max=4;render();persist();return;}if(a==='brief'){if(s.currentPref!==s.handoff.pref&&(!s.resolution||!s.resolutionReason.trim())){msg('Choose a disposition and record its reason.');return;}let next=s.handoff.items.find(c=>c.id==='next'&&!s.exclude.includes(c.id));s.next=s.next||(next?next.text:'Revisit the goal and select the next bounded action.');go(6);return;}if(a==='finish'){if(!s.next.trim()){msg('Add a proposed next action before finishing.');return;}s.complete=true;render();persist();msg('Tutorial complete. The next action remains a proposal; nothing was executed.');}});
window.addEventListener('openai:set_globals',ev=>{let w=ev.detail?.globals?.widgetState;if(w&&JSON.stringify(w.privateContent)!==JSON.stringify(s)){restore(w);render();}});render();if(globalThis.Tweak){let t=new Tweak({container:root,onChange:render});t.addToggle(look,'compact',{label:'Compact spacing'});}
})();
</script>
