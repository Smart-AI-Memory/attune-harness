<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attune · Live session mining</title><style>
#aw{--bg:light-dark(#f5f6f2,#151c18);--paper:light-dark(#fff,#202923);--ink:light-dark(#263c30,#e4eee6);--muted:light-dark(#607268,#acbdb0);--line:light-dark(#dce4da,#39483e);--soft:light-dark(#eaf0e5,#2b3c30);--accent:light-dark(#285e42,#a9daba);--on:light-dark(#fff,#163321);--warn:light-dark(#83591b,#ebcd96);font:14px/1.55 system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:clip}#aw *{box-sizing:border-box}#aw button,#aw textarea,#aw input,#aw select{font:inherit;color:inherit}#aw button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px;text-align:left}#aw button:hover:not(:disabled){background:var(--soft)}#aw button:disabled{opacity:.45}#aw .primary{background:var(--accent);color:var(--on);border-color:var(--accent)}#aw .primary:hover:not(:disabled){background:var(--accent);filter:brightness(.95)}#aw .ghost{border-color:transparent;background:transparent}#aw input,#aw textarea,#aw select{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:9px;max-width:100%;min-width:0}#aw textarea,#aw input:not([type=checkbox]){width:100%}#aw textarea{resize:vertical}#aw input[type=checkbox]{accent-color:var(--accent)}#aw label.field{display:block;font-size:12px;font-weight:600;margin:15px 0 5px}#aw .check{display:flex;gap:9px;align-items:flex-start;margin:12px 0}#aw .check input{margin-top:5px}#aw header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:15px 22px;background:var(--paper);border-bottom:1px solid var(--line)}#aw .brand{font-size:16px;font-weight:700;letter-spacing:.08em}#aw .mark{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--accent);margin-right:10px;transform:rotate(-12deg)}#aw .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#aw .between{justify-content:space-between}#aw .muted{color:var(--muted)}#aw .small{font-size:12px}#aw .eyebrow{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}#aw .shell{display:grid;grid-template-columns:170px minmax(0,1fr)}#aw aside{padding:22px 10px;border-right:1px solid var(--line)}#aw aside button{width:100%;border-color:transparent;background:transparent;display:flex;gap:10px;align-items:center;margin:4px 0}#aw aside button[aria-current=page]{background:var(--soft);color:var(--accent);font-weight:600}#aw aside .eyebrow{padding:0 10px 12px}#aw main{min-width:0;padding:28px}#aw h1{font-size:29px;letter-spacing:-.04em;line-height:1.2;margin:7px 0 10px;font-weight:600}#aw h2{font-size:18px;letter-spacing:-.02em;font-weight:600;margin:0 0 8px}#aw h3{font-size:14px;font-weight:600;margin:0 0 5px}#aw p{margin:7px 0 13px}#aw .panel{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:20px;margin:16px 0}#aw .hero{background:var(--soft);border-radius:13px;padding:24px;margin:20px 0}#aw .hero h2{font-size:24px;line-height:1.25;max-width:460px}#aw .tag{display:inline-block;padding:3px 8px;border-radius:20px;background:var(--soft);color:var(--accent);font-size:11px;font-weight:500}#aw .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}#aw .two .panel{margin:0}#aw .split{display:grid;grid-template-columns:minmax(200px,.85fr) minmax(0,1.4fr);gap:18px;align-items:start}#aw .split .panel{margin:0}#aw .item{padding:14px 0;border-bottom:1px solid var(--line)}#aw .item:last-child{border:0}#aw .item p{margin:5px 0}#aw .op-row{display:block;width:100%;border-radius:10px;margin:9px 0;padding:15px}#aw .op-row strong{display:block;margin:7px 0;font-size:14px;font-weight:600}#aw .selected{border-color:var(--accent)!important;background:var(--soft)!important}#aw .filters{margin:19px 0;display:flex;gap:6px;flex-wrap:wrap}#aw .filters button{font-size:12px;padding:6px 10px}#aw .callout{border-left:3px solid var(--accent);padding:12px 15px;background:var(--soft);margin:14px 0;border-radius:0 8px 8px 0}#aw .warn{color:var(--warn)}#aw .actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}#aw details{margin:12px 0}#aw summary{font-weight:500}#aw pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace;background:var(--bg);padding:15px;border-radius:8px}#aw .guide{background:var(--soft);padding:14px 16px;border-radius:9px;margin-bottom:24px}#aw .guide p{margin:3px 0 9px}#aw .trail{display:flex;gap:7px;flex-wrap:wrap;font-size:11px;margin-top:10px;color:var(--muted)}#aw .trail span{padding:2px 7px;border-radius:10px}#aw .trail .here{background:var(--accent);color:var(--on)}#aw a{color:var(--accent);text-underline-offset:3px}#aw .footer{padding:10px 22px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}#aw .live{padding:0 28px 12px;color:var(--accent)}#aw .error{color:var(--warn);padding:0 28px 12px}#aw .compact .panel{padding:14px}#aw .spaced{margin-top:28px}#aw .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}#aw .pair p{padding:10px;background:var(--bg);border-radius:7px}#aw .sentence{border-bottom:1px solid var(--line);padding:12px 0}#aw .sentence:last-child{border:0}
@media(max-width:760px){#aw .shell{grid-template-columns:1fr}#aw aside{display:flex;flex-wrap:wrap;gap:3px;padding:10px;border-right:0;border-bottom:1px solid var(--line)}#aw aside button{width:auto;margin:0;font-size:12px;padding:7px 9px}#aw aside .eyebrow,#aw aside .aside-foot{display:none}#aw main{padding:22px 16px}#aw .split{grid-template-columns:1fr}#aw .two{grid-template-columns:1fr}#aw .split .op-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}#aw .op-row{margin:0}#aw h1{font-size:25px}#aw header{padding:14px 16px}}
@media(max-width:420px){#aw .split .op-list,#aw .pair{grid-template-columns:1fr}#aw .hero{padding:18px}#aw .hero h2{font-size:21px}}
@media(pointer:coarse){#aw button{min-height:44px}#aw textarea,#aw input,#aw select{font-size:16px}}
</style><style>body{margin:20px auto;padding:0 14px;max-width:1120px;background:light-dark(#eef1ed,#101612);color-scheme:light dark}#aw main{padding:28px;min-width:0}#aw .shell{grid-template-columns:160px minmax(0,1fr)}#aw .quote{border-left:2px solid var(--line);padding-left:14px;color:var(--muted)}#aw textarea{min-height:80px}#aw .reading{white-space:pre-wrap;overflow-wrap:anywhere}#aw .check{align-items:center}@media(max-width:700px){#aw .shell{grid-template-columns:1fr}#aw main{padding:18px}body{margin:8px auto;padding:0 6px}}</style></head><body><div id="aw"><div id="app"></div><div id="notice" class="live" role="status" aria-live="polite"></div><div id="error" class="error" role="alert"></div><div class="footer">Local prototype · live findings are proposals · no project files, execution permissions or long-term memories are changed</div></div>
<script>
const app=document.getElementById('app'),statusEl=document.getElementById('notice'),errorEl=document.getElementById('error');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let config=null,run={phase:'ready',attempts:0},mode='live',view=location.hash==='#tutorial'?'tutorial':location.hash==='#findings'?'findings':'input',poll=null,selected=null,draft=null,handoff=null,used=false;
const key='attune-live-review-v1';let reviewed={};try{reviewed=JSON.parse(localStorage.getItem(key)||'{}');}catch{}
let demo=null;
function data(){return mode==='live'?run.result:demo;}
function rid(){return mode==='live'?(run.result?.receipt.context_sha256||'none'):'demo';}
function save(){localStorage.setItem(key,JSON.stringify(reviewed));}
function state(){return reviewed[rid()]||(reviewed[rid()]={items:{},draft:null,handoff:null});}
function btn(t,a,primary=false,disabled=false){return `<button type="button" data-action="${a}" class="${primary?'primary':''}" ${disabled?'disabled':''}>${t}</button>`;}
function field(id,label,value){return `<label class="field" for="${id}">${label}</label><textarea id="${id}" maxlength="1400" rows="3">${esc(value)}</textarea>`;}
function title(k,h,p){return `<div class="eyebrow">${k}</div><h1>${h}</h1><p class="muted">${p}</p>`;}
// Tutorial fixtures and progress are independent of live result reviews.
const tutorialKey='attune-two-session-tutorial-v1';
const tutorialDefaults=()=>({step:0,selected:false,goal:'Make mined opportunities easy to review and choose.',keep:{decision:true,preference:false},handoff:null,recovered:false});
let tutorial=tutorialDefaults();
try{const saved=JSON.parse(localStorage.getItem(tutorialKey)||'null');if(saved&&Number.isInteger(saved.step)&&saved.step>=0&&saved.step<=5&&saved.keep&&typeof saved.goal==='string')tutorial=saved;}catch{}
const lessons=[
 ['Start with context','Context preview','The source is visible before mining. A user can see what Attune knows and what it does not.'],
 ['Review discoveries','Finding review','A supported quote explains relevance. The user still decides whether the idea is useful or already done.'],
 ['Choose a goal','Goal editor','Selecting an opportunity opens only the fields needed to define its scope.'],
 ['Choose what to retain','Retention review','Decisions, preferences and unfinished work have different lifetimes. Retention is an explicit choice.'],
 ['Close session one','Handoff receipt','A saved snapshot preserves the reviewed goal and selected context. Later edits require a new snapshot.'],
 ['Recover in session two','Recovery review','Show where the context came from and let the user correct it before continuing.']
];
const tutorialFacts={decision:{kind:'Resolved decision',text:'Attune chooses forms for users; authors can inspect and demo the journeys.',why:'Preserves a settled boundary so the next session does not reopen it.'},preference:{kind:'Project preference',text:'Keep opportunities easy to find and select.',why:'Helps shape this project’s interface without assuming a global personal preference.'}};
function tutorialSave(){localStorage.setItem(tutorialKey,JSON.stringify(tutorial));}
function tutorialView(){
 const t=tutorial,h=t.handoff,lesson=lessons[t.step];
 let body='';
 if(t.step===0)body=`<div class="hero"><span class="tag">Session 1 · learn by doing</span><h2>A useful idea should survive the end of a chat.</h2><p>In this tutorial, turn one discovery into a reviewed goal and carry it into a fresh session.</p></div><section class="panel"><h2>Your example session</h2><p>“Keep opportunities easy to find and select.”</p><p>“Attune chooses forms for users; authors can inspect and demo the journeys.”</p><p>“The first mockup is complete. Next, demonstrate choosing an opportunity.”</p><div class="callout">This is an authored teaching example based on the design direction. It is separate from the saved Luna run.</div>${btn('Explore the discoveries','tutorial-next',true)}</section>`;
 if(t.step===1)body=`<section class="panel"><span class="tag">Opportunity · proposed</span><h2 style="margin-top:12px">Make discoveries easy to choose</h2><p>Give users a persistent place to review mined opportunities and start a goal from one.</p><blockquote class="quote">“Keep opportunities easy to find and select.”</blockquote>${btn(t.selected?'Continue with this opportunity':'Choose this opportunity','tutorial-select',true)}</section><div class="two"><section class="panel"><span class="tag">Resolved decision</span><p>Attune selects user forms; authors inspect journeys.</p><p class="small muted">Keep this boundary. It is not a new open question.</p></section><section class="panel"><span class="tag">Completed work</span><p>The first mockup is complete.</p><p class="small muted">Do not present it again as work to start.</p></section></div>`;
 if(t.step===2)body=`<section class="panel">${field('tutorial-goal','Your goal',t.goal)}<p><strong>Scope:</strong> opportunity list, source evidence and a linked draft.</p><p><strong>Done when:</strong> a user can select a discovery and reopen its reviewed goal.</p><details><summary>Source of this goal</summary><blockquote class="quote">Keep opportunities easy to find and select.</blockquote><p>Selected from the tutorial’s opportunity card. This draft remains editable.</p></details>${btn('Review what carries forward','tutorial-next',true)}</section>`;
 if(t.step===3)body=`<section class="panel"><h2>Keep the useful context</h2><p>The selected goal will travel with its source. Choose additional knowledge for this project.</p>${Object.entries(tutorialFacts).map(([id,f])=>`<label class="check"><input type="checkbox" id="tutorial-keep-${id}" ${t.keep[id]?'checked':''}><span><strong>${f.kind}</strong><br>${f.text}<br><span class="small muted">${f.why}</span></span></label>`).join('')}<div class="callout"><strong>Stays out:</strong> the full transcript, unselected suggestions, and completed mockup work. Selecting a memory does not authorize execution.</div>${btn('Save and close session one','tutorial-save',true)}</section>`;
 if(t.step===4)body=h?`<section class="panel"><span class="tag">Session 1 saved · browser only</span><h2 style="margin-top:12px">Ready for a fresh start.</h2><p><strong>${esc(h.goal)}</strong></p><p>${h.facts.length} additional context item${h.facts.length===1?'':'s'} retained with the source and completion condition.</p><p class="small muted">Saved ${esc(new Date(h.savedAt).toLocaleString())}. Reloading this page keeps the snapshot. No production memory store was changed.</p>${btn('Start session two','tutorial-resume',true)}</section>`:btn('Review retention','tutorial-retention',true);
 if(t.step===5)body=h?`<section class="panel"><span class="tag">Session 2 · recovered from session 1</span><h2 style="margin-top:12px">${esc(h.goal)}</h2><p><strong>Done when:</strong> ${esc(h.done)}</p>${h.facts.map(f=>`<div class="item"><span class="tag">${esc(f.kind)}</span><p>${esc(f.text)}</p></div>`).join('')}<details><summary>Inspect the handoff source</summary><blockquote class="quote">${esc(h.quote)}</blockquote><p class="small muted">Authored tutorial · saved ${esc(h.savedAt)} · scope: this project only.</p></details><div class="callout">${h.facts.some(f=>f.kind==='Resolved decision')?'The form-selection decision is available as settled context.':'The form-selection decision was not retained; the next session must not assume it.'} Unselected content is absent from this packet.</div><label class="check"><input type="checkbox" id="tutorial-confirm" ${t.recovered?'checked':''}>I reviewed the recovered context and it is still accurate.</label>${t.recovered?'<h2>Tutorial complete</h2><p>You traced an idea from source to selection, retention and recovery. In a real task, the next step is reviewing a plan before execution.</p>':''}<div class="row">${btn('Correct the goal','tutorial-edit')}${btn('Return to live findings','findings',t.recovered)}</div></section>`:btn('Review retention','tutorial-retention',true);
 return title('Getting started · authored tutorial',lesson[0],`Step ${t.step+1} of 6 · ${t.step<5?'Session 1':'Session 2'}`)+`<div class="trail">${lessons.map((l,i)=>`<span class="${i===t.step?'here':''}">${i+1}. ${l[1]}</span>`).join('')}</div>`+body+`<details class="panel"><summary>Author view · why this form?</summary><p><strong>${lesson[1]}:</strong> ${lesson[2]}</p><p class="small muted">Attune chooses the next form from the current task state. These controls explain the journey for its author.</p></details><div class="row">${t.step>0?btn('Previous step','tutorial-back'):''}</div>`;
}
app.addEventListener('input',ev=>{if(ev.target.id==='tutorial-goal'){tutorial.goal=ev.target.value;tutorialSave();}});
app.addEventListener('change',ev=>{const id=ev.target.id;if(id.startsWith('tutorial-keep-')){tutorial.keep[id.slice(14)]=ev.target.checked;tutorialSave();}if(id==='tutorial-confirm'){tutorial.recovered=ev.target.checked;tutorialSave();render();}});
app.addEventListener('click',ev=>{
 const action=ev.target.closest('button[data-action]')?.dataset.action;
 if(!action?.startsWith('tutorial-'))return;
 errorEl.textContent='';
 if(action==='tutorial-next'){if(tutorial.step===2&&!tutorial.goal.trim()){errorEl.textContent='Give the goal a name before continuing.';return;}tutorial.step++;}
 if(action==='tutorial-select'){tutorial.selected=true;tutorial.step=2;}
 if(action==='tutorial-back')tutorial.step=Math.max(0,tutorial.step-1);
 if(action==='tutorial-edit'){tutorial.step=2;tutorial.recovered=false;}
 if(action==='tutorial-retention')tutorial.step=3;
 if(action==='tutorial-save'){tutorial.handoff={goal:tutorial.goal,done:'A user can select a discovery and reopen its reviewed goal.',quote:'Keep opportunities easy to find and select.',facts:Object.entries(tutorialFacts).filter(([id])=>tutorial.keep[id]).map(([,f])=>({...f})),savedAt:new Date().toISOString()};tutorial.step=4;tutorial.recovered=false;}
 if(action==='tutorial-resume')tutorial.step=5;
 tutorialSave();view='tutorial';history.replaceState(null,'','#tutorial');render();
});
function input(){return title('Preview before sending','Mine the useful context.','Review the excerpt. This is the selected source material and task instruction. Codex also supplies its own runtime instructions.')+`<section class="panel"><div class="row between"><h2>${mode==='live'?'Live run · existing Codex connection':'Demo · authored example'}</h2><span class="tag">${mode==='live'?config.model:'No model call'}</span></div><p>${mode==='live'?'ChatGPT-authenticated Codex · one attempt · 90-second timeout · no automatic retry. Uses Codex usage; no dollar cost estimate is available.':'Explore the same review controls using sample content. This is never substituted for failed live output.'}</p><label class="field" for="context">Selected session context</label><textarea id="context" maxlength="6000" rows="13" ${run.phase==='running'&&mode==='live'?'disabled':''}>${esc(config.context)}</textarea><p class="small muted">An explicitly selected, lightly edited excerpt of your product-design feedback. Not your full conversation, files or private memory.</p><details><summary>Exact extraction instruction</summary><p class="reading small">${esc(config.instructions)}</p><p class="small muted">The model must return opportunities, features to keep, pushback and next steps, with exact supporting quotes and draft fields for opportunities.</p></details><div class="actions"><span class="small muted">No browsing, shell execution or memory retrieval requested.</span>${btn(mode==='live'?'Run live mining':'Load demo findings',mode==='live'?'run':'demo',true,mode==='live'&&run.attempts>0)}</div>${mode==='live'&&run.attempts>0?`<p class="small muted">Live attempt used · ${run.phase}. ${run.phase==='completed'?'The completed output is available under Findings.':'Restarting the service would allow another attempt; none is scheduled.'}</p>`:''}</section>`;}
function findings(){let d=data();if(!d)return title('Session mining',run.phase==='running'?'Reading the selected context…':'No findings yet.',run.phase==='failed'?run.error:'Start from the context preview.')+btn('Back to context','input');let st=state();return title(mode==='live'?'Live model output':'Demo content','What the session revealed.',d.content.summary)+`<div class="panel row between"><span class="tag">${mode==='live'?'Live · '+d.receipt.model:'Authored demo'}</span><span class="small muted">${mode==='live'?d.receipt.elapsed_seconds+' seconds · quotes validated against input':'No model or live evidence'}</span>${btn('Inspect run receipt','receipt')}</div>`+(d.content.items.length?d.content.items.map((item,i)=>{let edit=st.items[i]||{},dismiss=edit.dismissed;return `<section class="panel"><div class="row between"><span class="tag">${item.kind.replaceAll('_',' ')}</span><span class="small muted">${dismiss?'Dismissed':edit.proposal?'Edited by you':'AI proposal · review needed'}</span></div><h2 style="margin-top:12px">${esc(item.title)}</h2>${field('proposal-'+i,'Review proposal '+(i+1),edit.proposal??item.proposal)}<p>${esc(item.rationale)}</p><details><summary>Why this was suggested</summary><blockquote class="quote">${esc(item.quote)}</blockquote><p class="small muted">Exact excerpt from the submitted context. This supports relevance; it is not proof the proposal is correct.</p></details><div class="row">${item.kind==='opportunity'?btn('Work on this →','select:'+i,true,dismiss):''}${btn(dismiss?'Restore':'Dismiss',(dismiss?'restore:':'dismiss:')+i)}</div></section>`;}).join(''):'<div class="panel"><h2>No useful findings returned</h2><p>The run completed without supported candidates. No sample results were inserted.</p></div>');}
function draftView(){const st=state(),d=st.draft;if(!d)return title('Selected opportunity','Choose an opportunity first.','Review its evidence before making it a goal.')+btn('Review findings','findings',true);return title('Opportunity → draft goal','Make the scope yours.','The model proposed this draft. Your edits and the source remain attached.')+`<section class="panel">${field('draft-goal','Draft goal',d.goal)}${field('draft-scope','Scope and exclusions',d.scope)}${field('draft-done','Done condition',d.done)}<details><summary>Original source and model proposal</summary><blockquote class="quote">${esc(d.quote)}</blockquote><p>${esc(d.proposal)}</p></details><p class="small muted">Creating a handoff records your reviewed draft, not an accepted spec or execution grant.</p><div class="actions">${btn('Back to findings','findings')}${btn('Save reviewed handoff','handoff',true)}</div></section>`;}
function resumeView(){const h=state().handoff;if(!h)return title('Continuity','No reviewed handoff yet.','Select an opportunity and review its draft before saving a handoff.')+btn('Open draft','draft',true);return title('Second session · local handoff','Continue with the useful points intact.','This view reloads the handoff you saved. It does not run a second model call.')+`<section class="panel"><span class="tag">Reviewed draft · ${h.origin}</span><h2 style="margin-top:14px">${esc(h.goal)}</h2><p><strong>Scope:</strong> ${esc(h.scope)}</p><p><strong>Done when:</strong> ${esc(h.done)}</p><details><summary>Why this goal exists</summary><blockquote class="quote">${esc(h.quote)}</blockquote><p>${esc(h.proposal)}</p></details><label class="check"><input id="use-handoff" type="checkbox" ${used?'checked':''}>Use this reviewed context for the next session</label><p class="small muted">${used?'Context selected for continuation. Execution remains unauthorized.':'Inspect the source and boundaries before using this context.'}</p>${btn('Revise the draft','draft')}</section>`;}
function receiptView(){let d=data();return title('Evidence','What actually ran.','Provider usage is shown only when returned. Local validation is not model-quality qualification.')+`<pre>${esc(JSON.stringify(d?.receipt||{phase:run.phase,error:run.error},null,2))}</pre>`+btn('Back to findings','findings');}
function render(){if(!config){app.innerHTML='<main><h1>Connecting to the local prototype…</h1></main>';return;}app.innerHTML=`<header><span class="brand"><span class="mark"></span>ATTUNE <span class="small muted">/ Session mining</span></span><div class="row">${view==='tutorial'?'<span class="tag">Authored tutorial · no model call</span>':`<label for="mode">Mode</label><select id="mode"><option value="live" ${mode==='live'?'selected':''}>Live AI</option><option value="demo" ${mode==='demo'?'selected':''}>Demo</option></select><span class="tag">${mode==='live'?run.phase:'Authored fixture'}</span>`}</div></header><div class="shell"><aside>${[['tutorial','Getting started'],['input','Context preview'],['findings','Findings'],['draft','Draft goal'],['resume','Next session'],['receipt','Run receipt']].map(([id,t])=>`<button type="button" data-action="${id}" aria-current="${view===id?'page':'false'}">${t}</button>`).join('')}</aside><main>${({tutorial:tutorialView,input,findings,draft:draftView,resume:resumeView,receipt:receiptView})[view]()}</main></div>`;}
async function refresh(){try{const res=await fetch('/api/status');if(!res.ok)throw Error('Status unavailable');run=await res.json();if(run.phase==='running'){poll=setTimeout(refresh,1000);}else{if(mode==='live'&&view==='findings')render();if(run.phase==='failed')errorEl.textContent=run.error;} }catch(e){errorEl.textContent='Connection lost. Your reviewed edits remain local. Reload to check the run; no new call is started.';}}
app.addEventListener('change',ev=>{const t=ev.target;if(t.id==='mode'){mode=t.value;view='input';errorEl.textContent='';render();return;}if(t.id==='context'){config.context=t.value;return;}if(t.id.startsWith('proposal-')){const i=t.id.slice(9),st=state();st.items[i]={...st.items[i],proposal:t.value};save();statusEl.textContent='Proposal edits saved locally.';return;}if(t.id.startsWith('draft-')){state().draft[t.id.slice(6)]=t.value;save();return;}if(t.id==='use-handoff'){used=t.checked;render();}});
app.addEventListener('click',async ev=>{const el=ev.target.closest('button[data-action]');if(!el)return;const a=el.dataset.action;if(a.startsWith('tutorial-'))return;errorEl.textContent='';statusEl.textContent='';if(['tutorial','input','findings','draft','resume','receipt'].includes(a)){view=a;history.replaceState(null,'','#'+a);render();return;}if(a==='run'){if(!config.context.trim()){errorEl.textContent='Select context before running.';return;}el.disabled=true;try{const res=await fetch('/api/mine',{method:'POST',headers:{'Content-Type':'application/json','X-Attune-Token':config.token},body:JSON.stringify({context:config.context})});const body=await res.json();if(!res.ok)throw Error(body.error);run={phase:'running',attempts:1};view='findings';render();refresh();}catch(e){errorEl.textContent=e.message;el.disabled=false;}return;}if(a==='demo'){const quote='Users should easily access and review mined opportunities so they can pick one.';demo={context:quote,content:{summary:'Authored example: make discoveries easy to select.',items:[{kind:'opportunity',title:'Keep mined opportunities visible',proposal:'Provide a persistent opportunity list with source details and a Work on this action.',rationale:'A visible collection lets a user choose later without reconstructing the session.',quote,draft_goal:'Make mined opportunities easy to review and select.',draft_scope:'A list, source details and a linked draft; exclude automatic execution.',draft_done:'A user can select a discovery and reopen the same editable draft.'}]},receipt:{mode:'demo',model:null}};view='findings';render();return;}const st=state();if(a.startsWith('dismiss:')||a.startsWith('restore:')){const [action,i]=a.split(':');st.items[i]={...st.items[i],dismissed:action==='dismiss'};save();render();return;}if(a.startsWith('select:')){const i=Number(a.split(':')[1]),item=data().content.items[i];if(st.items[i]?.dismissed)return;if(!st.draft||st.draft.index!==i)st.draft={index:i,goal:item.draft_goal,scope:item.draft_scope,done:item.draft_done,proposal:st.items[i]?.proposal??item.proposal,quote:item.quote};view='draft';save();render();return;}if(a==='handoff'){const d=st.draft;if(!d||!d.goal.trim()||!d.scope.trim()||!d.done.trim()){errorEl.textContent='Complete the goal, scope and done condition.';return;}st.handoff={...d,origin:mode==='live'?'Live Codex result, reviewed by user':'Demo fixture',saved_at:new Date().toISOString(),receipt:data().receipt};save();used=false;view='resume';render();}});
(async()=>{try{const res=await fetch('/api/config');config=await res.json();await refresh();render();}catch(e){errorEl.textContent='Local service is unavailable. Start server.py and reopen this page.';}})();
</script></body></html>
