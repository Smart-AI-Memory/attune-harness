<style>
#attune-spec{--paper:light-dark(#fff,#202623);--bg:light-dark(#f3f5f2,#171d19);--ink:light-dark(#23362c,#e4ece6);--muted:light-dark(#607268,#a5b5aa);--line:light-dark(#dce4dc,#3d4a40);--green:light-dark(#245c42,#a6dabb);--on:light-dark(#fff,#123421);--soft:light-dark(#e7efe7,#2d3d31);--amber:light-dark(#795517,#efd39b);font:14px/1.55 system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:clip}
#attune-spec *{box-sizing:border-box}#attune-spec button,#attune-spec input,#attune-spec textarea,#attune-spec select{font:inherit;color:inherit}#attune-spec button{background:var(--paper);border:1px solid var(--line);padding:9px 13px;border-radius:8px;text-align:left}#attune-spec button:hover:not(:disabled){background:var(--soft)}#attune-spec button:disabled{opacity:.45}#attune-spec .primary{background:var(--green);color:var(--on);border-color:var(--green)}#attune-spec .primary:hover:not(:disabled){filter:brightness(.95);background:var(--green)}#attune-spec .quiet{border-color:transparent;background:transparent}#attune-spec .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#attune-spec .between{justify-content:space-between}#attune-spec .brand{font-weight:650;letter-spacing:.04em}#attune-spec .top{padding:16px 22px;border-bottom:1px solid var(--line);background:var(--paper)}#attune-spec .dot{display:inline-block;width:10px;height:10px;background:var(--green);border-radius:50%;margin-right:9px}#attune-spec .badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--green)}#attune-spec .muted{color:var(--muted)}#attune-spec .small{font-size:12px}#attune-spec .layout{display:grid;grid-template-columns:190px minmax(0,1fr)}#attune-spec aside{padding:24px 14px;border-right:1px solid var(--line)}#attune-spec aside button{display:block;width:100%;margin:3px 0;background:transparent;border-color:transparent}#attune-spec aside button[aria-current=step]{background:var(--soft);color:var(--green);font-weight:600}#attune-spec .number{display:inline-grid;place-items:center;width:22px;height:22px;border:1px solid var(--line);border-radius:50%;margin-right:7px;font-size:12px}#attune-spec main{min-width:0;padding:28px 30px 24px}#attune-spec h1{font-size:27px;line-height:1.2;letter-spacing:-.035em;font-weight:600;margin:7px 0 10px}#attune-spec h2{font-size:18px;font-weight:600;margin:0 0 8px}#attune-spec h3{font-size:14px;font-weight:600;margin:0 0 6px}#attune-spec p{margin:7px 0 15px}#attune-spec .eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}#attune-spec .panel{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:20px;margin:16px 0}#attune-spec .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}#attune-spec .two .panel{margin:0}#attune-spec label.field{display:block;font-weight:500;margin:17px 0 7px}#attune-spec input:not([type=checkbox]),#attune-spec textarea,#attune-spec select{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:10px;min-width:0}#attune-spec textarea{resize:vertical;min-height:86px}#attune-spec input[type=checkbox]{accent-color:var(--green)}#attune-spec .check{display:flex;align-items:flex-start;gap:10px;margin:12px 0}#attune-spec .check input{margin-top:5px}#attune-spec .actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px;margin-top:24px}#attune-spec .callout{border-left:3px solid var(--green);padding:12px 16px;background:var(--soft);border-radius:0 7px 7px 0;margin:16px 0}#attune-spec .warning{color:var(--amber)}#attune-spec .item{padding:13px 0;border-bottom:1px solid var(--line)}#attune-spec .item:last-child{border-bottom:0}#attune-spec .item p{margin:4px 0}#attune-spec .selected{border-color:var(--green)!important;background:var(--soft)!important}#attune-spec a{color:var(--green);text-underline-offset:3px}#attune-spec .foot{padding:10px 22px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}#attune-spec pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.65 ui-monospace,monospace;background:var(--bg);padding:16px;border-radius:8px}#attune-spec .status{padding:0 30px 14px;color:var(--green)}#attune-spec [role=alert]{color:var(--amber);margin:10px 0}#attune-spec .spacer{margin-top:30px}#attune-spec details{margin:14px 0}#attune-spec summary{font-weight:500}#attune-spec .home{max-width:850px;margin:auto;padding:34px 30px}#attune-spec .step-title{min-height:82px}#attune-spec .pillrow{margin:18px 0}#attune-spec .inline-choice{width:100%;margin:6px 0}#attune-spec .history-tag{font-size:12px;color:var(--green)}#attune-spec .compact .panel{padding:13px}#attune-spec .compact .item{padding:8px 0}
@media(max-width:700px){#attune-spec .layout{grid-template-columns:1fr}#attune-spec aside{border-right:0;border-bottom:1px solid var(--line);padding:10px;display:flex;flex-wrap:wrap;gap:4px}#attune-spec aside button{width:auto;margin:0;padding:6px 9px}#attune-spec aside .aside-label{display:none}#attune-spec main,#attune-spec .home{padding:22px 16px}#attune-spec .two{grid-template-columns:1fr}#attune-spec .top{padding:14px 16px}#attune-spec h1{font-size:24px}#attune-spec .number{display:none}#attune-spec .status{padding:0 16px 14px}}
@media(pointer:coarse){#attune-spec button{min-height:44px}#attune-spec input,#attune-spec textarea,#attune-spec select{font-size:16px}}
</style>
<div id="attune-spec" aria-label="Attune spec studio"><div id="as-content"></div><div id="as-status" class="status" role="status" aria-live="polite"></div><div class="foot">Interactive design prototype · sample research and review · no model calls, real approvals or execution</div></div>
<script>
(()=>{
const root=document.getElementById('attune-spec'),app=root.querySelector('#as-content'),status=root.querySelector('#as-status');
const defaults=()=>({v:2,home:true,step:0,max:0,host:'Codex',goal:'Help developers find and resume saved work without losing decisions.',scope:'A local task list, decision-first sorting, and a clear resume preview.',excluded:'Cloud sync, team accounts, automatic execution, and a new chat interface.',criteria:'Saved drafts retain answers after reopening.\nTasks needing a decision appear first.\nOpening a task never starts execution.',questions:{storage:'',resume:''},mined:false,contextItems:[],memoryCandidate:false,research:false,researchQuestions:'What should be shared across AI hosts?\nHow should the UI distinguish resume from execution?',findings:[],approach:'shared',draft:false,rev:0,accepted:0,reviewed:0,empty:false,history:[],last:null,export:false});
let s=defaults(),design={compact:false};
function restore(w){const v=w?.privateContent;if(v?.v===2&&typeof v.goal==='string'&&Array.isArray(v.history))s={...defaults(),...v};}
restore(window.openai?.widgetState);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const steps=['Intent','Research','Questions','Approach','Specification','Review','Accept & handoff'];
const btn=(text,action,primary=false,disabled=false)=>`<button type="button" class="${primary?'primary':'cursor-interaction'}" data-action="${action}" ${disabled?'disabled':''}>${text}</button>`;
function save(){try{window.openai?.setWidgetState({modelContent:{prototype:'Attune spec creation',simulation:true,stage:steps[s.step]||s.step,revision:s.rev,acceptedRevision:s.accepted,approach:s.approach,researchIncluded:s.findings},privateContent:s})?.catch(()=>{});}catch{}}
function announce(t){status.textContent=t;}
function log(t){s.history.unshift({rev:s.rev,text:t});s.history=s.history.slice(0,16);}
function snapshot(){return {goal:s.goal,scope:s.scope,excluded:s.excluded,criteria:s.criteria,approach:s.approach,empty:s.empty,rev:s.rev};}
function revise(reason,before){if(!s.draft)return;s.last=before||snapshot();s.rev++;s.accepted=0;s.reviewed=0;log(reason);}
function go(n){if(typeof n==='number'&&n>0&&(!s.goal||!s.scope||!s.criteria)){s.step=0;render();announce('Complete the goal, scope and done conditions first.');return;}if(typeof n==='number'&&n>=3&&(!s.questions.storage||s.questions.resume!=='preview')){s.step=2;render();announce('Resolve the material questions before continuing.');return;}s.step=n;s.home=false;s.export=false;if(typeof n==='number')s.max=Math.max(s.max,n);render();save();}
function field(key,label,multi=true){return `<label class="field" for="as-${key}">${label}</label><${multi?'textarea':'input'} id="as-${key}" data-field="${key}" maxlength="${key==='criteria'?900:600}" ${multi?'rows="3"':''}>${multi?esc(s[key]):''}${multi?'</textarea>':''}`;}
function reqs(){return s.criteria.split('\n').map(t=>t.trim()).filter(Boolean).concat(s.empty?['When there are no saved tasks, explain the empty state and offer Create task.']:[]);}
const sources=[{title:'One task, several surfaces',summary:'OpenCode documents a browser interface for its agent. This is a useful reference for offering a graphical surface alongside a developer tool.',url:'https://opencode.ai/docs/web/',label:'OpenCode · Web documentation',implication:'Use a shared task record for host entry points and the companion.',limit:'This source does not prove our host integrations work.'},{title:'Keep planning artifacts connected',summary:'Spec Kit describes a structured specification, planning and task workflow. It provides a comparison for the transitions our UI needs to explain.',url:'https://github.com/github/spec-kit',label:'GitHub · Spec Kit repository',implication:'Show how requirements lead to implementation tasks and checks.',limit:'A documented workflow is not evidence of higher output quality.'}];
function header(){return `<header class="top row between"><div class="row"><span class="brand"><span class="dot"></span>ATTUNE</span><span class="muted">/</span><span>Spec studio</span></div><div class="row"><label class="small muted" for="as-host">Entry point</label><select id="as-host" style="width:auto" aria-label="Entry point">${['Claude','Codex','Antigravity'].map(h=>`<option ${s.host===h?'selected':''}>${h}</option>`).join('')}</select><span class="badge">Prototype</span></div></header>`;}
function title(k,h,p){return `<div class="step-title"><div class="eyebrow">${k}</div><h1>${h}</h1><p class="muted">${p}</p></div>`;}
function footer(prev,next,label,disabled=false){return `<div class="actions">${btn(prev===null?'Save & close':'← '+steps[prev],prev===null?'close':'go:'+prev)}${btn(label,'go:'+next,true,disabled)}</div>`;}
function home(){return `<div class="home">${title('Your workspace','Good work starts with a clear decision.','Continue the sample goal from your AI host, then shape it into a specification.')}<div class="panel"><div class="row between"><span class="badge">${s.draft?(s.accepted===s.rev?'Accepted · r'+s.rev:'Draft · r'+s.rev):'Idea from '+esc(s.host)}</span><span class="small muted">Saved locally in this demo</span></div><h2 style="margin-top:18px">Saved-work navigator</h2><p>${esc(s.goal)}</p><div class="row between"><span class="muted small">${s.draft?'Next: '+esc(steps[s.step]||'Inspect specification'):'Intent → research → decisions → spec → review'}</span>${btn(s.max?'Continue saved draft →':'Shape this idea →','resume',true)}</div></div><div class="two"><div class="panel"><h3>Work inside your preferred AI</h3><p class="muted">Start with the Attune skill. Open this companion when an idea needs a structured decision.</p></div><div class="panel"><h3>Keep authority with the task</h3><p class="muted">Acceptance belongs to a specific spec revision. Starting a build is a separate decision.</p></div></div></div>`;}
function intent(){return title('01 / Frame the work','What should become possible?','Start with the outcome. Keep the boundaries and done conditions visible.')+`<div class="panel">${field('goal','Goal')}${field('scope','Included scope')}${field('excluded','Outside this scope')}${field('criteria','Done when — one condition per line')}<div id="as-error" role="alert"></div></div><div class="actions">${btn('Save & close','close')}${btn('Continue to research →','intent-next',true)}</div>`;}
const contextItems=[
 {kind:'Current conversation',title:'Enhance the AI hosts people already use',body:'Offer a graphical companion with Claude, Codex and Antigravity entry points.',source:'Your direction in this design conversation',fresh:'Current direction',use:'Keep the task primary and offer host-specific entry points.'},
 {kind:'Sample project memory',title:'A saved decision belongs to one revision',body:'Changing the specification must require a fresh acceptance decision.',source:'Illustrative project-memory entry · not retrieved from a memory service',fresh:'Verify against current authority',use:'Invalidate acceptance when the spec changes.'},
 {kind:'Sample older memory',title:'Build only inside one AI host',body:'An older preference assumed a single-host interface.',source:'Fictional conflict example · not a claim about your actual memory',fresh:'Conflicts with current direction',use:'Do not carry forward without resolving the conflict.'}
];
function contextPanel(){return `<section class="panel"><div class="row between"><div><span class="eyebrow">Start close to the goal</span><h2>What do we already know?</h2></div>${btn(s.mined?'Revisit context':'Mine sample context','mine',true)}</div><p class="muted">Look through the goal, prior decisions and relevant project memory before searching outside. Keep the source and uncertainty attached.</p><details><summary>Where memory fits</summary><p>Conversation context is what we have here. Project memory preserves knowledge beyond a session. Retrieval brings relevant items back for inspection; it does not make them current or authoritative.</p><p class="small muted">Production Harness reads configured sources. This demo shows selected examples only; it does not scan your history, read a memory service, or write to long-term memory.</p></details></section>`+(s.mined?contextItems.map((m,i)=>`<section class="panel"><div class="row between"><span class="badge">${m.kind}</span><span class="small ${i===2?'warning':'muted'}">${m.fresh}</span></div><h2 style="margin-top:12px">${m.title}</h2><p>${m.body}</p><p class="small muted">Source: ${m.source}</p>${i===2?'<div class="callout warning">Current direction takes precedence. This conflicting example is excluded; it cannot authorize a change in scope.</div>':`<label class="check"><input type="checkbox" data-context="${i}" ${s.contextItems.includes(i)?'checked':''}><span>Use in this spec: ${m.use}</span></label>`}</section>`).join(''):'');}
function research(){return title('02 / Optional research','Test the assumptions before the approach.','Mine relevant context first. Research outside when important questions remain.')+contextPanel()+`<div class="panel"><h2>Then look beyond the project</h2>${field('researchQuestions','Questions to investigate')}<div class="row between"><span class="small muted">Demo scope: 2 public sources · no browsing or paid calls</span>${btn(s.research?'Refresh sample findings':'Load sample research','research',true)}</div></div>`+(s.research?`<div class="callout"><strong>Sample research, not a fresh search.</strong> These references illustrate the workflow. Open the sources to examine their current contents.</div>${sources.map((f,i)=>`<section class="panel"><div class="row between"><h2>${f.title}</h2><span class="badge">Reference</span></div><p>${f.summary}</p><a href="${f.url}" target="_blank" rel="noopener noreferrer">${f.label} ↗</a><p><strong>Proposed implication:</strong> ${f.implication}</p><p class="small muted">Uncertainty: ${f.limit}</p><label class="check"><input type="checkbox" data-finding="${i}" ${s.findings.includes(i)?'checked':''}><span>Carry this implication and its source into the spec</span></label></section>`).join('')}`:'')+`<details><summary>When to skip research</summary><p class="muted">A small fix with known requirements may need only repository evidence. In a live workflow, set questions, source boundaries and a time or cost ceiling before running research; stop when the decision has sufficient support.</p></details>`+footer(0,2,s.research?'Continue with selected findings →':'Skip research →');}
function questions(){return title('03 / Resolve uncertainty','Two decisions shape this spec.','Answer now, or save the draft and return. We won’t silently fill in material choices.')+`<div class="panel"><h2>Where should saved work live?</h2><p class="muted">This determines whether switching AI hosts also means switching task history.</p>${[['shared','Shared local task record','All host entry points open the same saved work.'],['separate','Separate record in each host','Simpler isolation, but context does not follow you.']].map(([v,t,d])=>`<button type="button" class="inline-choice ${s.questions.storage===v?'selected':''}" data-answer="storage:${v}" aria-pressed="${s.questions.storage===v}"><strong>${t}</strong><br><span class="small muted">${d}</span></button>`).join('')}</div><div class="panel"><h2>What does opening a saved task do?</h2>${[['preview','Show a resume preview','Inspect retained work and the next operation before execution.'],['automatic','Start execution immediately','Requires a separate authorization design; blocked in this prototype.']].map(([v,t,d])=>`<button type="button" class="inline-choice ${s.questions.resume===v?'selected':''}" data-answer="resume:${v}" aria-pressed="${s.questions.resume===v}"><strong>${t}</strong><br><span class="small muted">${d}</span></button>`).join('')}</div>`+(s.questions.resume==='automatic'?'<div class="callout warning">This changes the authorization model and conflicts with the sample’s explicit-resume boundary. Choose a preview to continue this scenario.</div>':'')+footer(1,3,'Compare approaches →',!s.questions.storage||s.questions.resume!=='preview');}
function approach(){const shared=s.approach==='shared';return title('04 / Choose an approach','Make the tradeoff explicit.','The chosen approach becomes part of the spec, with the strongest counter-case retained.')+`<div class="two"><div class="panel ${shared?'selected':''}"><span class="badge">Recommended</span><h2 style="margin-top:12px">Shared companion</h2><p>One local graphical app, opened from each AI host.</p><p class="small"><strong>Gain:</strong> a consistent task history and decision experience.<br><strong>Cost:</strong> a local service and an extra surface to maintain.</p>${btn(shared?'Selected':'Choose shared companion','choose:shared',shared)}</div><div class="panel ${!shared?'selected':''}"><span class="badge">Alternative</span><h2 style="margin-top:12px">Host-specific panels</h2><p>Build a separate experience for each supported host.</p><p class="small"><strong>Gain:</strong> closer to each host’s native workflow.<br><strong>Cost:</strong> duplicated UI and different host capabilities.</p>${btn(!shared?'Selected':'Choose host panels','choose:panels',!shared)}</div></div><div class="panel"><h3>Decision context</h3><p>Task storage: ${s.questions.storage==='shared'?'shared local record':'separate host records'}. Opening a task: resume preview.</p><p class="muted">${shared&&s.questions.storage==='separate'?'Tradeoff: the companion must clearly label the host-specific records; a unified view does not create shared authority.':!shared&&s.questions.storage==='shared'?'Both panels must use the same task authority. A second UI must not create a second approval store.':'The interface can evolve independently of the task record and its decisions.'}</p><p class="small muted">${s.findings.length} research implication(s) selected. Research informs this decision; it does not validate the implementation.</p></div><div class="actions">${btn('← Questions','go:2')}${btn(s.draft?'Return to specification →':'Create sample specification →','draft',true)}</div>`;}
function criteriaView(){return reqs().map((r,i)=>`<div class="item row between"><div><span class="small muted">R${i+1}</span> ${esc(r)}</div><span class="badge">Not run</span></div>`).join('');}
function spec(){return title('05 / Specification · revision '+s.rev,'A spec you can inspect and change.','Each requirement has an intended check. No implementation checks have run.')+`<div class="row pillrow">${btn('Review this revision →','go:5',true)}${btn('View handoff text','export')}${btn('Revision history','go:history')}</div><section class="panel"><div class="row between"><h2>Outcome & boundaries</h2><span class="badge">${s.accepted===s.rev?'Accepted r'+s.rev:'Draft r'+s.rev}</span></div>${field('goal','Goal')}${field('scope','Included scope')}${field('excluded','Outside this scope')}<p class="small muted">Changes save when you leave a field and create a new revision.</p></section><section class="panel"><h2>Requirements</h2>${field('criteria','Done when — one condition per line')}${criteriaView()}</section><section class="panel"><h2>Implementation sequence</h2><div class="item"><h3>1. Project saved task state</h3><p>Read the ${s.questions.storage==='shared'?'shared':'host-specific'} record; retain unanswered questions and decisions.</p><span class="small muted">Output: task projection · Check: reopen a partially answered draft</span></div><div class="item"><h3>2. Build the navigator</h3><p>${s.approach==='shared'?'Shared companion':'Host panels'} with decision-first sorting and an explicit resume preview.</p><span class="small muted">Depends on 1 · Check: waiting decision first; opening causes no execution</span></div><div class="item"><h3>3. Verify the complete journey</h3><p>Check save, reopen, changed revision, and ${s.empty?'empty state':'first use'}.</p><span class="small muted">Depends on 2 · Output: observed results per requirement</span></div></section><section class="panel"><h2>Context, research & assumptions</h2>${s.contextItems.map(i=>`<div class="item"><span class="badge">${contextItems[i].kind}</span><p>${contextItems[i].use}</p><p class="small muted">${contextItems[i].source}</p></div>`).join('')}${s.findings.length?s.findings.map(i=>`<div class="item"><p>${sources[i].implication}</p><a href="${sources[i].url}" target="_blank" rel="noopener noreferrer">${sources[i].label} ↗</a><p class="small muted">${sources[i].limit}</p></div>`).join(''):'<p class="muted">External research was skipped or no findings were selected. Host compatibility remains an assumption to verify.</p>'}<details><summary>Counter-case for the chosen approach</summary><p>${s.approach==='shared'?'A separate companion adds setup and navigation overhead. Host panels may feel more immediate for users who never switch AI tools.':'Separate panels multiply implementation and qualification work. A shared companion may deliver a more consistent experience sooner.'}</p></details></section>`+footer(3,5,'Review this revision →');}
function review(){return title('06 / Review · revision '+s.rev,'Find the gaps before accepting.','This demonstration uses a fixed reviewer finding. A production review must name its actual reviewer and evidence.')+(!s.empty?`<div class="panel"><div class="row between"><span class="badge">Needs a decision</span><span class="small muted">Sample reviewer · F1</span></div><h2 style="margin-top:14px">What happens on the first visit?</h2><p>The task list has no defined empty state. A new user could see a blank screen without knowing how to begin.</p><div class="callout">Proposed requirement: When there are no saved tasks, explain the empty state and offer Create task.</div><p class="small muted">Reason: first use must be testable. Applying this finding adds a requirement and creates a new revision.</p>${btn('Apply suggested requirement','resolve',true)}</div>`:`<div class="panel"><span class="badge">Finding addressed</span><h2 style="margin-top:14px">First use is now specified.</h2><p>F1 disposition: add an empty-state message with a Create task action. The verification task includes this case.</p><p class="small muted">${s.reviewed===s.rev?'Sample review is current for r'+s.rev+'.':'This revision needs a fresh sample review before acceptance.'}</p>${btn(s.reviewed===s.rev?'Review complete':'Run sample review for r'+s.rev,'review',true,s.reviewed===s.rev)}</div>`)+`<div class="panel"><h2>Changes since the prior revision</h2>${diff()}<p class="small muted">Reviewing a spec checks the plan. Implementation results remain “Not run.”</p></div>`+footer(4,6,'Inspect acceptance & handoff →',s.reviewed!==s.rev);}
function diff(){if(!s.last)return '<p class="muted">This is the initial draft.</p>';const rows=['goal','scope','excluded','criteria','approach','empty'].filter(k=>s.last[k]!==s[k]);return rows.length?rows.map(k=>`<div class="item"><h3>${esc(k==='empty'?'First-use requirement':k)}</h3><p class="small muted">Before · ${esc(s.last[k])}</p><p>Now · ${esc(s[k])}</p></div>`).join(''):'<p>Research or a material answer changed. Review the current specification again.</p>';}
function accept(){let ok=s.accepted===s.rev;return title('07 / Decision & handoff',ok?'Accepted. Ready to prepare the build.':'Accept this specific revision.','Acceptance records agreement with the spec. Execution needs its own authorization.')+`<div class="panel"><div class="row between"><h2>Saved-work navigator</h2><span class="badge">Revision ${s.rev}</span></div><p>${esc(s.goal)}</p><div class="item row between"><span>Sample spec review</span><strong>${s.reviewed===s.rev?'Current':'Needs review'}</strong></div><div class="item row between"><span>Spec acceptance</span><strong>${ok?'Accepted r'+s.rev:'Waiting for you'}</strong></div><div class="item row between"><span>Implementation checks</span><strong>Not run</strong></div><div class="item row between"><span>Execution environment</span><strong>Not checked</strong></div><div class="item row between"><span>Permission to execute</span><strong>Not granted</strong></div>${ok?'<div class="callout">Simulated acceptance retained for this revision. Any content change requires fresh review and acceptance.</div>':`<p class="small muted">Accepting here only updates this prototype. It cannot grant authority in Harness.</p>${btn('Accept revision '+s.rev+' in this demo','accept',true,s.reviewed!==s.rev)}`}</div>${ok?`<div class="panel"><h2>Build handoff · ${esc(s.host)}</h2><p>Carry the accepted goal, scope, requirements, decisions and task sequence into the execution review.</p><p class="muted">Before a real build: confirm the workspace, participants, budget, allowed effects, and required task/final reviews.</p><div class="row">${btn('Prepare handoff text','export',true)}${btn('Edit accepted spec','go:4')}</div></div><div class="panel"><h2>What should the next session remember?</h2><p class="muted">Completion is another useful moment to mine context. Preserve the decision and its reason; keep approval tied to this task revision.</p>${s.memoryCandidate?'<div class="callout"><strong>Memory candidate · awaiting review</strong><p>Preserve revision-specific acceptance and explicit execution authorization when reopening saved work.</p><span class="small">Prepared in this demo only. Nothing was written to project memory.</span></div>':btn('Prepare a memory candidate','remember')}</div>`:''}`+footer(5,4,'Return to specification');}
function history(){return title('Task history','Decisions stay attached to their revisions.','Earlier acceptance remains visible even when a new revision needs your decision.')+`<div class="panel">${s.history.map(h=>`<div class="item"><span class="history-tag">Revision ${h.rev}</span><p>${esc(h.text)}</p></div>`).join('')||'<p>No draft revisions yet.</p>'}</div>${btn('Back to specification','go:4',true)}`;}
function checks(){return title('Checks & evidence','Know what is—and isn’t—proven.','Research references support decisions. Review assesses the spec. Tests must assess the implementation.')+`<div class="panel"><h2>Requirement verification</h2>${criteriaView()}</div><div class="panel"><div class="item row between"><span>Spec review</span><span>${s.reviewed===s.rev&&s.rev?'Current sample review':'Not current'}</span></div><div class="item row between"><span>External research</span><span>${s.findings.length} selected sample references</span></div><div class="item row between"><span>Live host compatibility</span><span>Not verified</span></div></div>${btn('Back to specification','go:4',true)}`;}
function markdown(){return `# Saved-work navigator\n\nRevision: ${s.rev}\nStatus: ${s.accepted===s.rev?'SIMULATED ACCEPTANCE':'DRAFT'}\nPrototype only — no Harness authority or execution.\n\n## Goal\n${s.goal}\n\n## Scope\n${s.scope}\n\n## Excluded\n${s.excluded}\n\n## Requirements\n${reqs().map((r,i)=>`- R${i+1}: ${r} [Not run]`).join('\n')}\n\n## Decisions\n- Storage: ${s.questions.storage}\n- Open task: ${s.questions.resume}\n- Approach: ${s.approach}\n\n## Tasks\n1. Project task state; verify draft survives reopening.\n2. Build navigator; verify ordering and explicit resume. Depends on 1.\n3. Verify complete journey and first use. Depends on 2.\n\n## Context carried forward\n${s.contextItems.map(i=>contextItems[i].use+' — '+contextItems[i].source).join('\n')||'No context examples selected.'}\n\n## Research\n${s.findings.map(i=>sources[i].implication+'\n'+sources[i].url+'\nLimit: '+sources[i].limit).join('\n\n')||'No external findings included.'}\n\n## Build handoff\nTarget entry point: ${s.host} (design target, not connected).\nConfirm workspace, participants, budget and allowed effects.\nPreserve task and final reviews. Execution is not authorized.\n`;}
function render(){root.classList.toggle('compact',design.compact);status.textContent='';if(s.home){app.innerHTML=header()+home();return;}app.innerHTML=header()+`<div class="layout"><aside aria-label="Spec workflow"><div class="aside-label eyebrow" style="padding:0 12px 12px">Saved-work navigator</div>${steps.map((t,i)=>`<button type="button" data-action="go:${i}" aria-current="${s.step===i?'step':'false'}" ${i>s.max?'disabled':''}><span class="number">${i+1}</span>${t}</button>`).join('')}<div class="aside-label spacer"></div>${btn('Checks & evidence','go:checks',false,!s.draft)}${btn('History','go:history',false,!s.draft)}${btn('Save & close','close')}</aside><div><main>${s.export?title('Portable handoff','The full decision, ready to carry forward.','Select the text to copy it into your chosen host. This is a sample handoff, not an executable grant.')+`<pre aria-label="Handoff text">${esc(markdown())}</pre>`+btn('Back to workflow','unexport',true):typeof s.step==='number'?[intent,research,questions,approach,spec,review,accept][s.step]():s.step==='history'?history():checks()}</main></div></div>`;}
root.addEventListener('change',e=>{let t=e.target;if(t.id==='as-host'){s.host=t.value;save();render();return;}if(t.dataset.field){let k=t.dataset.field,v=t.value.trim(),before=snapshot();if(s[k]===v)return;s[k]=v;if(k!=='researchQuestions')revise('Edited '+k+'; earlier review and acceptance no longer apply.',before);save();if(s.draft){render();announce('Saved revision '+s.rev+'. Review is required again.');}return;}if(t.dataset.context!==undefined){let i=Number(t.dataset.context),before=snapshot();s.contextItems=t.checked?[...new Set([...s.contextItems,i])]:s.contextItems.filter(x=>x!==i);revise('Changed context carried into the specification.',before);save();announce('Context selection saved; source remains attached.');return;}if(t.dataset.finding!==undefined){let i=Number(t.dataset.finding),before=snapshot();s.findings=t.checked?[...new Set([...s.findings,i])]:s.findings.filter(x=>x!==i);revise('Changed research carried into the specification.',before);save();announce('Research selection saved.');}});
root.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;let a=b.dataset.action;if(b.dataset.answer){let [k,v]=b.dataset.answer.split(':');if(s.questions[k]!==v){let before=snapshot();s.questions[k]=v;revise('Changed material decision: '+k,before);}render();save();return;}if(!a)return;e.preventDefault();if(a.startsWith('go:')){let v=a.slice(3);go(/^\d+$/.test(v)?Number(v):v);return;}if(a.startsWith('choose:')){let v=a.slice(7);if(v!==s.approach){let before=snapshot();s.approach=v;revise('Changed chosen approach.',before);}render();save();return;}switch(a){case 'resume':s.home=false;render();break;case 'close':s.home=true;render();announce('Draft saved. Continue it whenever you are ready.');break;case 'intent-next':if(!s.goal||!s.scope||!s.criteria){root.querySelector('#as-error').textContent='Add a goal, included scope and at least one done condition.';return;}go(1);return;case 'mine':s.mined=true;render();announce('Context examples opened. No memory service was queried.');break;case 'remember':s.memoryCandidate=true;log('Prepared a memory candidate for later review; no memory was written.');render();break;case 'research':s.research=true;render();announce('Loaded two sample source summaries. No internet search was performed.');break;case 'draft':if(!s.draft){s.draft=true;s.rev=1;log('Created initial specification from intent, material answers and approach.');}go(4);return;case 'resolve':{let before=snapshot();s.empty=true;revise('Addressed F1: added an empty-state requirement and its verification case.',before);render();announce('Finding addressed in revision '+s.rev+'. Run its sample review.');break;}case 'review':s.reviewed=s.rev;log('Sample review completed; implementation checks remain not run.');render();announce('Sample review is current for revision '+s.rev+'.');break;case 'accept':if(s.reviewed!==s.rev)return;s.accepted=s.rev;log('Simulated acceptance of this exact revision. Execution not authorized.');render();announce('Revision '+s.rev+' accepted in this demo only.');break;case 'export':s.export=true;render();break;case 'unexport':s.export=false;render();break;}save();});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState && JSON.stringify(e.detail.globals.widgetState.privateContent)!==JSON.stringify(s)){restore(e.detail.globals.widgetState);render();}});
render();if(globalThis.Tweak){const t=new Tweak({container:root,onChange:render});t.addToggle(design,'compact',{label:'Compact spacing'});}
})();
</script>
