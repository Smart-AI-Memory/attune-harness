[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "attune-harness"
version = "0.5.0"
description = "Portable execution contracts for multi-model agent work"
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Patrick Roebuck", email = "admin@smartaimemory.com"}
]
maintainers = [
    {name = "Smart-AI-Memory", email = "admin@smartaimemory.com"}
]
keywords = ["ai-agent", "multi-agent", "agent-harness", "llm", "mcp", "developer-tools", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
]
# The base install carries what the review, test, MCP and acceptance journeys
# need, pinned exactly (D15, 2026-09-22). No provider SDK: voyage and
# memory-native make paid calls and stay extras. Every gate still loads lazily
# through features.require_feature, so a wheel installed with --no-deps reports
# each missing piece instead of failing.
dependencies = [
    "attune-forms==0.17.0",
    "attune-verify==0.6.0",
    "attune-rag==1.2.0",
    "mcp==2.2.0",
    "tiktoken==0.12.0",
]

[project.urls]
Homepage = "https://github.com/Smart-AI-Memory/attune-harness"
Repository = "https://github.com/Smart-AI-Memory/attune-harness"
Issues = "https://github.com/Smart-AI-Memory/attune-harness/issues"

[project.optional-dependencies]
# tokens, verify, rag, review and mcp are in the base since 0.4.0. They stay
# as empty extras so an existing `pip install 'attune-harness[review]'` keeps
# working without a warning; they will be removed in 1.0.
tokens = []
verify = []
rag = []
review = []
mcp = []
voyage = ["voyageai==0.5.0", "lancedb==0.38.0", "pyarrow==25.0.1", "jsonschema==4.26.0"]
memory-native = ["anthropic==1.6.0", "httpx2==2.13.0"]
redis = ["redis==5.3.1"]

[project.scripts]
attune-harness = "attune_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
