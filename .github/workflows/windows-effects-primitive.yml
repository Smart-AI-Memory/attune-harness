name: Windows effects primitive experiment

on:
  push:
    branches: [codex/windows-effects-probe-20260918]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-effects-primitive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-ntfs-observation:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Observe native NTFS handle and replacement primitives
        shell: pwsh
        run: |
          python -I experiments/platform/windows_effects_probe.py --output "qualification-windows/effects-${{ matrix.python }}.json"
      - name: Preserve real-Windows receipt even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-effects-primitive-${{ matrix.python }}
          path: qualification-windows/effects-${{ matrix.python }}.json
          if-no-files-found: error
