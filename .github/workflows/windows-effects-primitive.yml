name: Windows effects primitive experiment

on:
  push:
    branches: [codex/windows-effects-probe-20260918]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-effects-primitive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-ntfs-observation:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Observe native NTFS handle and replacement primitives
        shell: pwsh
        run: |
          python -I experiments/platform/windows_effects_probe.py --output "qualification-windows/effects-${{ matrix.python }}.json"
      - name: Preserve real-Windows receipt even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-effects-primitive-${{ matrix.python }}
          path: qualification-windows/effects-${{ matrix.python }}.json
          if-no-files-found: error
