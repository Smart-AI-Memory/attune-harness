name: Library qualification

# Pushes qualify only where a push is the record: main, and release branches.
# The release gates accept a qualification run only from a push or a dispatch,
# and a release candidate is built from a release/ branch, so those must keep
# their push runs. Every other branch is qualified by its pull request. Running
# on every branch push doubled the work: a documentation branch got a 14 second
# pull request run and, for the same commit, a five minute full matrix.
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request that only touches documentation cannot change the wheel or
  # what the tests exercise, so the platform jobs below are skipped for it.
  #
  # Branch protection requires the single `Qualification` check at the bottom of
  # this file, never the six platform names. Keep it that way. GitHub evaluates a
  # job's `if` before it expands the matrix, so a skipped matrix job reports one
  # check under the unexpanded name; if the six names were required, they would
  # never arrive and no documentation pull request could merge. For the same
  # reason this workflow has no `paths` filter: `Qualification` must always report.
  #
  # Only pull requests skip. Pushes and dispatches always qualify in full, so
  # every commit on main has a real run. The release gate reads only those.
  changes:
    name: Classify change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      qualify: ${{ steps.classify.outputs.qualify }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Decide whether this change can affect the package
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Anything unexpected leaves qualify=true. File names are data: they
          # are only ever matched against the patterns below.
          qualify=true
          if [[ "$EVENT_NAME" == pull_request ]]; then
            # HEAD is the merge of the pull request into its base, so HEAD^1 is the base.
            if files=$(git diff --name-only -z HEAD^1 HEAD | tr '\0' '\n') && [[ -n "$files" ]]; then
              qualify=false
              while IFS= read -r file; do
                case "$file" in
                  docs/*|AGENTS.md|CHANGELOG.md|.github/pull_request_template.md) ;;
                  *) qualify=true; break ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "qualify=$qualify" >> "$GITHUB_OUTPUT"
          echo "qualify=$qualify"

  installed-library:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: changes
    # Skip only on an explicit "false". A failed classification leaves the
    # answer empty, which means qualify.
    if: ${{ !cancelled() && needs.changes.outputs.qualify != 'false' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install library
        shell: bash
        run: |
          python -m pip install "build==1.3.0" "setuptools>=77"
          python -m build --wheel
          python -c "import pathlib,subprocess,sys; w=next(pathlib.Path('dist').glob('attune_harness-*.whl')); subprocess.run([sys.executable,'-m','pip','install','-c','requirements-workflow.lock','-c','requirements-voyage.lock','-c','requirements-mcp.lock','pytest==9.1.1','attune-harness[review,voyage,mcp] @ '+w.resolve().as_uri()],check=True)"
          python -m pip check
      - name: Diagnose native Windows environment and retain bounded output
        if: runner.os == 'Windows'
        run: python -I experiments/platform/diagnose_windows_environment.py
      - name: Qualify installed artifact and record platform limits
        run: python -I scripts/qualify_platform.py --output qualification
      - name: Verify Windows environment guard detects inheritance
        if: runner.os == 'Windows'
        run: python -I experiments/platform/check_windows_environment_guard.py --output qualification/environment-guard
      - name: Keep qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualification-${{ matrix.os }}-${{ matrix.python }}
          path: |
            qualification/
            windows-environment-diagnostic/
          if-no-files-found: error

  # The platform jobs above run a selection of the test files, chosen in
  # scripts/qualify_platform.py, against the installed wheel. This job runs
  # every test once, from the source tree, so a test outside that selection
  # cannot break unnoticed. It is plain pytest with the same extras and lock
  # files; without the extras the suite cannot even be collected.
  full-suite:
    name: Full test suite
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.qualify != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # The oldest supported version, where newer syntax fails first.
          python-version: '3.10'
      - name: Install the source tree and its test dependencies
        run: python -m pip install -c requirements-workflow.lock -c requirements-voyage.lock -c requirements-mcp.lock "pytest==9.1.1" -e ".[review,voyage,mcp]"
      - name: Run every test
        run: python -m pytest

  # Every Markdown link to a Markdown file must resolve. This runs for every
  # change, including documentation-only ones, because those are exactly the
  # changes that add links. scripts/known_dead_links.txt lists the targets that
  # were already dead when the check began; that list may only shrink.
  doc-links:
    name: Documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Resolve every Markdown link
        run: python -I scripts/check_doc_links.py

  # One verdict for branch protection to require, in place of the job names. It
  # fails closed: it passes only when the platform jobs and the full suite
  # passed, or when they did no work for a pull request the classifier found to
  # be documentation-only. Anything else, including a cancelled run or a failed
  # classification, is a failure.
  qualification:
    name: Qualification
    needs: [changes, installed-library, full-suite, doc-links]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report one verdict
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLASSIFIED: ${{ needs.changes.result }}
          QUALIFY: ${{ needs.changes.outputs.qualify }}
          PLATFORMS: ${{ needs.installed-library.result }}
          SUITE: ${{ needs.full-suite.result }}
          LINKS: ${{ needs.doc-links.result }}
        run: |
          state="platform jobs: ${PLATFORMS:-none}; full suite: ${SUITE:-none}; documentation links: ${LINKS:-none}; classification: ${CLASSIFIED:-none}; qualify: ${QUALIFY:-unset}; event: ${EVENT_NAME:-none}"
          verdict=fail
          if [[ "$LINKS" != success ]]; then
            # A dead link fails every change, documentation-only or not.
            verdict=fail
          elif [[ "$QUALIFY" == false ]]; then
            # Only a pull request may skip, and only on a classification that succeeded.
            if [[ "$EVENT_NAME" == pull_request && "$CLASSIFIED" == success \
                  && ( "$PLATFORMS" == success || "$PLATFORMS" == skipped ) \
                  && ( "$SUITE" == success || "$SUITE" == skipped ) ]]; then
              verdict=skipped
            fi
          elif [[ "$PLATFORMS" == success && "$SUITE" == success ]]; then
            verdict=pass
          fi
          case "$verdict" in
            pass) message="All six platform jobs, the full test suite and the documentation link check passed. ($state)" ;;
            skipped) message="Documentation-only pull request: every Markdown link resolves; nothing was built, installed or tested, so this passes without qualifying any platform. Every push to main runs the full qualification. ($state)" ;;
            *) message="Qualification did not pass. ($state)" ;;
          esac
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$verdict" == fail ]]; then
            echo "::error title=Qualification::$message"
            exit 1
          fi
          echo "::notice title=Qualification::$message"
