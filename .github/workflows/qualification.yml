name: Library qualification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-library:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install library
        shell: bash
        run: |
          python -m pip install "build==1.3.0" "setuptools>=77"
          python -m build --wheel
          python -c "import pathlib,subprocess,sys; w=next(pathlib.Path('dist').glob('attune_harness-*.whl')); subprocess.run([sys.executable,'-m','pip','install','-c','requirements-workflow.lock','pytest==9.1.1','attune-harness[review] @ '+w.resolve().as_uri()],check=True)"
          python -m pip check
      - name: Qualify installed artifact and record platform limits
        run: python -I scripts/qualify_platform.py --output qualification
      - name: Keep qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualification-${{ matrix.os }}-${{ matrix.python }}
          path: qualification/
          if-no-files-found: error
