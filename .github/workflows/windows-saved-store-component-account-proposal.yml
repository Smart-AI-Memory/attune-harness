          $materialize = @'
          import hashlib,json,os,re,stat,subprocess,sys
          
          from pathlib import Path,PurePosixPath
          
          LIMIT=1024*1024
          
          def git(repo,*arguments,limit=65536):
              result=subprocess.run(['git','--no-replace-objects',*arguments],cwd=repo,stdin=subprocess.DEVNULL,
                                    stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=10)
              if result.returncode or len(result.stdout)>limit or len(result.stderr)>65536:
                  raise ValueError('git_data_refused')
              return result.stdout
          
          def canonical(name):
              if not isinstance(name,str) or not name.isascii():
                  raise ValueError('path_refused')
              path=PurePosixPath(name)
              if (path.is_absolute() or path.as_posix()!=name or not path.parts
                      or any(part in ('.','..') or not re.fullmatch(r'[A-Za-z0-9_.-]+',part)
                             or part.endswith('.') for part in path.parts)):
                  raise ValueError('path_refused')
              return path
          
          def regular(path,directory=False):
              value=path.lstat()
              if (stat.S_ISLNK(value.st_mode) or getattr(value,'st_file_attributes',0)&0x400
                      or not (stat.S_ISDIR(value.st_mode) if directory else stat.S_ISREG(value.st_mode))
                      or not directory and value.st_nlink!=1):
                  raise ValueError('target_kind_refused')
              return value
          
          def materialize(repo,expected,checkpoint,commit):
              if not repo.is_absolute():raise ValueError('absolute_repo_required')
              regular(repo,directory=True)
              for name,wanted in expected.items():
                  row={'path':name,'expected_sha256':wanted,'status':'attempted','failure_type':None}
                  checkpoint(row)
                  try:
                      relative=canonical(name)
                      if not isinstance(wanted,str) or re.fullmatch(r'[0-9a-f]{64}',wanted) is None:
                          raise ValueError('digest_refused')
                      entry=git(repo,'ls-tree','-z',commit,'--',name).split(b'\0')
                      if len(entry)!=2 or entry[1]!=b'':raise ValueError('git_entry_refused')
                      metadata,actual=entry[0].split(b'\t',1)
                      mode,kind,blob=metadata.decode('ascii').split()
                      if mode!='100644' or kind!='blob' or actual.decode('ascii')!=name or not re.fullmatch(r'[0-9a-f]{40}',blob):
                          raise ValueError('git_mode_refused')
                      size=git(repo,'cat-file','-s',blob,limit=32).strip()
                      if re.fullmatch(rb'[0-9]+',size) is None or not 0<int(size)<=LIMIT:
                          raise ValueError('blob_size_refused')
                      raw=git(repo,'cat-file','blob',blob,limit=LIMIT)
                      digest=hashlib.sha256(raw).hexdigest()
                      if len(raw)!=int(size) or digest!=wanted:raise ValueError('blob_hash_refused')
                      target=repo/relative
                      for parent in target.parents:
                          regular(parent,directory=True)
                          if parent==repo:break
                      before=regular(target)
                      flags=os.O_WRONLY|getattr(os,'O_BINARY',0)|getattr(os,'O_NOFOLLOW',0)
                      descriptor=os.open(target,flags)
                      with os.fdopen(descriptor,'wb') as stream:
                          opened=os.fstat(stream.fileno())
                          if (not stat.S_ISREG(opened.st_mode) or opened.st_nlink!=1
                                  or getattr(opened,'st_file_attributes',0)&0x400
                                  or (opened.st_dev,opened.st_ino)!=(before.st_dev,before.st_ino)):
                              raise ValueError('target_changed_before_write')
                          stream.seek(0);stream.truncate();stream.write(raw);stream.flush()
                      regular(target)
                      with target.open('rb') as verify_stream:verified=verify_stream.read(LIMIT+1)
                      if hashlib.sha256(verified).hexdigest()!=wanted:
                          raise ValueError('materialized_hash_refused')
                      row.update(status='materialized',git_blob=blob,git_mode=mode,bytes=len(raw),actual_sha256=digest)
                  except Exception as error:
                      row.update(status='refused',failure_type=type(error).__name__)
                      raise
                  finally:checkpoint(row)
          
          repo=Path(sys.argv[1]);expected=json.loads(sys.argv[2])
          if (not isinstance(expected,dict) or len(expected)!=49
                  or len({name.casefold() for name in expected})!=49):raise ValueError('finite_C_map_refused')
          output=Path(os.environ['RUNNER_TEMP'])/'saved-store-component-bootstrap.json'
          if output.exists() or output.is_symlink() or not output.is_absolute():raise ValueError('fresh_bootstrap_report_required')
          report={'status':'started','rows':[],'actual_checkout':None,'failure_type':None,'account_fixture_invoked':False,'accounts_or_credentials_created':False,'t2_d3_gate':'unpassed','production_port_allowed':False}
          def save(row=None):
              if row is not None and not any(item is row for item in report['rows']):report['rows'].append(row)
              output.write_text(json.dumps(report,ensure_ascii=True,indent=2)+'\n',encoding='ascii')
          save()
          try:
              actual=git(repo,'rev-parse','HEAD').decode('ascii').strip()
              if re.fullmatch(r'[0-9a-f]{40}',actual) is None or actual!=os.environ['T2_EVENT_SHA']:raise ValueError('not_current_event_checkout')
              report['actual_checkout']=actual;save()
              materialize(repo,expected,save,actual)
              if git(repo,'rev-parse','HEAD').decode('ascii').strip()!=actual:raise ValueError('C_changed_during_bootstrap')
              report['status']='current_C_raw_inputs_materialized'
          except Exception as error:report.update(status='bootstrap_refused',failure_type=type(error).__name__)
          finally:save()
          sys.exit(0 if report['status']=='current_C_raw_inputs_materialized' else 1)
          '@
          python -I -B -c $materialize (Get-Location).Path ($expected | ConvertTo-Json -Compress)
          if ($LASTEXITCODE -ne 0) { throw 'Current caller source materialization refused.' }
      - name: Prepare isolated pinned controller tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $controller = Join-Path $env:RUNNER_TEMP 'saved-store-build-safe-controller'
          if (Test-Path -LiteralPath $controller) { throw 'Require new controller environment.' }
          python -I -m venv $controller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $controller 'Scripts/python.exe'
          & $python -I -m pip install 'build==1.3.0' 'setuptools==84.0.0' 'pytest==9.1.1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "T2_SAFE_CONTROLLER=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $config = Join-Path $env:RUNNER_TEMP 'saved-store-build-safe-pytest.ini'
          if (Test-Path -LiteralPath $config) { throw 'Refuse retained test config.' }
          [IO.File]::WriteAllText($config, "[pytest]`n", [Text.UTF8Encoding]::new($false))
      - name: Refuse rerun or unparsed new caller before any account code
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parsePath = Join-Path $env:RUNNER_TEMP 'saved-store-component-account-parse.json'
          if (Test-Path -LiteralPath $parsePath) { throw 'Refuse retained parse evidence.' }
          $report = [ordered]@{ status='preaccount_parse_started'; run_attempt=$env:GITHUB_RUN_ATTEMPT; rows=@(); failure_type=$null; accounts_or_credentials_created=$false; fixture_invoked=$false; native_methods_invoked=$false; t2_d3_gate='unpassed'; production_port_allowed=$false }
          try {
            # Job guard and this independent runtime check reject manual reruns.
            if ($env:GITHUB_RUN_ATTEMPT -cne '1') { throw 'Only the first attempt is authorized.' }
            $inputs = @(
            @{ path='experiments/platform/windows_saved_store_standard_user_gui_proposal_v4.ps1'; sha256='0f8bc51e984dedd5cace1c6c93e5278dd24273b077fc8e39b98e8099baa276c8'; parameters=@('ExecuteApprovedFixture','ExecuteReviewedGuiLease','GuiHelper','BasePython','Wheel','ProofScript','Output','ControllerRepo','ComponentOwned','ControllerPython','AnchorPublisher','SourceManifest') }
            @{ path='experiments/platform/windows_saved_store_component_account_tail_v1.ps1'; sha256='e8b9d4c392ae241de4fdd290c5daa62f4239797edf652a097a0a680d35cb67f9'; parameters=@('Repo','ControllerPython') }
            )
            foreach ($inputRecord in $inputs) {
              $row = [ordered]@{ path=$inputRecord.path; sha256=$null; expected_parameters=$inputRecord.parameters; parameters=@(); parser_error_ids=@(); parsed=$false; failure_type=$null }
              $report.rows += $row
              try {
                $path = (Resolve-Path -LiteralPath $inputRecord.path).Path
                $row.sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
                if ($row.sha256 -cne $inputRecord.sha256) { throw 'Parser input source changed.' }
                $tokens=$null; $parseErrors=$null
                $ast = [Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$parseErrors)
                $row.parser_error_ids = @($parseErrors | ForEach-Object { $_.ErrorId })
                if ($row.parser_error_ids.Count -ne 0 -or $null -eq $ast.ParamBlock) { throw 'New caller did not parse.' }
                $row.parameters = @($ast.ParamBlock.Parameters | ForEach-Object { $_.Name.VariablePath.UserPath })
                if ($row.parameters.Count -ne $inputRecord.parameters.Count) { throw 'New caller parameter count changed.' }
                for ($index=0; $index -lt $inputRecord.parameters.Count; $index++) {
                  if ($row.parameters[$index] -cne $inputRecord.parameters[$index]) { throw 'New caller parameter name/order changed.' }
                }
                $row.parsed=$true
              } catch { $row.failure_type=$_.Exception.GetType().FullName; throw }
            }
            $report.status='new_caller_parse_and_parameter_names_passed'
          } catch { $report.failure_type=$_.Exception.GetType().FullName }
          finally { [IO.File]::WriteAllText($parsePath,($report | ConvertTo-Json -Depth 8),[Text.UTF8Encoding]::new($false)) }
          if ($report.status -cne 'new_caller_parse_and_parameter_names_passed') { throw 'Pre-account parser/attempt guard refused; no account site was invoked.' }
      - name: Run frozen historical and current component pure controls
        shell: pwsh
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          & $env:T2_SAFE_CONTROLLER -I -B -m pytest -q -p no:cacheprovider --noconftest -c "$env:RUNNER_TEMP/saved-store-build-safe-pytest.ini" --junitxml="$env:RUNNER_TEMP/saved-store-component-pure.xml" tests/test_windows_saved_store_account_inputs_v2.py tests/test_windows_saved_store_build_projection.py tests/test_windows_saved_store_build_preflight.py tests/test_windows_saved_store_wheel_profiles.py tests/test_windows_saved_store_profile_workflow.py tests/test_windows_saved_store_component_adapter.py tests/test_windows_saved_store_component_route.py 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/saved-store-component-pure.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe safe prerequisite then future reviewed standard-primary fixture
        shell: pwsh
        env:
          T2_EVENT_NAME: ${{ github.event_name }}
          T2_EVENT_SHA: ${{ github.sha }}
          T2_EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          T2_EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $script = (Resolve-Path experiments/platform/windows_saved_store_build_preflight_v3.ps1).Path
          $repo = (Get-Location).Path
          $launch = [ordered]@{ status = 'launch_started'; exit_code = $null; failure_type = $null; failure_line = $null; account_tail_attempted = $false; accounts_or_credentials_created = $null; t2_d3_gate = 'unpassed'; production_port_allowed = $false }
          $launchPath = "$env:RUNNER_TEMP/saved-store-component-launch.json"
          $launch | ConvertTo-Json | Set-Content -LiteralPath $launchPath -Encoding utf8
          try {
            & $script -Repo $repo -ControllerPython $env:T2_SAFE_CONTROLLER -Output (Join-Path $env:RUNNER_TEMP 'saved-store-build-safe')
            if ($LASTEXITCODE -ne 0) { throw 'Pre-account cold/build/startup prerequisite refused.' }
            $tail = (Resolve-Path (Join-Path $repo 'experiments/platform/windows_saved_store_component_account_tail_v1.ps1')).Path
            $launch.account_tail_attempted = $true
            & $tail -Repo $repo -ControllerPython $env:T2_SAFE_CONTROLLER
            $launch.exit_code = 0
            $launch.status = 'launch_returned'
          } catch { $launch.failure_type = $_.Exception.GetType().FullName; $launch.failure_line = $_.InvocationInfo.ScriptLineNumber }
          finally {
            $fixtureReport = Join-Path $env:RUNNER_TEMP 'saved-store-build-safe/account-fixture/fixture.json'
            if (Test-Path -LiteralPath $fixtureReport) {
              try { $observed = [IO.File]::ReadAllText($fixtureReport) | ConvertFrom-Json -AsHashtable; if ($observed.account_sid) { $launch.accounts_or_credentials_created = $true } } catch { }
            } elseif (-not $launch.account_tail_attempted) { $launch.accounts_or_credentials_created = $false }
            $launch | ConvertTo-Json | Set-Content -LiteralPath $launchPath -Encoding utf8
          }
          if ($launch.exit_code -ne 0 -or $launch.failure_type) { throw 'Account-free component preflight refused; inspect raw artifacts.' }
      - name: Retain partial refusals source controls and wheel
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: saved-store-component-account-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/saved-store-component-bootstrap.json
            ${{ runner.temp }}/saved-store-component-account-parse.json
            ${{ runner.temp }}/saved-store-component-pure.xml
            ${{ runner.temp }}/saved-store-component-pure.txt
            ${{ runner.temp }}/saved-store-component-launch.json
            ${{ runner.temp }}/saved-store-build-safe/*.json
            ${{ runner.temp }}/saved-store-build-safe/*.txt
            ${{ runner.temp }}/saved-store-build-safe/account-fixture/
            ${{ runner.temp }}/saved-store-build-safe/cold/
            ${{ runner.temp }}/saved-store-build-safe/component/
            ${{ runner.temp }}/saved-store-build-safe/protocol/
            ${{ runner.temp }}/saved-store-build-safe/source/
            ${{ runner.temp }}/saved-store-build-safe/wheel/*.whl
          if-no-files-found: warn
