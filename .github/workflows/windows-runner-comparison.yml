name: Bounded Windows runner comparison

# Review draft: this workflow must be installed on main before dispatch.
# One dispatch runs one standard job and one explicitly configured paid job.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full SHA of the frozen candidate to compare
        required: true
        type: string
      larger_runner:
        description: Exact label of the authorized 8-core Windows x64 runner
        required: true
        type: string

permissions:
  contents: read

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: standard
            runner: windows-latest
          - kind: larger
            runner: ${{ inputs.larger_runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Validate frozen candidate and retain hardware identity
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          COMPARISON_KIND: ${{ matrix.kind }}
        run: |
          if ($env:CANDIDATE_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw 'A full lowercase commit SHA is required'
          }
          $cpu = Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors
          $memory = (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory
          $identity = @{cpu=$cpu; memory_bytes=$memory; image_os=$env:ImageOS; image_version=$env:ImageVersion; candidate=$env:CANDIDATE_SHA}
          $identity | ConvertTo-Json -Depth 5 | Tee-Object -FilePath "$env:RUNNER_TEMP/comparison-hardware.json"
          if ($env:COMPARISON_KIND -eq 'larger' -and ($cpu | Measure-Object -Property NumberOfLogicalProcessors -Sum).Sum -ne 8) {
            throw 'The paid comparison requires exactly 8 logical processors'
          }
      - name: Preserve Git source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'
      - name: Build and prepare identical measurement environments
        shell: bash
        run: |
          python -m pip install 'build==1.3.0' 'setuptools>=77'
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/comparison-venv"
          python - <<'PY'
          import os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'comparison-venv'
          python = root / 'Scripts/python.exe'
          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve().as_uri()
          subprocess.run([str(python), '-m', 'pip', 'install', '-c', 'requirements-workflow.lock', '-c', 'requirements-voyage.lock', '-c', 'requirements-mcp.lock', '-c', 'requirements-tokens.lock', '-c', 'requirements-redis.lock', 'pytest==9.1.1', 'coverage==7.13.5', 'attune-harness[voyage,redis] @ ' + wheel], check=True)
          with (pathlib.Path(os.environ['RUNNER_TEMP']) / 'comparison-packages.txt').open('w') as output:
              subprocess.run([str(python), '-m', 'pip', 'freeze', '--all'], stdout=output, check=True)
          PY
      - name: Measure unchanged Windows platform selection
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          python = root / 'comparison-venv' / 'Scripts/python.exe'
          subprocess.run([str(python), 'scripts/measure_coverage.py', '--output', str(root / 'comparison-result'), '--suite', 'platform'], check=True)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-comparison-${{ matrix.kind }}
          path: |
            ${{ runner.temp }}/comparison-result/
            ${{ runner.temp }}/comparison-hardware.json
            ${{ runner.temp }}/comparison-packages.txt
          include-hidden-files: true
          if-no-files-found: error
