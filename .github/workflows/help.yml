name: Help Center

on:
  pull_request:
    paths: ['help/**', 'scripts/build_help.py', 'tests/test_help_center.py', '.github/workflows/help.yml']
  push:
    branches: [main]
    paths: ['help/**', 'scripts/build_help.py', 'tests/test_help_center.py', '.github/workflows/help.yml']

permissions:
  contents: read

jobs:
  static-help:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install documentation build dependencies
        run: python -m pip install -r help/requirements.txt 'pytest==9.1.1'
      - name: Check the renderer and rendered routes
        run: python -m pytest -q tests/test_help_center.py
      - name: Build the portable static site
        run: python scripts/build_help.py --output "$RUNNER_TEMP/harness-help-site"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-help-center
          path: ${{ runner.temp }}/harness-help-site/
          if-no-files-found: error
