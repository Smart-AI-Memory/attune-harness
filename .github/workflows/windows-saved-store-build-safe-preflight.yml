name: Saved-store safe build and module preflight

# Four safe observations only; no account/GUI/storage fixture is reachable.
on:
  pull_request:
    paths:
      - 'experiments/platform/windows_saved_store_standard_user_gui_proposal_v3b3.ps1'
      - 'experiments/platform/windows_saved_store_gui_lease_helper_v4.ps1'
      - 'experiments/platform/windows_saved_store_helper_cold_compile_v1.ps1'
      - 'experiments/platform/windows_saved_store_combined_driver_v1.py'
      - 'experiments/platform/windows_saved_store_proof.py'
      - 'experiments/platform/windows_saved_store_namespace_witness_v4.py'
      - 'src/attune_harness/windows_effects.py'
      - 'experiments/platform/windows_saved_store_combined_driver_v2.py'
      - 'experiments/platform/windows_saved_store_source_manifest_v2.json'
      - 'experiments/platform/check_windows_saved_store_account_inputs_v2.py'
      - 'experiments/platform/check_windows_saved_store_merge_inputs_v1.py'
      - 'experiments/platform/project_windows_saved_store_build_v1.py'
      - '.github/workflows/windows-saved-store-reviewed-execution.yml'
      - 'experiments/platform/windows_saved_store_build_preflight_v1.ps1'
      - '.gitattributes'
      - 'tests/test_windows_saved_store_build_projection.py'
      - 'tests/test_windows_saved_store_account_inputs_v2.py'
      - 'tests/test_windows_saved_store_build_preflight.py'
      - '.github/workflows/windows-saved-store-build-safe-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/platform/windows_saved_store_standard_user_gui_proposal_v3b3.ps1'
      - 'experiments/platform/windows_saved_store_gui_lease_helper_v4.ps1'
      - 'experiments/platform/windows_saved_store_helper_cold_compile_v1.ps1'
      - 'experiments/platform/windows_saved_store_combined_driver_v1.py'
      - 'experiments/platform/windows_saved_store_proof.py'
      - 'experiments/platform/windows_saved_store_namespace_witness_v4.py'
      - 'src/attune_harness/windows_effects.py'
      - 'experiments/platform/windows_saved_store_combined_driver_v2.py'
      - 'experiments/platform/windows_saved_store_source_manifest_v2.json'
      - 'experiments/platform/check_windows_saved_store_account_inputs_v2.py'
      - 'experiments/platform/check_windows_saved_store_merge_inputs_v1.py'
      - 'experiments/platform/project_windows_saved_store_build_v1.py'
      - '.github/workflows/windows-saved-store-reviewed-execution.yml'
      - 'experiments/platform/windows_saved_store_build_preflight_v1.ps1'
      - '.gitattributes'
      - 'tests/test_windows_saved_store_build_projection.py'
      - 'tests/test_windows_saved_store_account_inputs_v2.py'
      - 'tests/test_windows_saved_store_build_preflight.py'
      - '.github/workflows/windows-saved-store-build-safe-preflight.yml'

permissions:
  contents: read

concurrency:
  group: saved-store-build-safe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  safe-preflight:
    name: Safe build only / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Materialize and verify finite source inputs at the normal merge
        shell: pwsh
        env:
          T2_EVENT_NAME: ${{ github.event_name }}
          T2_EVENT_SHA: ${{ github.sha }}
          T2_EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          T2_EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = [ordered]@{
            'experiments/platform/windows_saved_store_standard_user_gui_proposal_v3b3.ps1' = '696879df5b141def393235708f3a2baf0e8c9bb1cdb24d125082b53bc81a5804'
            'experiments/platform/windows_saved_store_gui_lease_helper_v4.ps1' = '5786e2eefbb6e61f65ef4caaf17a4668ad7dd14ae8f552d72dffcc21845729bf'
            'experiments/platform/windows_saved_store_helper_cold_compile_v1.ps1' = '496275b061b807302281834e036546361b5a1aa3651a3553c553b23db4db6885'
            'experiments/platform/windows_saved_store_combined_driver_v1.py' = 'e3aa0931328aabd2541b64b21f717c478b8121278dc7d10bb597e0cb0cf41937'
            'experiments/platform/windows_saved_store_proof.py' = 'b233497ffe18973eca3a4db29b2eca7ee5269c4ae2ef78429a8cf10db1ce7355'
            'experiments/platform/windows_saved_store_namespace_witness_v4.py' = 'f326803457453fccf02b795144ef1a48986c4c7068eef87aa56d21591ddd643e'
            'src/attune_harness/windows_effects.py' = 'ffc46d2f054a7bcf6c95230551a87fb5c73d9992ecebdde9497d2226d0763139'
            'experiments/platform/windows_saved_store_combined_driver_v2.py' = 'b61a452cb8f59862cee4a366510b74c73544d62e83dc4a81288e28b82e717ca0'
            'experiments/platform/windows_saved_store_source_manifest_v2.json' = 'd6e80ebd18c19d5b17b35bfdd4c0dc521a24e1dbb0a18eeba14247fcd7e875d8'
            'experiments/platform/check_windows_saved_store_account_inputs_v2.py' = '7fc6169c570d65d4493d70443ca27cb643d9127d8a3c416ac7cd7636388eb6be'
            'experiments/platform/check_windows_saved_store_merge_inputs_v1.py' = '91d373245ace997eca32725ceea73f2131ef3ac1f39f5194f423f4cf15351559'
            'experiments/platform/project_windows_saved_store_build_v1.py' = '3a3aa7a53cdb53b8421d6116bdd0160757967b3472e6a39052987971828f20d8'
            '.github/workflows/windows-saved-store-reviewed-execution.yml' = '30e11a181edf79eecb0667686d2da540fe9c7047829dc31ddaa50e23d88dfc6e'
            'experiments/platform/windows_saved_store_build_preflight_v1.ps1' = '02a1475590060160c1209db3a8c98e63340e7e5be8680b7b6f945c0fda38f5a3'
            '.gitattributes' = '1cf8827a8b0ab0724e7b0031a241930aa7b0edcf9adb7d813f17b3a624e79fe5'
            'tests/test_windows_saved_store_build_projection.py' = '1bc16cf178c99a5ba6940849cb493ccac82c576578f6dc5c386193cb1db5e181'
            'tests/test_windows_saved_store_account_inputs_v2.py' = '6fbe500f7bee3945a3e2817241b805464a9c8b127124b5b54fb6589843827382'
            'tests/test_windows_saved_store_build_preflight.py' = 'e1844d0b7c5286115c397ece23b00fe587788359b39274bef6cf05d3ccbb2b0d'
          }
          # Command-local canonical bytes, including the new script and YAML;
          # final v3b .gitattributes remains byte-identical.
          git -c core.autocrlf=false checkout-index --force -- @($expected.Keys)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rows = [Collections.Generic.List[object]]::new()
          foreach ($path in $expected.Keys) {
            $row = [ordered]@{ path = $path; expected_sha256 = $expected[$path]; actual_sha256 = $null; matched = $false; failure_type = $null }
            try { $row.actual_sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant(); $row.matched = $row.actual_sha256 -ceq $expected[$path] } catch { $row.failure_type = $_.Exception.GetType().FullName }
            $rows.Add($row)
            [ordered]@{ status = 'safe_inputs_observed'; sources = $rows.ToArray(); fixture_invoked = $false; accounts_or_credentials_created = $false; t2_d3_gate = 'unpassed'; production_port_allowed = $false } | ConvertTo-Json -Depth 6 | Set-Content "$env:RUNNER_TEMP/saved-store-build-safe-inputs.json" -Encoding utf8
          }
          if (@($rows | Where-Object { -not $_.matched }).Count) { throw 'Safe source identity refused.' }
          python -I experiments/platform/check_windows_saved_store_merge_inputs_v1.py --repo (Get-Location).Path --output "$env:RUNNER_TEMP/saved-store-build-safe-merge.json"
          if ($LASTEXITCODE -ne 0) { throw 'Normal merged provenance refused.' }
          python -I -c "import json,subprocess; m=json.load(open('experiments/platform/windows_saved_store_source_manifest_v2.json',encoding='ascii')); subprocess.run(['git','-c','core.autocrlf=false','checkout-index','--force','--',*m['modules'],*m['build_inputs']],check=True)"
          if ($LASTEXITCODE -ne 0) { throw 'Canonical 116-input materialization refused.' }
          python -I experiments/platform/check_windows_saved_store_account_inputs_v2.py --repo (Get-Location).Path --manifest experiments/platform/windows_saved_store_source_manifest_v2.json --driver experiments/platform/windows_saved_store_combined_driver_v2.py --output "$env:RUNNER_TEMP/saved-store-build-safe-source116.json"
          if ($LASTEXITCODE -ne 0) { throw 'Complete source closure refused.' }
      - name: Prepare isolated pinned controller tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $controller = Join-Path $env:RUNNER_TEMP 'saved-store-build-safe-controller'
          if (Test-Path -LiteralPath $controller) { throw 'Require new controller environment.' }
          python -I -m venv $controller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $controller 'Scripts/python.exe'
          & $python -I -m pip install 'build==1.3.0' 'setuptools==84.0.0' 'pytest==9.1.1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "T2_SAFE_CONTROLLER=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $config = Join-Path $env:RUNNER_TEMP 'saved-store-build-safe-pytest.ini'
          if (Test-Path -LiteralPath $config) { throw 'Refuse retained test config.' }
          [IO.File]::WriteAllText($config, "[pytest]`n", [Text.UTF8Encoding]::new($false))
      - name: Run pure source and refusal controls without repository conftest
        shell: pwsh
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          & $env:T2_SAFE_CONTROLLER -I -B -m pytest -q -p no:cacheprovider --noconftest -c "$env:RUNNER_TEMP/saved-store-build-safe-pytest.ini" tests/test_windows_saved_store_account_inputs_v2.py tests/test_windows_saved_store_build_projection.py tests/test_windows_saved_store_build_preflight.py 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/saved-store-build-safe-pure-tests.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain all seven exact cold controls without helper construction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cold = (Resolve-Path experiments/platform/windows_saved_store_helper_cold_compile_v1.ps1).Path
          $helper = (Resolve-Path experiments/platform/windows_saved_store_gui_lease_helper_v4.ps1).Path
          & $cold -Helper $helper -Output "$env:RUNNER_TEMP/saved-store-build-safe-cold"
          $report = Get-Content -LiteralPath "$env:RUNNER_TEMP/saved-store-build-safe-cold/diagnostic.json" -Raw | ConvertFrom-Json
          if ($report.status -cne 'cold_compile_completed' -or $report.cases.Count -ne 7 -or
              $report.account_fixture_invoked -cne $false -or $report.accounts_or_credentials_created -cne $false -or
              $report.gui_objects_created -cne $false -or $report.native_helper_constructed -cne $false -or
              $report.storage_witness_invoked -cne $false -or $report.production_port_allowed -cne $false) { throw 'Incomplete cold control evidence.' }
      - name: Observe only finite projection build and equivalent module startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = (Resolve-Path experiments/platform/windows_saved_store_build_preflight_v1.ps1).Path
          $repo = (Get-Location).Path
          $launch = [ordered]@{ status = 'launch_started'; exit_code = $null; failure_type = $null; failure_line = $null; accounts_or_credentials_created = $false; t2_d3_gate = 'unpassed'; production_port_allowed = $false }
          $launchPath = "$env:RUNNER_TEMP/saved-store-build-safe-launch.json"
          $launch | ConvertTo-Json | Set-Content -LiteralPath $launchPath -Encoding utf8
          try {
            & $script -Repo $repo -ControllerPython $env:T2_SAFE_CONTROLLER -Output "$env:RUNNER_TEMP/saved-store-build-safe"
            $launch.exit_code = $LASTEXITCODE
            $launch.status = 'launch_returned'
          } catch { $launch.failure_type = $_.Exception.GetType().FullName; $launch.failure_line = $_.InvocationInfo.ScriptLineNumber }
          finally { $launch | ConvertTo-Json | Set-Content -LiteralPath $launchPath -Encoding utf8 }
          if ($launch.exit_code -ne 0 -or $launch.failure_type) { throw 'Safe preflight refused; inspect raw artifacts.' }
      - name: Retain partial raw captures and all refusal checkpoints
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: saved-store-build-safe-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/saved-store-build-safe-inputs.json
            ${{ runner.temp }}/saved-store-build-safe-merge.json
            ${{ runner.temp }}/saved-store-build-safe-source116.json
            ${{ runner.temp }}/saved-store-build-safe-pure-tests.txt
            ${{ runner.temp }}/saved-store-build-safe-launch.json
            ${{ runner.temp }}/saved-store-build-safe-cold/
            ${{ runner.temp }}/saved-store-build-safe/*.json
            ${{ runner.temp }}/saved-store-build-safe/*.txt
            ${{ runner.temp }}/saved-store-build-safe/source/
            ${{ runner.temp }}/saved-store-build-safe/wheel/*.whl
          if-no-files-found: warn
