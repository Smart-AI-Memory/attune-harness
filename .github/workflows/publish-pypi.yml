name: Build or publish release candidate

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full reviewed commit SHA with passing qualification
        required: true
        type: string
      version:
        description: Exact final or release-candidate version, such as 1.0.0rc1
        required: true
        type: string
      target:
        description: Publish destination; PyPI accepts final and RC versions
        required: true
        type: choice
        options: [pypi, testpypi]
        default: pypi
      publish:
        description: Publish the verified artifacts after environment approval
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pypi-attune-harness
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      distributions_id: ${{ steps.distributions.outputs.artifact-id }}
      distributions_digest: ${{ steps.distributions.outputs.artifact-digest }}
      release_evidence_id: ${{ steps.release-evidence.outputs.artifact-id }}
      release_evidence_digest: ${{ steps.release-evidence.outputs.artifact-digest }}
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TARGET: ${{ inputs.target }}
      PIP_CONFIG_FILE: /dev/null
    steps:
      - name: Validate immutable target
        shell: bash
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$GITHUB_SHA" == "$RELEASE_SHA" ]] || exit 1
          if [[ "$RELEASE_TARGET" == testpypi ]]; then
            [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+rc[1-9][0-9]*$ ]] || exit 1
          else
            [[ "$RELEASE_TARGET" == pypi ]] || exit 1
            [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(rc[1-9][0-9]*)?$ ]] || exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check version, commit, qualification and selected index slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/qualification.yml/runs?head_sha=$RELEASE_SHA&per_page=100" > "$RUNNER_TEMP/qualification-runs.json"
          if [[ "$RELEASE_TARGET" == testpypi ]]; then
            python scripts/check_testpypi_rehearsal.py preflight --runs "$RUNNER_TEMP/qualification-runs.json" --output "$RUNNER_TEMP/release-evidence"
          else
            python scripts/check_release_candidate.py --runs "$RUNNER_TEMP/qualification-runs.json" --output "$RUNNER_TEMP/release-evidence"
          fi
      - name: Require existing TestPyPI environment before any publish job
        if: inputs.publish && inputs.target == 'testpypi'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/testpypi" --jq '.name' | grep -Fx testpypi
      - name: Build and validate distributions
        run: |
          python -m pip --isolated --disable-pip-version-check install --no-cache-dir --index-url https://pypi.org/simple/ "build==1.3.0" "setuptools>=77" "twine==7.0.0"
          # The commit's own time, so two builds of one commit produce the same
          # wheel. The setuptools sdist ignores it and still differs per build.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python -m build
          python -m twine check --strict dist/*
          python -m venv "$RUNNER_TEMP/release-core"
          "$RUNNER_TEMP/release-core/bin/python" -m pip --isolated --disable-pip-version-check install --no-index --no-deps dist/*.whl
          python scripts/check_installed.py --python "$RUNNER_TEMP/release-core/bin/python" --mode core --report "$RUNNER_TEMP/release-evidence/core.json"
          # The gate reads memory through the native reader from the --no-deps wheel (Phase 2, D19): the receipt must say so.
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); m=d["memory"]; assert m["native_reader"]=="available" and m["tiers_read"]==["raw"] and m["reader_named"]=="native", m; verbs={c["arguments"][3] for c in d["cases"] if c["arguments"][:1]==["memory"] and len(c["arguments"])>3}; assert {"recall","resolve","refresh","capabilities"} <= verbs, sorted(verbs)' "$RUNNER_TEMP/release-evidence/core.json"
          # The R2 journey from the --no-deps wheel (spec authority Task 4, D23.1): the draft opens and status reads it; accept and review refuse with the install hint; build refuses for want of accepted authority.
          python -c 'import json,sys; j=json.load(open(sys.argv[1]))["journey"]; hint="is missing; reinstall with: pip install --force-reinstall attune-harness"; assert j["forms_installed"] is False and j["plan"]=="draft" and j["accept"]=="refused: attune-forms "+hint and j["build"]=="refused: Effects require current accepted work authority" and j["review"].startswith("refused: ") and j["review"].endswith(hint) and j["status"]=="draft", j' "$RUNNER_TEMP/release-evidence/core.json"
          # The install a user gets (D23.1): the same wheel with its base dependencies from the index under the lock files, attune absent, and the whole journey through it: plan, accept, build with two command participants, review, status.
          python -m venv "$RUNNER_TEMP/release-with-deps"
          "$RUNNER_TEMP/release-with-deps/bin/python" -m pip --isolated --disable-pip-version-check install --no-cache-dir --index-url https://pypi.org/simple/ -c requirements-workflow.lock -c requirements-voyage.lock -c requirements-mcp.lock -c requirements-tokens.lock -c requirements-redis.lock dist/*.whl
          python scripts/check_installed.py --python "$RUNNER_TEMP/release-with-deps/bin/python" --mode all --report "$RUNNER_TEMP/release-evidence/with-deps.json"
          python -c 'import json,sys; j=json.load(open(sys.argv[1]))["journey"]; assert j["forms_installed"] is True and j["plan"]=="draft" and j["accept"]=="accepted" and j["build"]=="completed" and j["controls_run"]==["control:baseline"] and j["review"]=="completed" and j["status"]=="completed" and j["adapters"]==["command","deterministic"] and j["model_calls"]==0, j' "$RUNNER_TEMP/release-evidence/with-deps.json"
          sha256sum dist/* > "$RUNNER_TEMP/release-evidence/SHA256SUMS"
          python - <<'PY'
          import hashlib, json, os, pathlib
          files = {p.name: {'sha256': hashlib.sha256(p.read_bytes()).hexdigest(), 'size': p.stat().st_size} for p in pathlib.Path('dist').iterdir()}
          manifest = {'schema_version': 1, 'repository': os.environ['GITHUB_REPOSITORY'], 'workflow_run_id': int(os.environ['GITHUB_RUN_ID']), 'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']), 'commit': os.environ['RELEASE_SHA'], 'version': os.environ['RELEASE_VERSION'], 'target': os.environ['RELEASE_TARGET'], 'files': files}
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'release-evidence/windows-consumer-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
          if [[ "$RELEASE_TARGET" == testpypi ]]; then
            python scripts/check_testpypi_rehearsal.py manifest --dist dist --output "$RUNNER_TEMP/release-evidence/artifact-manifest.json"
            python scripts/check_testpypi_rehearsal.py verify-local --manifest "$RUNNER_TEMP/release-evidence/artifact-manifest.json" --dist dist
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: distributions
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: release-evidence
        if: always()
        with:
          name: release-evidence
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: warn

  windows-release-wheel:
    name: Release wheel / ${{ matrix.os }} / Python 3.12
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    env:
      PYTHONUTF8: '1'
      RELEASE_SHA: ${{ inputs.release_sha }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TARGET: ${{ inputs.target }}
      DISTRIBUTIONS_ID: ${{ needs.build.outputs.distributions_id }}
      DISTRIBUTIONS_DIGEST: ${{ needs.build.outputs.distributions_digest }}
      RELEASE_EVIDENCE_ID: ${{ needs.build.outputs.release_evidence_id }}
      RELEASE_EVIDENCE_DIGEST: ${{ needs.build.outputs.release_evidence_digest }}
      WINDOWS_RELEASE_DIST: ${{ runner.temp }}/release-windows-distributions
      WINDOWS_RELEASE_BUILD_EVIDENCE: ${{ runner.temp }}/release-windows-build-evidence
      WINDOWS_RELEASE_EVIDENCE: ${{ runner.temp }}/release-windows-evidence
      WINDOWS_RELEASE_NATIVE_OUTPUT: ${{ runner.temp }}/release-windows-evidence/native
    steps:
      - name: Preserve canonical Git bytes before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_id }}
          merge-multiple: true
          digest-mismatch: error
          path: ${{ env.WINDOWS_RELEASE_DIST }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.release_evidence_id }}
          merge-multiple: true
          digest-mismatch: error
          path: ${{ env.WINDOWS_RELEASE_BUILD_EVIDENCE }}
      - name: Verify same-run distributions and canonical source before installation
        shell: bash
        run: python -I scripts/check_windows_release_wheel.py --dist "$WINDOWS_RELEASE_DIST" --evidence "$WINDOWS_RELEASE_BUILD_EVIDENCE" --output "$WINDOWS_RELEASE_EVIDENCE/archive.json"
      - name: Create fresh supported-profile environment
        shell: pwsh
        run: |
          $profileRoot = Join-Path $env:RUNNER_TEMP 'release-windows-base'
          python -m venv $profileRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Resolve-Path "$profileRoot/Scripts").Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install the verified wheel with normal qualification dependencies
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys
          wheel = pathlib.Path(os.environ['WINDOWS_RELEASE_DIST']) / ('attune_harness-' + os.environ['RELEASE_VERSION'] + '-py3-none-any.whl')
          subprocess.run([sys.executable, '-m', 'pip', '--isolated', '--disable-pip-version-check', 'install', '--no-cache-dir', '--index-url', 'https://pypi.org/simple/', '-c', 'requirements-workflow.lock', '-c', 'requirements-voyage.lock', '-c', 'requirements-mcp.lock', '-c', 'requirements-tokens.lock', '-c', 'requirements-redis.lock', 'pytest==9.1.1', 'attune-harness[voyage,redis] @ ' + wheel.resolve().as_uri()], check=True)
          PY
          python -m pip check
          python -m pip list --format=json > "$WINDOWS_RELEASE_EVIDENCE/base-dependencies.json"
          python -I scripts/check_windows_release_wheel.py --installed --dist "$WINDOWS_RELEASE_DIST" --evidence "$WINDOWS_RELEASE_BUILD_EVIDENCE" --output "$WINDOWS_RELEASE_EVIDENCE/base-before.json"
      - name: Retain the unchanged native Windows startup diagnostic
        shell: pwsh
        run: |
          $diagnosticExit = 1
          try {
            python -I experiments/platform/diagnose_windows_environment.py
            $diagnosticExit = $LASTEXITCODE
          } finally {
            $source = Join-Path $env:GITHUB_WORKSPACE 'windows-environment-diagnostic'
            if (Test-Path $source) {
              Move-Item -LiteralPath $source -Destination (Join-Path $env:WINDOWS_RELEASE_EVIDENCE 'startup-diagnostic') -ErrorAction Stop
            }
          }
          exit $diagnosticExit
      - name: Qualify this installed release wheel without instrumentation
        shell: bash
        run: python -I scripts/qualify_platform.py --output "$WINDOWS_RELEASE_EVIDENCE/base"
      - name: Require the existing negative environment guard witness
        shell: bash
        run: |
          python -I experiments/platform/check_windows_environment_guard.py --output "$WINDOWS_RELEASE_EVIDENCE/base/environment-guard"
          python -I scripts/check_windows_release_wheel.py --installed --dist "$WINDOWS_RELEASE_DIST" --evidence "$WINDOWS_RELEASE_BUILD_EVIDENCE" --output "$WINDOWS_RELEASE_EVIDENCE/base-after.json"
      # Separate SDK component profile: preserve the base qualifier's absence guard.
      - name: Create fresh optional native SDK environment
        shell: pwsh
        run: |
          $profileRoot = Join-Path $env:RUNNER_TEMP 'release-windows-native'
          python -m venv $profileRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Resolve-Path "$profileRoot/Scripts").Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install the same verified wheel with only the native SDK extra
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys
          wheel = pathlib.Path(os.environ['WINDOWS_RELEASE_DIST']) / ('attune_harness-' + os.environ['RELEASE_VERSION'] + '-py3-none-any.whl')
          subprocess.run([sys.executable, '-m', 'pip', '--isolated', '--disable-pip-version-check', 'install', '--no-cache-dir', '--index-url', 'https://pypi.org/simple/', '-c', 'requirements-workflow.lock', '-c', 'requirements-mcp.lock', '-c', 'requirements-tokens.lock', '-c', 'requirements-voyage.lock', '-c', 'requirements-redis.lock', 'pytest==9.1.1', 'attune-harness[memory-native] @ ' + wheel.resolve().as_uri()], check=True)
          PY
          python -m pip check
          python -m pip list --format=json > "$WINDOWS_RELEASE_EVIDENCE/native-dependencies.json"
          python -I scripts/check_windows_release_wheel.py --installed --dist "$WINDOWS_RELEASE_DIST" --evidence "$WINDOWS_RELEASE_BUILD_EVIDENCE" --output "$WINDOWS_RELEASE_EVIDENCE/native-before.json"
      - name: Retain the installed native SDK runtime identity
        shell: bash
        run: |
          python -I - "$WINDOWS_RELEASE_NATIVE_OUTPUT" <<'PY'
          import sys
          import hashlib,json,pathlib,platform,runpy; check=runpy.run_path('scripts/qualify_platform.py'); source=check['installed_source'](); from attune_harness.memory_native import runtime_identity; out=pathlib.Path(sys.argv[1]); out.mkdir(); (out/'runtime.json').write_text(json.dumps({'installed_source':str(source),'system':platform.system(),'machine':platform.machine(),'runtime':runtime_identity(),'memory_native_sha256':hashlib.sha256((source/'memory_native.py').read_bytes()).hexdigest()},sort_keys=True,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Exercise the existing offline native SDK component selection
        timeout-minutes: 15
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          HARNESS_REQUIRE_NATIVE_SDK: '1'
          HARNESS_NATIVE_MEMORY_OUTPUT: ${{ env.WINDOWS_RELEASE_NATIVE_OUTPUT }}/children
        run: python -I -m pytest -vv -o pythonpath= -p no:cacheprovider --junitxml="$WINDOWS_RELEASE_NATIVE_OUTPUT/tests.xml" tests/test_memory_native_sdk.py tests/test_memory_native_boundaries.py
      - name: Require all existing offline native SDK witnesses
        shell: bash
        run: |
          python -I - "$WINDOWS_RELEASE_NATIVE_OUTPUT" <<'PY'
          import sys
          import json,pathlib,xml.etree.ElementTree as E; out=pathlib.Path(sys.argv[1]); suites=E.parse(out/'tests.xml').getroot().findall('testsuite'); assert suites and sum(int(s.get('tests','0')) for s in suites)==94 and all(int(s.get(k,'0'))==0 for s in suites for k in ('failures','errors','skipped')); witnesses=[json.loads(p.read_bytes()) for p in (out/'children').glob('*.json')]; assert len(witnesses)==13; assert sum(w['offline_sdk_requests'] for w in witnesses)==12; assert all(w['external_network_attempts']==w['live_provider_model_calls']==w['home_lookups']==0 and len(w['network_guard_checks'])==4 and len(w['interpreter_argv'])==len(w['supervisor_requested_argv'])==5 for w in witnesses); control=json.loads((out/'children/controls/process-exit.json').read_bytes()); assert control['before_gate']['terminated'] is False and control['after_gate']['terminated'] is True and control['reference_closed'] is True and control['marker']=='escaped'; exits=[w for w in witnesses if w.get('descendant_spawned')]; assert len(exits)==1 and exits[0]['descendant_exit_observation']['terminated'] is True; assert exits[0]['descendant_marker_pid']==exits[0]['descendant_reference']['pid']==exits[0]['descendant_exit_observation']['pid']; assert control['marker_pid']==control['before_gate']['pid']==control['after_gate']['pid']; methods=('retained-process-handle',) if json.loads((out/'runtime.json').read_bytes())['system']=='Windows' else ('os-process-identity','pidfd'); assert exits[0]['descendant_exit_observation']['method'] in methods; (out/'summary.json').write_text(json.dumps({'status':'offline_software_checks_passed','child_witnesses':len(witnesses),'offline_sdk_requests':sum(w['offline_sdk_requests'] for w in witnesses),'live_provider_model_calls':0,'external_network_attempts':0,'live_model_quality':'not_qualified'},sort_keys=True,indent=2)+'\n',encoding='utf-8')
          PY
          python -I scripts/check_windows_release_wheel.py --installed --dist "$WINDOWS_RELEASE_DIST" --evidence "$WINDOWS_RELEASE_BUILD_EVIDENCE" --output "$WINDOWS_RELEASE_EVIDENCE/native-after.json"
      - name: Keep exact release-wheel Windows evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wheel-${{ matrix.os }}-3.12
          path: ${{ env.WINDOWS_RELEASE_EVIDENCE }}/
          include-hidden-files: true
          if-no-files-found: error

  publish:
    if: inputs.publish && inputs.target == 'pypi'
    needs: [build, windows-release-wheel]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish_testpypi:
    if: inputs.publish && inputs.target == 'testpypi'
    needs: [build, windows-release-wheel]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence
          path: release-evidence/
      - name: Match reviewed run and artifact bytes before OIDC upload
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          manifest = json.loads(Path('release-evidence/artifact-manifest.json').read_text())
          assert manifest['schema_version'] == 1 and manifest['target'] == 'testpypi'
          assert manifest['project'] == 'attune-harness'
          assert manifest['commit'] == os.environ['RELEASE_SHA']
          assert manifest['version'] == os.environ['RELEASE_VERSION']
          assert manifest['workflow_run_id'] == int(os.environ['GITHUB_RUN_ID'])
          assert manifest['workflow_run_attempt'] == int(os.environ['GITHUB_RUN_ATTEMPT'])
          expected_names = {
              f"attune_harness-{manifest['version']}-py3-none-any.whl",
              f"attune_harness-{manifest['version']}.tar.gz",
          }
          assert set(manifest['files']) == expected_names
          files = sorted(Path('dist').iterdir())
          assert len(files) == 2 and {p.name for p in files} == set(manifest['files'])
          for path in files:
              assert path.is_file() and not path.is_symlink()
              expected = manifest['files'][path.name]
              assert path.stat().st_size == expected['size']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected['sha256']
          PY
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  verify_testpypi:
    if: inputs.publish && inputs.target == 'testpypi'
    needs: publish_testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      RELEASE_VERSION: ${{ inputs.version }}
      PIP_CONFIG_FILE: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence
          path: release-evidence/
      - name: Download exact TestPyPI files and verify independent installs
        shell: bash
        run: |
          python scripts/check_testpypi_rehearsal.py verify-local --manifest release-evidence/artifact-manifest.json --dist dist
          python scripts/check_testpypi_rehearsal.py fetch --manifest release-evidence/artifact-manifest.json --output "$RUNNER_TEMP/testpypi-downloaded" --receipt "$RUNNER_TEMP/testpypi-download.json"
          wheel="$RUNNER_TEMP/testpypi-downloaded/attune_harness-${RELEASE_VERSION}-py3-none-any.whl"
          sdist="$RUNNER_TEMP/testpypi-downloaded/attune_harness-${RELEASE_VERSION}.tar.gz"
          python -m venv "$RUNNER_TEMP/testpypi-wheel"
          "$RUNNER_TEMP/testpypi-wheel/bin/python" -m pip --isolated --disable-pip-version-check install --no-index --no-deps "$wheel"
          python scripts/check_installed.py --python "$RUNNER_TEMP/testpypi-wheel/bin/python" --mode core --report "$RUNNER_TEMP/testpypi-wheel-core.json"
          "$RUNNER_TEMP/testpypi-wheel/bin/python" -I -c 'import importlib.metadata,sys; assert importlib.metadata.version("attune-harness")==sys.argv[1]' "$RELEASE_VERSION"
          python -m venv "$RUNNER_TEMP/testpypi-sdist"
          "$RUNNER_TEMP/testpypi-sdist/bin/python" -m pip --isolated --disable-pip-version-check install --no-cache-dir --index-url https://pypi.org/simple/ 'setuptools>=77' 'wheel==0.45.1'
          "$RUNNER_TEMP/testpypi-sdist/bin/python" -m pip --isolated --disable-pip-version-check install --no-index --no-deps --no-build-isolation "$sdist"
          python scripts/check_installed.py --python "$RUNNER_TEMP/testpypi-sdist/bin/python" --mode core --report "$RUNNER_TEMP/testpypi-sdist-core.json"
          "$RUNNER_TEMP/testpypi-sdist/bin/python" -I -c 'import importlib.metadata,sys; assert importlib.metadata.version("attune-harness")==sys.argv[1]' "$RELEASE_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: testpypi-download-evidence
          path: ${{ runner.temp }}/testpypi-*.json
          if-no-files-found: warn
